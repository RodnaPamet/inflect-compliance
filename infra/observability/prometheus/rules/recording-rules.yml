# =============================================================================
# Prometheus recording rules — inflect-compliance.
# -----------------------------------------------------------------------------
# Pre-compute the expensive / frequently-queried PromQL so dashboards and
# alerts stay cheap. Naming follows the level:metric:operation convention.
#
# Metric names, as the collector's Prometheus exporter writes them. The OTel
# instrument's dotted name becomes underscores, its unit is appended
# (ms -> milliseconds; unit `1` adds nothing), a counter gets `_total`, and a
# GAUGE whose unit is `1` gets `_ratio`. Attribute keys become labels the same
# way (job.status -> job_status). Every app series also carries the resource
# attributes as labels: service_name, service_version, deployment_environment,
# host_name, os_type.
#   api.request.count      -> api_request_count_total   {http_method, http_route, http_status_code}
#   api.request.duration   -> api_request_duration_milliseconds_{bucket,sum,count}
#   api.request.errors     -> api_request_errors_total  {http_method, http_route, error_code}
#   repo.method.duration   -> repo_method_duration_milliseconds_{bucket,sum,count}
#   repo.method.calls      -> repo_method_calls_total   {repo_method, outcome}
#   repo.method.errors     -> repo_method_errors_total  {repo_method, error_type}
#   job.execution.count    -> job_execution_count_total {job_name, job_status: success|failure}
#   job.execution.duration -> job_execution_duration_milliseconds_{bucket,sum,count}
#   job.queue.depth        -> job_queue_depth_ratio     {queue_name, queue_state}
#   audit_stream.delivery.failures -> audit_stream_delivery_failures_total {http_status_code}
#
# tests/unit/prometheus-rules-match-emitted-metrics.test.ts derives these names
# and labels from src/ and the collector config, and fails if a rule here
# selects a metric, label or value the stack does not export.
#
# Ratios divide by `(denominator > 0)`. They used `clamp_min(denominator, 1)`,
# which turns every rate below 1/s into 1/s: at 0.1 requests/s a ratio or a
# mean read a tenth of its real value. With no traffic a ratio is now absent,
# and `numerator or denominator * 0` makes it 0 when there is traffic but no
# failure, rather than absent.
# =============================================================================

groups:

  # ---------------------------------------------------------------------------
  # API — the RED method (Rate, Errors, Duration).
  # ---------------------------------------------------------------------------
  - name: inflect_api_red
    interval: 30s
    rules:
      # Request rate (req/s), per service.
      - record: job:api_request:rate5m
        expr: sum by (service_name) (rate(api_request_count_total[5m]))

      # Errors a handler threw (errors/s), per service, whatever status they
      # map to: withApiErrorHandling calls recordRequestError for a 404 or a
      # 422 as well as a 500. Not a 5xx rate — that is the next rule.
      - record: job:api_request_errors:rate5m
        expr: sum by (service_name) (rate(api_request_errors_total[5m]))

      # 5xx responses (req/s), per service, thrown or returned.
      - record: job:api_request_5xx:rate5m
        expr: sum by (service_name) (rate(api_request_count_total{http_status_code=~"5.."}[5m]))

      # 5xx ratio (0..1), per service.
      - record: job:api_request:5xx_ratio5m
        expr: |
          (
            sum by (service_name) (rate(api_request_count_total{http_status_code=~"5.."}[5m]))
            or
            sum by (service_name) (rate(api_request_count_total[5m])) * 0
          )
          /
          (sum by (service_name) (rate(api_request_count_total[5m])) > 0)

      # p95 request latency (ms) over a 5m window.
      - record: job:api_request_duration_ms:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(api_request_duration_milliseconds_bucket[5m]))
          )

      # p99 request latency (ms) over a 5m window.
      - record: job:api_request_duration_ms:p99
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, service_name) (rate(api_request_duration_milliseconds_bucket[5m]))
          )

      # Mean request latency (ms) — sum/count.
      - record: job:api_request_duration_ms:mean5m
        expr: |
          sum by (service_name) (rate(api_request_duration_milliseconds_sum[5m]))
          /
          (sum by (service_name) (rate(api_request_duration_milliseconds_count[5m])) > 0)

  # ---------------------------------------------------------------------------
  # Repository layer — Prisma query health.
  # ---------------------------------------------------------------------------
  - name: inflect_repo
    interval: 30s
    rules:
      - record: job:repo_method:rate5m
        expr: sum by (service_name) (rate(repo_method_calls_total[5m]))

      - record: job:repo_method:error_ratio5m
        expr: |
          (
            sum by (service_name) (rate(repo_method_errors_total[5m]))
            or
            sum by (service_name) (rate(repo_method_calls_total[5m])) * 0
          )
          /
          (sum by (service_name) (rate(repo_method_calls_total[5m])) > 0)

      - record: job:repo_method_duration_ms:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(repo_method_duration_milliseconds_bucket[5m]))
          )

  # ---------------------------------------------------------------------------
  # Background jobs — BullMQ worker.
  # ---------------------------------------------------------------------------
  - name: inflect_jobs
    interval: 30s
    rules:
      # Queue depth (jobs), per queue and BullMQ state. The worker reports it
      # (startQueueDepthReporting, called from scripts/worker.ts) as the
      # `job.queue.depth` gauge; its unit is `1`, hence `_ratio`. Every worker
      # process reports the same Redis-held counts, so `max` across them is the
      # depth, where `sum` would multiply it by the number of workers. The
      # states stay apart: `waiting` and `prioritized` are the backlog,
      # `delayed` holds every job scheduler's next run, `active` is in
      # progress and `failed` is retained history.
      - record: job:job_queue_depth:max
        expr: max by (queue_name, queue_state) (job_queue_depth_ratio)

      # Job execution rate (jobs/s).
      - record: job:job_execution:rate5m
        expr: sum by (service_name) (rate(job_execution_count_total[5m]))

      # Job failure ratio (0..1). recordJobMetrics labels every execution
      # job.status = success | failure.
      - record: job:job_execution:failure_ratio5m
        expr: |
          (
            sum by (service_name) (rate(job_execution_count_total{job_status="failure"}[5m]))
            or
            sum by (service_name) (rate(job_execution_count_total[5m])) * 0
          )
          /
          (sum by (service_name) (rate(job_execution_count_total[5m])) > 0)

      # p95 job execution time (ms).
      - record: job:job_execution_duration_ms:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(job_execution_duration_milliseconds_bucket[5m]))
          )

  # ---------------------------------------------------------------------------
  # Compliance-critical — audit-stream delivery to tenant SIEMs.
  # ---------------------------------------------------------------------------
  - name: inflect_audit_stream
    interval: 30s
    rules:
      - record: job:audit_stream_delivery_failures:rate5m
        expr: sum (rate(audit_stream_delivery_failures_total[5m]))
