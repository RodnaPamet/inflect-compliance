# External uptime monitoring — what is DEPLOYED for inflect-compliance, and why.
#
# This file used to be a provider-agnostic spec naming `app.example.com`, a
# staging monitor, UptimeRobot/Pingdom/Statuscake/Route 53, and PagerDuty
# routing. None of it was ever provisioned, and its reasoning came from a
# Kubernetes deployment this product does not have. Rewritten 2026-09-22
# (#2745) to record what actually runs.
#
# The rewrite is not cosmetic. On 2026-09-20 production was down for roughly
# 25 hours and nothing alerted; it was found only because someone went looking
# for an unrelated reason. The file below describes the monitor that now exists
# so that cannot repeat silently.
#
# ─── WHY /api/readyz, NOT /api/livez ────────────────────────────────────
#
# The previous version of this file said, at length, to probe `/api/livez` and
# NOT `/api/readyz`:
#
#   "readyz returns 503 when ANY internal dependency is down. From an external
#    monitor's perspective, that's noise — internal RDS blips mark the pod
#    NotReady internally (k8s rotates traffic), but the user-perceived service
#    is still up via other healthy pods."
#
# Every clause of that is false here. inflect-compliance is ONE GCE VM running
# docker compose with ONE app container (`docker-compose.prod.yml`). There are
# no pods, no replicas, no ingress controller, no load balancer and no RDS.
# Nothing rotates traffic away from a degraded instance because there is
# nowhere to rotate it to.
#
# So a `readyz` 503 is not noise — it is users getting errors.
#
# AND PROBING ONLY `livez` WOULD HAVE MISSED HALF OF THE 2026-09-20 OUTAGE.
# `livez` is dependency-free and answers 200 whenever the process is running.
# Measured on the live host 2026-09-21:
#
#   /api/livez  -> {"status":"alive", ...}                      (no dependencies)
#   /api/readyz -> {"status":"ready","checks":{"database":{...},
#                   "redis":{...},"storage":{...}},"failed":[]}
#
# Redis crash-looped for 39 hours. `readyz` reports redis per-dependency and
# returns 503 with the component named in `failed`; `livez` would have answered
# "alive" throughout. That is the same silent-success shape this repo keeps
# finding, imported wholesale from another product's architecture.
#
# `livez` remains the right probe for a multi-replica deployment. If
# inflect-compliance ever grows one, revisit this — and re-derive the reasoning
# rather than reinstating the paragraph above.
#
# ─── WHAT IS DEPLOYED ───────────────────────────────────────────────────
#
# GCP Cloud Monitoring, project hazel-design-419410 — the same project that
# already holds the `inflect-compliance` VM, so this needed no new account and
# no third-party vendor.

apiVersion: v1
kind: ExternalUptimeContract
metadata:
  product: inflect-compliance
  deployment: single GCE VM (inflect-compliance, europe-west1-b), docker compose, no replicas
  provider: GCP Cloud Monitoring
  issue: '2745'
  verified: '2026-09-22'

monitors:
  - name: inflect-readyz
    gcp_uptime_check_id: inflect-readyz-Z8mHqntw7b0
    url: https://app.inflect.bg/api/readyz
    method: GET
    interval_seconds: 60
    timeout_seconds: 10
    expect:
      status_class: 2xx
      # Verified against the RAW response body, not a pretty-printed copy:
      # the app emits `{"status":"ready",...}` with no space after the colon.
      # A matcher with a space would never match, and a content matcher that
      # can never match is a check that is permanently failing — which is how
      # a monitor becomes noise and then gets ignored.
      body_contains: '"status":"ready"'
      ssl_valid: true
    # GCP's global setting probes from six regions. Recorded because a
    # single-region check cannot tell an outage from a network partition, and
    # because the alert threshold below is expressed in regions.
    locations_observed:
      - apac-singapore
      - eur-belgium
      - sa-brazil-sao_paulo
      - usa-iowa
      - usa-oregon
      - usa-virginia
    on_failure:
      alert_policy: 'inflect production is not ready (#2745)'
      alert_policy_id: '7157888297974373220'
      # More than one region failing, sustained 60s. One region failing is a
      # network partition to that region; two is the service.
      condition: COUNT_FALSE > 1 over a 300s window, for 60s
      auto_close_seconds: 1800

# ─── NOTIFICATION ──────────────────────────────────────────────────────
#
# The alert policy is ENABLED and has one email notification channel attached
# (channel id 11199896282881593035, an @inflect.bg address). The address lives
# in GCP project config and deliberately NOT in this file.
#
# The channel is named "agrent on-call" because agri-saas provisioned it first
# (#854) and it is the same operator and the same domain. Reused rather than
# duplicated: a second channel to the same inbox would double every message
# without adding a recipient. The NAME is product-specific and the ROUTING is
# not — if the two products ever need different recipients, split it then.
#
# ─── PROVED BY A DRILL, NOT BY REASONING ────────────────────────────────
#
# 2026-09-22: a drill check was pointed at the REAL production endpoint with a
# content matcher containing a sentinel string that can never appear. It got a
# real 200 from the real host and failed the match, so the probe, the six
# regions, the multi-region aggregation, the alert policy and the email channel
# were all exercised exactly as a genuine outage would exercise them — without
# manufacturing an outage. Drill check and policy were deleted after the proof.
#
# What the drill did NOT prove: that `readyz` specifically returns 503 when
# redis dies. That arm rests on the route's own per-dependency logic and on the
# recorded 2026-09-20 incident, not on a deliberate production failure.
#
# ─── WHAT THIS STILL IS NOT ─────────────────────────────────────────────
#
# A rota, or a pager. One address, one person, and email. So detection latency
# is bounded (~2 minutes) and time from the alert landing in an inbox to a human
# acting on it is NOT — nobody is on call, and an outage at 03:00 waits for
# someone to wake up and read email. Do not write an acknowledge or response
# time anywhere on the strength of this channel.
#
# ─── WHAT THIS DOES NOT COVER ───────────────────────────────────────────
#
#   - Staging. There is no staging deployment for this product.
#   - Certificate expiry beyond what `ssl_valid` catches at probe time.
#   - Anything about the worker. `readyz` reports the APP tier's view of redis,
#     not whether the BullMQ worker is consuming. A worker that stopped working
#     while the web tier stays green is invisible here, and #2745 requires that
#     second shape ("a system that is up but doing nothing"). It needs a
#     heartbeat probe, which is a different mechanism and a separate change.
#   - A half-applied migration that has not yet taken the app down. See #2746.
#   - Whether an alert reaches a human out of hours. There is no rota.
