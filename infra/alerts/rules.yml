# ┌───────────────────────────────────────────────────────────────────────┐
# │ NOT PROVISIONED. This file describes a Prometheus/Alertmanager stack   │
# │ that does not run anywhere for inflect-compliance. There is no         │
# │ Alertmanager, no PagerDuty service and no Slack webhook. Nothing below │
# │ pages anyone.                                                          │
# │                                                                        │
# │ THE ALERTING THAT ACTUALLY EXISTS is one GCP Cloud Monitoring uptime   │
# │ check against /api/readyz, emailing one address, described in          │
# │ `infra/alerts/external-uptime.yml`. Read that file for what is real.   │
# │                                                                        │
# │ Kept because the thresholds and routing encode real intent, and this   │
# │ is the shape to build toward if a metrics stack is ever stood up.      │
# │ Banner added 2026-09-22 (#2745), after production was down ~25h and    │
# │ nothing alerted — partly because files like this one read as though    │
# │ alerting already existed.                                              │
# └───────────────────────────────────────────────────────────────────────┘
# Alerting Rules for inflect-compliance
#
# Compatible with: Prometheus Alertmanager, Grafana Unified Alerting
#
# These rules implement alerting thresholds defined in docs/slos.md.
# They use the OTel metrics emitted by src/lib/observability/metrics.ts
# and exposed via OTel Collector → Prometheus pipeline.
#
# Metric name convention:
#   OTel dots (api.request.count) → Prometheus underscores (api_request_count)

groups:
  # ─── Error Rate Alerts ───────────────────────────────────────────────
  - name: inflect.error_rate
    interval: 30s
    rules:
      # Warning: error rate > 1% sustained for 10 minutes
      - alert: ApiErrorRateWarning
        expr: |
          (
            sum(rate(api_request_count{http_status_code=~"5.."}[5m]))
            /
            (sum(rate(api_request_count[5m])) > 0)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          service: inflect-compliance
          slo: error_rate
        annotations:
          summary: "API error rate exceeds 1% (SLO breach)"
          description: |
            The 5xx error rate has been above 1% for 10 minutes.
            Current value: {{ $value | humanizePercentage }}
            SLO target: < 1%
            
            Runbook:
            1. Check structured logs: grep for level=50 (error) entries
            2. Identify top failing routes via the SLO dashboard
            3. Check database connectivity (/api/readyz)
            4. Review recent deployments
          dashboard: "/d/inflect-compliance-slos"

      # Critical: error rate > 5% sustained for 5 minutes
      - alert: ApiErrorRateCritical
        expr: |
          (
            sum(rate(api_request_count{http_status_code=~"5.."}[5m]))
            /
            (sum(rate(api_request_count[5m])) > 0)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: inflect-compliance
          slo: error_rate
        annotations:
          summary: "CRITICAL: API error rate exceeds 5%"
          description: |
            The 5xx error rate has been above 5% for 5 minutes.
            Current value: {{ $value | humanizePercentage }}
            This indicates significant service degradation.
            
            Immediate actions:
            1. Check /api/readyz for dependency failures
            2. Check for recent deployments — consider rollback
            3. Review Sentry for error clustering
            4. Check database and Redis health
          dashboard: "/d/inflect-compliance-slos"

  # ─── Latency Alerts ──────────────────────────────────────────────────
  - name: inflect.latency
    interval: 30s
    rules:
      # Warning: P95 latency > 500ms sustained for 10 minutes
      - alert: ApiP95LatencyWarning
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_request_duration_bucket{
              http_route!~"/api/(livez|readyz|health|staging/seed)",
              http_route!~"/api/t/[^/]+/(reports/export|files)",
              http_route!="/api/stripe/webhook"
            }[5m])) by (le)
          ) > 500
        for: 10m
        labels:
          severity: warning
          service: inflect-compliance
          slo: latency_p95
        annotations:
          summary: "API P95 latency exceeds 500ms (SLO breach)"
          description: |
            P95 API response time has been above 500ms for 10 minutes.
            Current P95: {{ $value | humanize }}ms
            SLO target: < 500ms
            
            Runbook:
            1. Check the "Top Slow Routes" table in the SLO dashboard
            2. Look for slow database queries in structured logs (durationMs field)
            3. Check database connection pool health
            4. Check for lock contention or table bloat
          dashboard: "/d/inflect-compliance-slos"

      # Critical: P95 latency > 2000ms sustained for 5 minutes
      - alert: ApiP95LatencyCritical
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_request_duration_bucket{
              http_route!~"/api/(livez|readyz|health|staging/seed)",
              http_route!~"/api/t/[^/]+/(reports/export|files)",
              http_route!="/api/stripe/webhook"
            }[5m])) by (le)
          ) > 2000
        for: 5m
        labels:
          severity: critical
          service: inflect-compliance
          slo: latency_p95
        annotations:
          summary: "CRITICAL: API P95 latency exceeds 2000ms"
          description: |
            P95 API response time has been above 2 seconds for 5 minutes.
            Current P95: {{ $value | humanize }}ms
            This indicates a major performance degradation.
            
            Immediate actions:
            1. Check database health — likely query or connection issue
            2. Check for runaway queries: SELECT * FROM pg_stat_activity WHERE state = 'active'
            3. Check Redis connectivity if caching is expected
            4. Consider restarting the application if event loop is blocked
          dashboard: "/d/inflect-compliance-slos"

  # ─── Health Check Alerts ─────────────────────────────────────────────
  - name: inflect.health
    interval: 15s
    rules:
      # Warning: readyz probe has failed for 30+ seconds (2 consecutive checks)
      - alert: ReadyzProbeFailure
        expr: |
          probe_success{job="blackbox-readyz"} == 0
        for: 30s
        labels:
          severity: warning
          service: inflect-compliance
          slo: health_check
        annotations:
          summary: "Readiness probe failing (/api/readyz)"
          description: |
            The readiness probe has been failing for 30+ seconds.
            This means a critical dependency (database or Redis) is unreachable.
            
            Runbook:
            1. Check /api/readyz directly for structured failure info
            2. Verify PostgreSQL connectivity
            3. Verify Redis connectivity (if REDIS_URL is configured)
            4. Check network between app and database
          dashboard: "/d/inflect-compliance-slos"

      # Critical: readyz probe has failed for 45+ seconds (3 consecutive checks)
      - alert: ReadyzProbeCritical
        expr: |
          probe_success{job="blackbox-readyz"} == 0
        for: 45s
        labels:
          severity: critical
          service: inflect-compliance
          slo: health_check
        annotations:
          summary: "CRITICAL: Readiness probe failing for 45+ seconds"
          description: |
            The readiness probe has been failing for 45+ seconds.
            The service is degraded and should be removed from the load balancer.
            
            Immediate actions:
            1. Check database server health
            2. Check Redis server health (if configured)
            3. Check container resources (memory, CPU)
            4. Consider failover or restart
          dashboard: "/d/inflect-compliance-slos"

      # Critical: livez probe failure — process is unresponsive
      - alert: LivezProbeFailure
        expr: |
          probe_success{job="blackbox-livez"} == 0
        for: 15s
        labels:
          severity: critical
          service: inflect-compliance
          slo: health_check
        annotations:
          summary: "CRITICAL: Liveness probe failing — process unresponsive"
          description: |
            The liveness probe has failed. The Node.js process is unresponsive.
            The container orchestrator should restart this instance.
            
            Immediate actions:
            1. Check container status (is it OOMKilled?)
            2. Check for event loop blocking (CPU-bound operations)
            3. Force-restart the container
            4. Check for memory leaks if this recurs
          dashboard: "/d/inflect-compliance-slos"

  # ─── Availability (Burn Rate) Alerts ─────────────────────────────────
  - name: inflect.availability
    interval: 60s
    rules:
      # Multi-window burn rate alert for 99.9% SLO
      # If we're burning error budget 14.4x faster than allowed over 1h
      # AND 6x faster over 5m, we'll breach our SLO within 1 day.
      - alert: ApiAvailabilityBurnRateHigh
        expr: |
          (
            (
              sum(rate(api_request_count{http_status_code=~"5.."}[1h]))
              /
              (sum(rate(api_request_count[1h])) > 0)
            ) > (14.4 * 0.001)
          )
          and
          (
            (
              sum(rate(api_request_count{http_status_code=~"5.."}[5m]))
              /
              (sum(rate(api_request_count[5m])) > 0)
            ) > (6 * 0.001)
          )
        for: 2m
        labels:
          severity: critical
          service: inflect-compliance
          slo: availability
        annotations:
          summary: "CRITICAL: API error budget burn rate is dangerously high"
          description: |
            The error budget for the 99.9% availability SLO is being consumed
            at a rate that will exhaust the monthly budget within 1 day.
            
            1h error rate: {{ $value | humanizePercentage }}
            Budget allowed: 0.1% per 30 days (43 min/month)
            
            This alert uses multi-window burn rate detection to avoid
            false positives from brief spikes.
            
            Immediate actions:
            1. Check the SLO dashboard for error distribution
            2. Identify failing routes and error codes
            3. Consider rollback if correlated with recent deployment
          dashboard: "/d/inflect-compliance-slos"

  # ─── Job Execution Alerts ────────────────────────────────────────────
  - name: inflect.jobs
    interval: 60s
    rules:
      # Warning: any job has > 50% failure rate over 15 minutes
      - alert: JobFailureRateWarning
        expr: |
          (
            sum(rate(job_execution_count{job_status="failure"}[15m])) by (job_name)
            /
            (sum(rate(job_execution_count[15m])) by (job_name) > 0)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: inflect-compliance
          slo: job_health
        annotations:
          summary: "Job {{ $labels.job_name }} failure rate exceeds 50%"
          description: |
            The job "{{ $labels.job_name }}" has been failing more than half
            of its executions for 5+ minutes.
            Current failure rate: {{ $value | humanizePercentage }}

            Runbook:
            1. Check structured logs for job_name={{ $labels.job_name }}
            2. Review recent code changes to the job executor
            3. Check database/Redis connectivity
          dashboard: "/d/inflect-compliance-slos"

      # Warning: queue depth (waiting) exceeds 100 jobs for 10 minutes
      - alert: QueueDepthBacklogWarning
        expr: |
          job_queue_depth{queue_state="waiting"} > 100
        for: 10m
        labels:
          severity: warning
          service: inflect-compliance
          slo: job_health
        annotations:
          summary: "Job queue backlog exceeds 100 waiting jobs"
          description: |
            The BullMQ queue has {{ $value }} jobs waiting for processing.
            This may indicate worker capacity issues or a processing stall.

            Runbook:
            1. Check if workers are running
            2. Check for stuck/active jobs
            3. Verify Redis connectivity
            4. Consider scaling worker concurrency
          dashboard: "/d/inflect-bullmq"

      # Critical: queue depth exceeds 1000 — operator action required.
      # OI-3 spec threshold. Distinct from the 100-job warning above
      # because at 1k+ the backlog is no longer self-recoverable
      # within the maintenance window — workers can't drain fast
      # enough without scaling.
      - alert: QueueDepthBacklogCritical
        expr: |
          job_queue_depth{queue_state="waiting"} > 1000
        for: 5m
        labels:
          severity: critical
          service: inflect-compliance
          slo: job_health
        annotations:
          summary: "Job queue backlog exceeds 1000 waiting jobs (CRITICAL)"
          description: |
            The BullMQ queue has {{ $value }} jobs waiting. At this
            level the backlog is no longer self-recoverable —
            operator intervention needed.

            Runbook:
            1. Scale worker replicas: helm upgrade --set worker.replicaCount=N
            2. Identify the slow job type via the BullMQ dashboard
            3. Check for poison-pill jobs blocking the queue
            4. If Redis-bound: check ElastiCache CPU + memory
          dashboard: "/d/inflect-bullmq"

  # ─── Database (Repository / Connection Pool) ─────────────────────────
  - name: inflect.database
    interval: 30s
    rules:
      # Critical: DB connection pool exhausted.
      # Manifests as a sustained spike in repo-method errors with
      # Prisma error types — the pool times out trying to acquire a
      # connection (P1008) or refuses outright. Spec OI-3 calls this
      # "DB connection pool exhausted"; in practice it surfaces as
      # rapid Prisma errors across multiple repo methods at once.
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (
            sum(rate(repo_method_errors{error_type=~"PrismaClient.*"}[2m]))
            /
            clamp_min(sum(rate(repo_method_calls[2m])), 1)
          ) > 0.20
        for: 3m
        labels:
          severity: critical
          service: inflect-compliance
          slo: database
        annotations:
          summary: "Database connection pool likely exhausted (>20% Prisma errors)"
          description: |
            More than 20% of repository calls are failing with Prisma
            errors over 3 minutes. The most common cause is connection
            pool exhaustion (queries waiting longer than the pool
            timeout for a free connection).

            Runbook:
            1. Check the database dashboard: /d/inflect-database
            2. Check PgBouncer pool stats:
                 kubectl exec <app-pod> -c pgbouncer -- \
                   psql -h 127.0.0.1 -p 5432 -d pgbouncer -U postgres \
                   -c "SHOW POOLS;"
            3. Check RDS connection count via CloudWatch
            4. Scale app replicas down (back-pressure) OR
               scale RDS / increase PgBouncer pool size in values
          dashboard: "/d/inflect-database"

  # ─── Redis / ElastiCache ─────────────────────────────────────────────
  # These metrics come from a CloudWatch exporter (cloudwatch_exporter
  # or YACE) wired to ElastiCache. The Redis dashboard documents the
  # dependency.
  - name: inflect.redis
    interval: 60s
    rules:
      # Warning: ElastiCache memory > 80%.
      # OI-3 spec threshold. BullMQ uses noeviction (chart enforces
      # via parameter group) so once memory fills, the cache STARTS
      # REJECTING WRITES — workers can't enqueue new jobs.
      - alert: RedisMemoryHighWarning
        expr: |
          avg(aws_elasticache_database_memory_usage_percentage_average) > 80
        for: 10m
        labels:
          severity: warning
          service: inflect-compliance
          slo: cache
        annotations:
          summary: "ElastiCache memory usage exceeds 80%"
          description: |
            ElastiCache database memory is at {{ $value | humanizePercentage }}.
            With maxmemory-policy=noeviction (BullMQ requirement),
            reaching 100% causes write rejection — workers will fail
            to enqueue jobs.

            Runbook:
            1. Check the Redis dashboard: /d/inflect-redis
            2. Identify the memory consumer:
                 kubectl exec <app-pod> -c pgbouncer -- \
                   redis-cli -h <redis-host> --tls INFO memory
            3. Scale cache node up: helm upgrade --set redis_node_type=...
               (Terraform — Epic OI-1 module)
            4. Or evict completed jobs:
                 BullMQ: queue.clean(0, 'completed') / queue.clean(0, 'failed')
          dashboard: "/d/inflect-redis"

      # Critical: ElastiCache memory > 95% — write rejection imminent.
      - alert: RedisMemoryHighCritical
        expr: |
          avg(aws_elasticache_database_memory_usage_percentage_average) > 95
        for: 5m
        labels:
          severity: critical
          service: inflect-compliance
          slo: cache
        annotations:
          summary: "ElastiCache memory CRITICAL (>95%) — write rejection imminent"
          description: |
            ElastiCache memory at {{ $value | humanizePercentage }}.
            Write rejection imminent. Worker pods will start failing
            to enqueue jobs within minutes.

            Runbook: same as RedisMemoryHighWarning, but ESCALATE —
            scale the cache node up via Terraform NOW. The chart's
            maxmemory-policy=noeviction means the cache will REJECT
            writes once full, not silently evict. Workers will
            immediately fail to enqueue.
          dashboard: "/d/inflect-redis"

  # ─── TLS Certificate Expiry ──────────────────────────────────────────
  # `probe_ssl_earliest_cert_expiry` comes from the Prometheus
  # blackbox_exporter probing the public ingress URL. Operators wire
  # the blackbox_exporter ServiceMonitor (or its Helm chart) to scrape
  # the production hostname.
  - name: inflect.certificates
    interval: 5m
    rules:
      # Warning: certificate expires within 14 days. OI-3 spec.
      # Earlier than the 30-day default many shops use because
      # cert-manager renews at 30 days remaining; if it hasn't
      # renewed by 14 days, automation has failed.
      - alert: CertificateExpiryWarning
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          service: inflect-compliance
          slo: tls
        annotations:
          summary: "TLS certificate expires in {{ $value | printf \"%.1f\" }} days"
          description: |
            The probed certificate expires soon. cert-manager (or
            equivalent) should have renewed by now. Manual
            intervention may be required.

            Runbook:
            1. Check cert-manager status:
                 kubectl get certificate -A
                 kubectl describe certificate <name>
            2. Check ACME order state:
                 kubectl describe order -A
                 kubectl describe challenge -A
            3. If cert-manager is stuck: re-issue manually via the
               Ingress's TLS Secret reference.
          dashboard: "/d/inflect-app-overview"

      # Critical: certificate expires within 3 days — site outage imminent.
      - alert: CertificateExpiryCritical
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
        for: 5m
        labels:
          severity: critical
          service: inflect-compliance
          slo: tls
        annotations:
          summary: "TLS certificate expires in {{ $value | printf \"%.1f\" }} days (CRITICAL)"
          description: |
            Certificate expiry imminent. Browsers will reject HTTPS
            connections once it lapses.

            Runbook: same as CertificateExpiryWarning, but ESCALATE —
            the automated renewal flow has failed and manual cert
            issuance is required NOW. If cert-manager is stuck,
            issue a manual cert via Let's Encrypt acme.sh or
            equivalent and replace the Ingress's TLS Secret directly.
          dashboard: "/d/inflect-app-overview"

  # ─── Security-control Integrity ──────────────────────────────────────
  - name: inflect.security_controls
    interval: 30s
    rules:
      # A SECURITY alert, not an availability one.
      #
      # The session tracker is deliberately non-blocking: if it cannot read a
      # tenant's session policy it still lets the sign-in through, rather than
      # turning a database blip into a tenant-wide sign-in outage. The cost is
      # that the sign-in proceeds with NO concurrent-session cap and NO
      # lifetime cap — two controls silently not applying.
      #
      # The read already retries once before counting a failure, so a non-zero
      # rate here is a real, sustained inability to resolve policy.
      - alert: SessionPolicyResolutionFailing
        expr: rate(session_policy_resolution{outcome="failed"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "Tenant session policy not applying for some sign-ins"
          description: >-
            {{ $value | humanize }}/s of sign-ins could not resolve their
            tenant's session policy and proceeded UNCAPPED — no
            concurrent-session limit and no session-lifetime cap.

            This does NOT block sign-in by design, which is why it needs an
            alert: the controls lapse invisibly otherwise. Check database
            reachability from the auth path.
          dashboard: "/d/inflect-app-overview"

      # A workflow context failed integrity verification and the run was HALTED.
      #
      # Not a performance signal. Every code here means the agent's own memory
      # could not be trusted: a schema that no longer parses, a chain head that
      # does not match its blob (tampering), an earlier sealed pair restored on
      # top of a later one (replay), or a context over the cap. The run stops
      # rather than continuing on it, so the user-visible symptom is a FAILED
      # run — this alert is what says WHY, and CONTEXT_CHAIN_BROKEN /
      # CONTEXT_REPLAYED specifically mean somebody wrote to the database
      # underneath a running agent.
      #
      # Threshold is any occurrence, deliberately. These are zero in normal
      # operation; a rate threshold would hide the single event that matters.
      - alert: AgenticWorkflowContextIntegrityHalt
        expr: |
          increase(agentic_workflow_context_integrity_halt_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: inflect-compliance
        annotations:
          summary: "Agent workflow context failed integrity verification ({{ $labels.code }})"
          description: |
            A workflow run halted because its context could not be verified.
            Code: {{ $labels.code }}

            CONTEXT_CHAIN_BROKEN and CONTEXT_REPLAYED are SECURITY events — the
            blob and its head disagree, or an earlier sealed pair was restored
            over a later one. Neither happens through normal application writes.

            Runbook:
            1. Find the halted run: WorkflowRun where status=FAILED and
               errorMessage LIKE 'context integrity halt%'.
            2. Read the WORKFLOW_CONTEXT_INTEGRITY_HALTED audit row — it carries
               seq, minSeq, the two hashes and a blob digest, never content.
            3. CONTEXT_REPLAYED: compare WorkflowStep.contextSeq (append-only)
               against the run's envelope seq — the ledger is the anchor and does
               not move when the run row is restored.
            4. CONTEXT_SIZE_CAP_EXCEEDED is the benign one: the run outgrew the
               cap. Check the context-size panel before treating it as an attack.
            5. Rule out a database restore or a manual UPDATE before escalating.

      # The scheduled kill-switch drill did not pass.
      #
      # An untested stop control is an assumption, which is why the drill exists;
      # a FAILED drill means the assumption is now known to be wrong. This is the
      # one alert on this path that says a SAFETY CONTROL is broken rather than
      # that it fired.
      - alert: AgenticKillSwitchDrillNotPassing
        expr: |
          increase(agentic_kill_switch_drill_total{outcome!="PASSED"}[24h]) > 0
        for: 0m
        labels:
          severity: critical
          service: inflect-compliance
        annotations:
          summary: "Agent kill-switch drill did not pass ({{ $labels.outcome }})"
          description: |
            The scheduled drill pulls the kill switch for real and checks the MCP
            tool boundary refuses. It did not report PASSED.

            FAILED means the boundary did NOT refuse a killed agent — the stop
            control is not stopping. ERROR means the drill could not run, so it
            proves nothing either way and the control is UNVERIFIED rather than
            known-broken.

            Runbook:
            1. Read the newest AgentKillSwitchDrill row: outcome, scopesHonoured,
               scopesFailed, boundaryRefusalReason.
            2. A CRITICAL Finding is raised on FAILED — it carries the same detail.
            3. Do not wait for the next drill to re-test; engage a kill on a canary
               agent by hand and confirm the boundary refuses.

      # An agent's behavioural circuit breaker latched OPEN.
      #
      # Not a volume ceiling — this is the ASI10 rogue-agent signal: the agent is
      # doing something DIFFERENT (proposal rate, rejection rate, or tool mix),
      # which a budget set high enough to be quiet will never catch.
      - alert: AgenticCircuitBreakerTripped
        expr: |
          increase(agentic_circuit_breaker_trip_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "An agent's behavioural circuit breaker tripped"
          description: |
            The agent's recent behaviour diverged from its own baseline and the
            breaker latched OPEN, halting it at the tool boundary — reads included.

            This is a claim about CHANGE, not about volume, so the first question
            is what changed: a new workflow, a new tool grant, a widened policy
            card, or an actual compromise.

            Runbook:
            1. GET /api/t/:slug/admin/agents/:agentId/circuit-breaker — the latch,
               the last 48 windows and the signals that fired.
            2. Closing the breaker is a deliberate act with two meanings:
               ACCEPTED_NEW_BASELINE adopts the behaviour as normal, RESOLVED keeps
               the old baseline. They are not interchangeable.

      # A fan-out stopped with members unattempted.
      #
      # The whole point of the isolation work is that one failure does not become
      # a cascade. A HALT means the sweep stopped anyway, so some agents or runs
      # were never reached — silent work loss, which is the failure mode this
      # subsystem exists to prevent.
      - alert: AgenticFanOutHalted
        expr: |
          increase(agentic_fanout_halted_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "An agentic fan-out halted with members unattempted ({{ $labels.component }})"
          description: |
            A per-item fan-out stopped on a fatal failure rather than isolating it,
            so the members behind it were never attempted. The count of members
            that DID fail individually is a different series
            (agentic_fanout_member_failed_total) and is expected to be non-zero.

            Runbook:
            1. The halt kind is on the `kind` label — it distinguishes "this item
               failed" from "this sweep must not continue".
            2. Members behind a halt are not retried by the same tick; the next
               scheduled run reaches them.

  # ── AGENTIC RUN HEALTH (#3484) ────────────────────────────────────────
  #
  # A FOURTH tier, and the classification is the point rather than tidiness.
  # These are not SLO-tracking (no API SLO is involved and they do not link the
  # SLO board), they are not infrastructure health (no queue, pool, cache or
  # certificate), and they are not security-control integrity — that tier fires
  # when a control STOPS applying, whereas a guard block here is the control
  # working. They are the health of agentic WORK: is it finishing, is it being
  # stopped, is it accumulating.
  #
  # Plan point 10 asked for started/completed/failed counters, step and token
  # histograms, a guard-block counter and a runs-in-flight gauge. These alerts
  # are what makes those numbers reach somebody; the histograms are dashboard
  # material rather than alert material, because "runs got longer" is a trend
  # to look at and not a page.
  #
  # RATES, not totals. A tenant that runs more agents has more failures in
  # absolute terms and is not less healthy for it; the share is the signal.
  - name: inflect.agentic_runs
    rules:
      # Warning: more than a quarter of settled runs are failing.
      #
      # The denominator is guarded (`> 0`), the shape every rule above uses: a
      # deployment with no agentic traffic must not divide by zero and page.
      - alert: AgenticRunFailureRateWarning
        expr: |
          (
            sum(rate(agent_run_settled_total{outcome="failed"}[15m]))
            /
            (sum(rate(agent_run_settled_total[15m])) > 0)
          ) > 0.25
        for: 15m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "Over 25% of agentic runs are failing ({{ $value | humanizePercentage }})"
          description: |
            A run reaches FAILED when its walk threw, or when the reaper settled it
            as having no executor. The second shape means a deploy stranded runs,
            which looks identical in this series and is NOT a model problem — check
            the deployment timeline first.

            Runbook:
            1. /agents/runs — the run list, newest first, with the error message
               each failure settled with.
            2. `agent_run_settled_total{outcome="aborted"}` is the OTHER
               non-completion and is deliberately separate: an abort was something
               stopping the run on purpose (a guard block or a kill switch), not a
               failure to be fixed.
            3. The per-tenant breakdown is not in this series — labels carry no
               tenant id on purpose. Use trace attributes or the governance pack's
               `runs.failed`.

      # Warning: the content guard is stopping agentic traffic.
      #
      # A QUARANTINED verdict means nothing was committed, so this is not a data
      # incident — it is either an agent reaching for something it should not, or
      # a guard rule that is too broad for a tenant's content. Both need a human.
      - alert: AgenticGuardBlocksRising
        expr: |
          increase(agent_guard_blocks_total{guard_verdict="QUARANTINED"}[1h]) > 5
        for: 0m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "The content guard blocked more than 5 agentic runs in an hour"
          description: |
            FLAGGED verdicts are a separate label value and are NOT counted here:
            those parked a run for human review, which is the control working as
            intended and shows up as a reviewer queue rather than an incident.

            Runbook:
            1. The run's error message names the rule ids that fired; the content
               that matched them is deliberately not recorded anywhere.
            2. Three blocks in a window latch an agent's circuit breaker
               (GUARD_BLOCK_TRIP_THRESHOLD), so a sustained rise here is usually
               followed by AgenticCircuitBreakerTripped.

      # Warning: runs are accumulating in flight.
      #
      # `agent_runs_in_flight` is a PER-PROCESS gauge summed by the collector, so
      # this is the deployment-wide number of runs being executed right now. A
      # sustained high value with a flat completion rate is the shape of runs
      # that started and are not finishing.
      - alert: AgenticRunsInFlightSustained
        expr: |
          sum(agent_runs_in_flight) > 20
        for: 30m
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "More than 20 agentic runs in flight for 30 minutes"
          description: |
            This gauge counts runs a worker process is EXECUTING. Runs parked at a
            human checkpoint are not here — they are AWAITING_APPROVAL and the
            governance pack reports them as `runs.awaiting_approval`, so a
            reviewer backlog does not trigger this.

            Runbook:
            1. The per-tenant concurrent-run cap
               (TenantSecuritySettings.agentMaxConcurrentRuns) bounds how many a
               single tenant can start; a deployment-wide number this high with no
               tenant near its cap means many tenants at once.
            2. `agent_run_steps` on the dashboard says whether runs are taking more
               steps than usual, which distinguishes "slower runs" from "more runs".

      # Warning: runs are starting and not settling.
      #
      # THE ONE THAT USES `agent_run_started`. Every other series here counts an
      # ending; this compares the two, and the gap is the figure that says runs
      # are going missing rather than failing — a settled run, whatever its
      # outcome, has been accounted for.
      #
      # A standing gap is normal and this does not fire on it: runs legitimately
      # sit at a human checkpoint, and those have started without settling. The
      # alert is on the RATE DIFFERENCE being sustained, which a steady queue of
      # checkpoints does not produce — it produces a gap that stops growing.
      - alert: AgenticRunsStartedNotSettling
        expr: |
          (
            sum(rate(agent_run_started_total[30m]))
            - sum(rate(agent_run_settled_total[30m]))
          ) > 0.05
        for: 1h
        labels:
          severity: warning
          service: inflect-compliance
        annotations:
          summary: "Agentic runs have been starting faster than they settle for an hour"
          description: |
            A run settles on COMPLETED, FAILED or ABORTED. It does NOT settle when
            it parks at a human checkpoint or is paused by a deploy, so a reviewer
            backlog and a rolling restart both widen this gap legitimately — which
            is why the threshold is on a sustained rate difference and not on the
            gap itself.

            Runbook:
            1. `agent_runs_in_flight` says whether the unsettled runs are being
               EXECUTED right now or are parked. Parked runs are not in that gauge.
            2. The governance pack's `runs.awaiting_approval` and `runs.paused` are
               the per-status counts, unwindowed, and distinguish "waiting on a
               person" from "waiting on nothing".
            3. A run that threw past its walk is counted as settled-failed at the
               driver seam, so a crash loop shows up as a failure rate rather than
               as this gap.
