#
# Production Docker Compose for inflect-compliance.
#
# ROLE: deployed-production. The repo ALSO carries a root
# `docker-compose.prod.yml`; that one is a LOCAL production-like stack and is
# NOT interchangeable with this — different service names, a different
# database name, a different env file. Both files say which they are because
# neither used to, and the cost was measured: an operator reading the root one
# to understand the live deployment concluded the deployed env file had
# drifted and was a step from writing config into a path nothing reads.
# `tests/guards/worker-deployment.test.ts` pins that exactly one file claims
# to be deployed.
#
# ── THIS FILE IS CANONICAL ────────────────────────────────────────────
# It is the source of truth for the production stack's STRUCTURE, and it
# reaches the VM at /opt/inflect/docker-compose.prod.yml through
# `deploy/apply.sh` — never by hand-editing the host copy. Divergence is
# detected by `deploy/check-drift.sh`. Watchtower updates the app+worker
# IMAGES only; it never rewrites this file.
#
# That contract is new as of #2849. Before it, the host copy was
# hand-edited and had drifted ~148 lines from this one: secrets inlined
# where this file interpolates, no `:?` fail-fast guards, the comments
# explaining non-obvious choices gone, and a volume mount present live
# and absent here. Someone reaching for version control mid-incident got
# something that had never run.
#
# ── SECRETS ARE NEVER INLINED HERE ────────────────────────────────────
# Every credential is a `${VAR:?message}` reference. The `:?` form aborts
# `docker compose up` BEFORE any container is created when the variable
# is missing, so a misconfiguration is a refusal at the command line
# rather than a crash loop or — worse — a container that starts with an
# empty password. If you are tempted to paste a literal in here to make
# a deploy go: don't. Put it in the host env files and let apply.sh pass
# them. A literal here is committed to a public repo.
#
# ── HOW THE VARIABLES GET RESOLVED ────────────────────────────────────
# Compose interpolates `${VAR}` from the shell environment and from the
# files named by `--env-file` ONLY. A service-level `env_file:` entry is
# NOT in interpolation scope — it is handed to the container and nothing
# else. The two are easy to confuse and the confusion is load-bearing
# here, so apply.sh runs compose as:
#
#   docker compose --env-file .env --env-file .env.prod \
#                  -f docker-compose.prod.yml up -d
#
#   /opt/inflect/.env       → POSTGRES_PASSWORD  (interpolation only)
#   /opt/inflect/.env.prod  → DATA_ENCRYPTION_KEY, REDIS_PASSWORD, and the
#                             app's runtime config (interpolation AND, via
#                             `env_file:` below, the container environment)
#
# Naming .env.prod on BOTH sides is deliberate. `app.environment` sets
# DATA_ENCRYPTION_KEY and a service-level `environment:` value OVERRIDES
# the same key from `env_file:`. Sourcing the interpolation from the very
# file the container reads makes the two agree by construction; sourcing
# it from anywhere else lets compose hand the app a DIFFERENT key than
# .env.prod holds, and the app would then decrypt nothing and say little.
#
# Runs on a single VM. Caddy terminates TLS (LE via sslip.io and
# app.inflect.bg) and proxies to the Next.js app. Postgres + PgBouncer +
# Redis + ClamAV are internal-only (no host port publishing) so the only
# public listeners are 80/443 on Caddy.
#
# The optional pipelock MCP mediator lives in an overlay —
# deploy/docker-compose.pipelock.yml. It is NOT part of this file
# because it has unmet preconditions on the VM; see that file's header.
#

services:
  # ── Postgres ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Guarded like the other two secrets. It was the ONLY credential
      # in this file without a `:?` — and the only one the VM could
      # actually resolve, which is the worst pairing of the two
      # properties: an unset POSTGRES_PASSWORD does not abort the
      # deploy, it initialises a fresh volume with an EMPTY superuser
      # password, and pgbouncer below authenticates against it happily.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. It lives in /opt/inflect/.env on the prod VM; apply.sh passes that file with --env-file.}"
      POSTGRES_DB: inflect_compliance
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inflect_compliance"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── PgBouncer ─────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. It lives in /opt/inflect/.env on the prod VM; apply.sh passes that file with --env-file.}"
      DB_NAME: inflect_compliance
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
      MAX_DB_CONNECTIONS: "50"
      AUTH_TYPE: scram-sha-256
      STATS_PERIOD: "60"
      ADMIN_USERS: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis MUST require a password in a production-like deployment.
    # The :? syntax aborts `docker compose up` before the container
    # is created if REDIS_PASSWORD is unset — same fail-fast pattern
    # as DATA_ENCRYPTION_KEY on the app service below.
    # maxmemory-policy is `noeviction` (NOT allkeys-lru): Redis carries
    # BullMQ job state — an eviction policy would silently drop queued
    # jobs under memory pressure. noeviction makes Redis reject writes
    # (OOM) instead. Matches the ElastiCache parameter group. See
    # docs/deployment.md "Redis — per-environment policy".
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env.* before starting. Redis must not run unauthenticated in a production-like deployment.}" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      # redis-cli reads REDISCLI_AUTH automatically, so the healthcheck
      # authenticates without putting the password on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── ClamAV ────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-defs:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── App (Next.js) — auto-updated by Watchtower ────────────────
  app:
    image: ghcr.io/rodnapamet/inflect-compliance:latest
    restart: unless-stopped
    pull_policy: always
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.prod
    environment:
      # GAP-03 — fail-fast at compose-up time if the master encryption
      # key is absent from deploy/.env.prod. The :? syntax aborts the
      # container start before the app process is spawned, so the
      # operator gets a single clear error instead of a crash loop.
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required for production. Generate with: openssl rand -base64 48}"
    volumes:
      - app-uploads:/data/uploads
      # Reconciled FROM the live host file (#2849). Prisma 7 resolves its
      # config at RUNTIME, not only at generate time, so the production
      # image needs prisma.config.ts present at /app — the entrypoint runs
      # `prisma migrate deploy` before `next start` and fails without it.
      # This mount has been live since the 2026-05-05 Prisma 7 recovery
      # (the VM still carries docker-compose.prod.yml.before-prisma7-recovery
      # from that day) and was missing here, so this file has been
      # un-deployable ever since. The host copy is byte-identical to the
      # repo's root prisma.config.ts — apply.sh pushes it to keep it so.
      - ./prisma.config.ts:/app/prisma.config.ts:ro
    expose:
      - "3000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Worker ────────────────────────────────────────────────────
  # The BullMQ worker + scheduler — a SEPARATE process from `app`
  # (same image, ENTRYPOINT overridden). Without it NO scheduled job
  # runs and enqueued jobs pile up in Redis. The command registers
  # the repeatable schedules (idempotent) then daemonises the
  # worker. Watchtower-enabled so it updates in lockstep with `app`.
  # See docs/deployment.md "Background worker".
  worker:
    image: ghcr.io/rodnapamet/inflect-compliance:latest
    restart: unless-stopped
    pull_policy: always
    entrypoint: ["/bin/sh", "-c"]
    command: ["node dist/scheduler.mjs && node dist/worker.mjs"]
    # The worker serves no HTTP, so there is nothing to curl — this runs the
    # bundled probe, which READS the heartbeat key `worker.ts` refreshes from
    # BullMQ's `completed` event. A pass therefore means the worker pulled a
    # job off the queue, ran it and came back; a process-existence check
    # would report a wedged worker as healthy, which is the gap (#2745).
    #
    # start_period is 300s because nothing beats until the scheduler has
    # registered the `health-check` repeatable and the first job has run.
    # Shorter, and every fresh deploy is briefly unhealthy for a reason
    # that is not a fault.
    healthcheck:
      test: ["CMD", "node", "dist/worker-healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.prod
    environment:
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required for production. Generate with: openssl rand -base64 48}"
    volumes:
      - app-uploads:/data/uploads
      # Same reason as `app` above — the worker runs the same image and
      # loads the same Prisma client.
      - ./prisma.config.ts:/app/prisma.config.ts:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Watchtower ────────────────────────────────────────────────
  # Polls GHCR every 60s. Only containers with
  # `com.centurylinklabs.watchtower.enable=true` are watched —
  # Postgres / Redis / Caddy / ClamAV stay pinned.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR auth — populated by `docker login ghcr.io` on the host.
      - /root/.docker/config.json:/config.json:ro
    environment:
      # Watchtower 1.7.1 pins the Docker SDK client to an old API
      # that modern docker daemons (29+) refuse. Force a recent one.
      DOCKER_API_VERSION: "1.45"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
    command: --label-enable --interval 60 --cleanup

  # ── Caddy (TLS + reverse proxy) ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # DIRECTORY, not the file. A single-file bind mount binds the INODE,
      # and every in-place editor (sed -i, vim, most deploy scripts) writes a
      # temp file and renames — which swaps the inode and silently leaves the
      # container on the old content. That is not hypothetical: prod ran a
      # 2026-06-30 Caddyfile until 2026-08-09 while the host file had moved
      # on, so the `lb_try_duration` retry above was never live and every
      # deploy 502'd. Mounting the directory makes edits propagate.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  redisdata:
  clamav-defs:
  app-uploads:
  caddy-data:
  caddy-config:
