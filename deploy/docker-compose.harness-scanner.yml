#
# OPT-IN OVERLAY — the agent-harness scanner for Inflect's OWN estate (#3665).
#
# Usage: the dispatch-only `Scanner VM` workflow installs this file on the VM,
# writes its configuration and environment file from `production` secrets, and
# runs it (.github/workflows/scanner-vm.yml; deploy/harness-scanner/README.md).
# By hand, once the preconditions below are met, it is:
#
#   docker compose --env-file .env --env-file .env.prod \
#     -f docker-compose.prod.yml \
#     -f docker-compose.harness-scanner.yml up -d harness-scanner
#
# ── WHAT THIS IS ──────────────────────────────────────────────────────
#
# The pilot estate is Inflect's own (roadmap decision 10): its Entra
# directory, the tenant's own register, its GitHub workflows and its GCP
# project's service accounts. Its scanner runs here, on the production VM.
#
# Since scanent #26 the image is scanent's, the standalone scanner product
# (github.com/RodnaPamet/scanent), not the in-repo
# `packages/agent-harness-scanner`: scanent carries every source and rule that
# package does, and the report contract both speak is scanent's own package,
# which the ingest takes too (`@rodnapamet/scanent-contract`). The image is
# public, multi-arch and signed keylessly by scanent's release workflow;
# deploy/harness-scanner/README.md has the verification.
#
# It reads, signs one report per run and POSTs it to the tenant's ingest
# route over the public origin (the configuration's one output, `inflect`).
# It serves nothing: no port, no Caddy vhost. With no `file` output it writes
# nothing either, which is why its root filesystem can be read-only with no
# writable mount at all.
#
# ── WHY AN OVERLAY AND NOT docker-compose.prod.yml ────────────────────
#
# The canonical file is what `deploy/apply.sh` pushes and runs, and it must
# start on a bare VM. This service needs two things a bare VM does not have:
# a configuration naming the estate, and an environment file holding its
# signing key and its credentials. Without them it cannot start, and the
# pipelock lesson is that a service which cannot start does not belong in the
# canonical file. So enabling it stays a deliberate act, as pipelock's is.
#
# ── WHY ITS OWN ENVIRONMENT FILE ──────────────────────────────────────
#
# `.env.prod` holds the database password, the Redis password and the master
# encryption key. The scanner needs none of them, and an `env_file:` hands a
# container every variable in the file. So it reads `.env.scanner` and only
# that: the signing key, the ingest key (which also reads `/api/mcp`) and one
# read credential per network source.
# Nothing here is interpolated from either file, so the `--env-file` flags
# above supply only what the canonical file's own interpolation needs.
#
# ── WHY THE DIRECTORY, NOT THE FILE ───────────────────────────────────
#
# The configuration is mounted as its directory, at /etc/scanent (the path
# scanent's image and templates use), for two reasons:
#
#  - Caddy's: a single-file bind mount pins the inode, so an edit that
#    renames a temp file over it never reaches the container.
#  - Pipelock's: a missing bind-mount source becomes an empty DIRECTORY,
#    not an error. A directory mount that is empty still reads
#    "config.json: not found", which the scanner refuses at start and logs.
#
# ── EGRESS: ONE WAY OUT, AND IT IS AN ALLOWLIST (#5004 part C) ───────
#
# The scanner sits on `harness-scanner-internal`, an INTERNAL network with no
# route out and nothing else on it: not the internet, and not the production
# database or Redis on the default network. Its one neighbour is
# `harness-egress`, the CONNECT-only proxy that ships in the scanner's own
# image (scanent's `packages/scanner/src/egress-proxy.ts`, compiled to
# `dist/egress-proxy.js`), which is also on `harness-scanner-egress` and
# forwards a tunnel to a host on EGRESS_ALLOW, port 443, and refuses
# everything else. It resolves each allowed name itself, refuses a loopback,
# link-local, metadata or private address, and dials the address it checked.
# The scanner's fetch goes through it (HTTPS_PROXY, honoured because
# NODE_USE_ENV_PROXY=1). EGRESS_PROXY_CHECKS_ADDRESSES=1 tells the scanner
# that this proxy is scanent's own, so a host the configuration names (an MCP
# server) is address-checked by the proxy rather than by a resolver the
# internal network does not have; scanent's own egress overlay sets it the
# same way. It is never to be set beside any other proxy.
#
# The allowlist is exactly the hosts the pilot's sources and the ingest reach,
# as the pinned image prints them for the configuration
# (`hosts --format egress-allow`): Microsoft Graph and its token endpoint
# (entra-sp), the GitHub API (cicd), Google's IAM API and token endpoint
# (gcp-sa), and the Inflect origin (inflect-register and the ingest). The
# `configure` action refuses a configuration whose hosts differ from this
# line. A source added to the configuration needs its host added here, or it
# reads UNREACHABLE — the safe direction.
#
# Every scan PROVES this before it reads (scanent's `egress-proof.ts`): the
# proxy admits the Inflect host, refuses the canary in the configuration, and
# a direct connection to the Inflect host fails. The result is the scanner's
# own `H3.egress_enforced` verdict.
#
# ── HARDENING ─────────────────────────────────────────────────────────
#
# scanent's deployment template: a read-only root filesystem, every
# capability dropped, no new privileges, the image's own uid 1000, a bounded
# process count. The image is distroless (no shell, no package manager). It
# is pinned by DIGEST — the multi-arch index digest of scanent's release —
# and the service carries no Watchtower label, so nothing updates it
# underneath the pin. A new scanent release means a reviewed edit of the two
# image lines below.
#
# ── PRECONDITIONS ─────────────────────────────────────────────────────
#   [ ] The VM can pull the image line below (public; no registry login).
#   [ ] The scanner is a registered agent in Inflect's tenant, and its
#       public key is registered against it. Print it with no network:
#         docker compose ... run --rm --no-deps harness-scanner \
#           public-key --config /etc/scanent/config.json
#   [ ] /opt/inflect/harness-scanner/config.json, filled in from
#       deploy/harness-scanner/config.pilot.example.json. Directory 0755,
#       file 0644: it holds no credential, and the container reads it as uid
#       1000.
#   [ ] /opt/inflect/.env.scanner, holding every variable that file names
#       (deploy/harness-scanner/scanner.env.example), root-owned, mode 0600.
#   [ ] A dry run reads every source COMPLETE before the schedule starts:
#         docker compose ... run --rm harness-scanner \
#           scan --dry-run --config /etc/scanent/config.json
#
# ── TEARDOWN ──────────────────────────────────────────────────────────
#   docker compose ... rm -sf harness-scanner harness-egress
#   revoke the ingest key and each source's read credential at its source
#   remove /opt/inflect/.env.scanner
#
# ── ROLLBACK ──────────────────────────────────────────────────────────
#   The image before scanent #26 was Inflect's own scanner, 0.13.0:
#     ghcr.io/rodnapamet/agent-harness-scanner@sha256:e9059418045046ce507c56b68e818de1e59c945176c21abfdcb9b993a4598924
#   Rolling back is reverting the commit that moved this file to scanent:
#   this file, deploy/harness-scanner/{remote.sh,vm.sh} and the configuration
#   template move together (the paths and the proxy's entrypoint differ, not
#   only the digest, and remote.sh refuses any other image), then the
#   `Scanner VM` workflow's `configure` and `start`. The signing key is kept,
#   so the registered public key stays valid either way.
#
services:
  harness-scanner:
    # scanent 0.15.0, the multi-arch index digest of
    # ghcr.io/rodnapamet/scanent:0.15.0, signed by
    # https://github.com/RodnaPamet/scanent/.github/workflows/release.yml@refs/tags/v0.15.0
    # (cosign verify, and its SLSA provenance by `gh attestation verify`).
    image: ghcr.io/rodnapamet/scanent@sha256:4c688362967681cec569ca6bff3f0b90de0423443b90be9f9dfa347c29faa171
    restart: unless-stopped
    # The image's own default command, stated so the mount below and the
    # command cannot drift apart.
    command: ["schedule", "--config", "/etc/scanent/config.json"]
    # Capacity budget C1b (2026-11-14, owner-approved 2026-11-13): peaks
    # 155 MiB (C0) and 134 MiB (24 hours of recorder history); 1.5x is 233,
    # so 256. C1 had set 512 with room for a larger estate's code parse.
    # Batch-shaped, so capped at one core with half the weight under
    # contention: the request path keeps the other.
    # docs/implementation-notes/2026-11-14-capacity-c1b.md.
    # scanent's own Compose file sets 1536m, for its `file` output: scoring
    # and rendering a large estate's results.json, page and PDF (its
    # docs/scanner.md, "Capacity"). With the `inflect` output alone none of
    # that runs, and the scan itself is the cost this limit was sized for.
    mem_limit: 256m
    cpus: 1.0
    cpu_shares: 512
    pids_limit: 256
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.scanner
    # After `env_file`, so these win over anything that file sets.
    environment:
      HTTPS_PROXY: http://harness-egress:3128
      # Cleartext too, so a plain-http request meets the proxy's 405 rather
      # than a missing route.
      HTTP_PROXY: http://harness-egress:3128
      NO_PROXY: ""
      NODE_USE_ENV_PROXY: "1"
      # The proxy above is scanent's own, and checks the address it dials.
      EGRESS_PROXY_CHECKS_ADDRESSES: "1"
    networks:
      - harness-scanner-internal
    depends_on:
      - harness-egress
    volumes:
      - ./harness-scanner:/etc/scanent:ro
    logging:
      # The canonical file's `default-logging`. An anchor does not cross
      # files, so its values are repeated here.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  harness-egress:
    # The SAME digest as the scanner: the proxy is scanent's reviewed code,
    # shipped in its image, not a third-party image. `vm.sh` refuses two
    # digests.
    image: ghcr.io/rodnapamet/scanent@sha256:4c688362967681cec569ca6bff3f0b90de0423443b90be9f9dfa347c29faa171
    restart: unless-stopped
    # As scanent's deploy/compose.egress.yaml starts it. `node` is on the
    # distroless image's PATH (/nodejs/bin).
    entrypoint: ["node", "/app/packages/scanner/dist/egress-proxy.js"]
    command: []
    # Capacity budget C1: peak 66 MiB; a Node process's floor. It forwards
    # the scanner's tunnels and nothing else, so half a core is ample.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Exact hostnames, no wildcard. Empty or missing refuses every tunnel.
    # No EGRESS_PRIVATE_CIDR_ALLOWLIST: no host here is private, so the proxy
    # refuses every private address.
    environment:
      EGRESS_ALLOW: api.github.com,app.inflect.bg,graph.microsoft.com,iam.googleapis.com,login.microsoftonline.com,oauth2.googleapis.com
    networks:
      - harness-scanner-internal
      - harness-scanner-egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # No route out. The scanner's only network.
  harness-scanner-internal:
    internal: true
  # The proxy's way out, and nothing else's.
  harness-scanner-egress: {}
