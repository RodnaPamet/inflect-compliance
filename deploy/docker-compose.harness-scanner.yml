#
# OPT-IN OVERLAY — the agent-harness scanner for Inflect's OWN estate (#3665).
#
# Usage: the dispatch-only `Scanner VM` workflow installs this file on the VM,
# writes its configuration and environment file from `production` secrets, and
# runs it (.github/workflows/scanner-vm.yml; deploy/harness-scanner/README.md).
# By hand, once the preconditions below are met, it is:
#
#   docker compose --env-file .env --env-file .env.prod \
#     -f docker-compose.prod.yml \
#     -f docker-compose.harness-scanner.yml up -d harness-scanner
#
# ── WHAT THIS IS ──────────────────────────────────────────────────────
#
# The pilot estate is Inflect's own (roadmap decision 10): its Entra
# directory, its MCP server, the tenant's own register, its GitHub workflows
# and its GCP project's service accounts. Its scanner runs here, on the
# production VM, from the copy the dispatch-only `Scanner image` workflow
# published to the repository's private GHCR package (owner decision
# 2026-10-20). A client's estate still builds the image from source.
#
# It reads, signs one report per run and POSTs it to the tenant's ingest
# route over the public origin. It serves nothing: no port, no Caddy vhost.
#
# ── WHY AN OVERLAY AND NOT docker-compose.prod.yml ────────────────────
#
# The canonical file is what `deploy/apply.sh` pushes and runs, and it must
# start on a bare VM. This service needs two things a bare VM does not have:
# a configuration naming the estate, and an environment file holding its
# signing key and its credentials. Without them it cannot start, and the
# pipelock lesson is that a service which cannot start does not belong in the
# canonical file. So enabling it stays a deliberate act, as pipelock's is.
#
# ── WHY ITS OWN ENVIRONMENT FILE ──────────────────────────────────────
#
# `.env.prod` holds the database password, the Redis password and the master
# encryption key. The scanner needs none of them, and an `env_file:` hands a
# container every variable in the file. So it reads `.env.scanner` and only
# that: the signing key, the ingest key (which also reads `/api/mcp`) and one
# read credential per network source.
# Nothing here is interpolated from either file, so the `--env-file` flags
# above supply only what the canonical file's own interpolation needs.
#
# ── WHY THE DIRECTORY, NOT THE FILE ───────────────────────────────────
#
# The configuration is mounted as its directory, for two reasons:
#
#  - Caddy's: a single-file bind mount pins the inode, so an edit that
#    renames a temp file over it never reaches the container.
#  - Pipelock's: a missing bind-mount source becomes an empty DIRECTORY,
#    not an error. A directory mount that is empty still reads
#    "config.json: not found", which the scanner refuses at start and logs.
#
# ── EGRESS: ONE WAY OUT, AND IT IS AN ALLOWLIST (#5004 part C) ───────
#
# The scanner sits on `harness-scanner-internal`, an INTERNAL network with no
# route out and nothing else on it: not the internet, and not the production
# database or Redis on the default network. Its one neighbour is
# `harness-egress`, the CONNECT-only proxy that ships in the scanner's own
# image (`packages/agent-harness-scanner/src/egress-proxy.ts`), which is also
# on `harness-scanner-egress` and forwards a tunnel to a host on EGRESS_ALLOW,
# port 443, and refuses everything else. The scanner's fetch goes through it
# (HTTPS_PROXY, honoured because NODE_USE_ENV_PROXY=1).
#
# The allowlist is exactly the hosts the pilot's sources and the ingest reach:
# Microsoft Graph and its token endpoint (entra-sp), the GitHub API (cicd),
# Google's IAM API and token endpoint (gcp-sa), and the Inflect origin
# (inflect-register and the ingest). A source added to the configuration needs
# its host added here, or it reads UNREACHABLE — the safe direction.
#
# Every scan PROVES this before it reads (`egress-proof.ts`): the proxy admits
# the Inflect host, refuses the canary in the configuration, and a direct
# connection to the Inflect host fails. The result is the scanner's own
# `H3.egress_enforced` verdict.
#
# ── HARDENING ─────────────────────────────────────────────────────────
#
# The README's Container section: a read-only root filesystem, every
# capability dropped, no new privileges, the image's own uid 1000. The image
# is pinned by DIGEST, and the service carries no Watchtower label, so
# nothing updates it underneath the pin. A new image means a new dispatch of
# the `Scanner image` workflow and a reviewed edit of the line below.
#
# ── PRECONDITIONS ─────────────────────────────────────────────────────
#   [ ] The VM's GHCR login can pull the private `agent-harness-scanner`
#       package: `sudo docker pull <the image line below>`.
#   [ ] The scanner is a registered agent in Inflect's tenant, and its
#       public key is registered against it. Print it with no network:
#         docker compose ... run --rm --no-deps harness-scanner \
#           public-key --config /etc/agent-harness-scanner/config.json
#   [ ] /opt/inflect/harness-scanner/config.json, filled in from
#       deploy/harness-scanner/config.pilot.example.json. Directory 0755,
#       file 0644: it holds no credential, and the container reads it as uid
#       1000.
#   [ ] /opt/inflect/.env.scanner, holding every variable that file names
#       (deploy/harness-scanner/scanner.env.example), root-owned, mode 0600.
#   [ ] A dry run reads every source COMPLETE before the schedule starts:
#         docker compose ... run --rm harness-scanner \
#           scan --dry-run --config /etc/agent-harness-scanner/config.json
#
# ── TEARDOWN ──────────────────────────────────────────────────────────
#   docker compose ... rm -sf harness-scanner harness-egress
#   revoke the ingest key and each source's read credential at its source
#   remove /opt/inflect/.env.scanner
#
services:
  harness-scanner:
    # `Scanner image` run 43398571764, 2026-11-13, commit b25747dff (scanner
    # 0.13.0, contract /4: #5414's refusal of a secret-shaped member name,
    # #5471's provider-SDK agents in the `code` source, #5489's scoped
    # reconcile): smoke-tested, then Trivy-gated at CRITICAL,HIGH with
    # nothing found.
    image: ghcr.io/rodnapamet/agent-harness-scanner@sha256:e9059418045046ce507c56b68e818de1e59c945176c21abfdcb9b993a4598924
    restart: unless-stopped
    command: ["schedule", "--config", "/etc/agent-harness-scanner/config.json"]
    # Capacity budget C1 (2026-11-12): peak 155 MiB; 1.5x rounded up, with
    # room for a larger estate's code parse. Batch-shaped, so capped at one
    # core with half the weight under contention: the request path keeps the
    # other. docs/implementation-notes/2026-11-12-capacity-c1.md.
    mem_limit: 512m
    cpus: 1.0
    cpu_shares: 512
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env.scanner
    # After `env_file`, so these win over anything that file sets.
    environment:
      HTTPS_PROXY: http://harness-egress:3128
      # Cleartext too, so a plain-http request meets the proxy's 405 rather
      # than a missing route.
      HTTP_PROXY: http://harness-egress:3128
      NO_PROXY: ""
      NODE_USE_ENV_PROXY: "1"
    networks:
      - harness-scanner-internal
    depends_on:
      - harness-egress
    volumes:
      - ./harness-scanner:/etc/agent-harness-scanner:ro
    logging:
      # The canonical file's `default-logging`. An anchor does not cross
      # files, so its values are repeated here.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  harness-egress:
    # The SAME digest as the scanner: the proxy is reviewed code from this
    # repository, not a third-party image. `vm.sh` refuses two digests.
    image: ghcr.io/rodnapamet/agent-harness-scanner@sha256:e9059418045046ce507c56b68e818de1e59c945176c21abfdcb9b993a4598924
    restart: unless-stopped
    entrypoint: ["node", "--import", "tsx", "/app/packages/agent-harness-scanner/src/egress-proxy.ts"]
    command: []
    # Capacity budget C1: peak 66 MiB; a Node process's floor. It forwards
    # the scanner's tunnels and nothing else, so half a core is ample.
    mem_limit: 256m
    cpus: 0.5
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Exact hostnames, no wildcard. Empty or missing refuses every tunnel.
    environment:
      EGRESS_ALLOW: graph.microsoft.com,login.microsoftonline.com,api.github.com,iam.googleapis.com,oauth2.googleapis.com,app.inflect.bg
    networks:
      - harness-scanner-internal
      - harness-scanner-egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # No route out. The scanner's only network.
  harness-scanner-internal:
    internal: true
  # The proxy's way out, and nothing else's.
  harness-scanner-egress: {}
