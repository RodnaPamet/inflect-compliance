# Operator-owned boundary policy for the Powerpipe collector sandboxes.
#
# ═══ WHAT THIS FILE IS, AND WHY IT IS NOT GENERATED ═══
#
# `openshell-prover check` asks one question: is a candidate policy contained
# within a BOUNDARY the operator owns. The candidate is composed by
# `collectorSandboxPolicy()`; this file is the boundary, and it is committed and
# hand-maintained ON PURPOSE.
#
# Deriving it from the same code that composes the candidate would make the
# proof almost vacuous — a policy is trivially contained within itself, so a
# widened allowlist would widen the boundary in the same commit and nothing
# would ever fail. Keeping it separate is what gives the check teeth: widening
# the code's allowlist without a deliberate edit here fails
# `openshell-prover-boundary-covers-the-policy`, and the edit is the moment a
# human decides the wider access is acceptable.
#
# ═══ SCHEMA: VERSION 1, WHICH IS NOT THE GATEWAY'S ═══
#
# The gateway's policy schema is version 2. The prover accepts version 1 only
# and rejects version 2 outright. `src/lib/agentic/openshell/prover-policy.ts`
# translates between them and records what cannot cross: `enforcement` has no
# version 1 field at all, so NOTHING PROVEN HERE SAYS THE POLICY ENFORCES
# RATHER THAN AUDITS. That is 0.1b, and it is outside this file's reach.
#
# ═══ THE PATHS ARE EXACT, NOT ANCESTORS ═══
#
# The prover does not reason about path prefixes: a candidate reading
# `/usr/bin` against a `/usr` boundary answers `unsupported`, not
# `within_boundary`. So these repeat the candidate's paths exactly. Stating a
# broader ancestor would make every check undecidable rather than more
# permissive.
version: 1

filesystem_policy:
  # `rootReadOnly: true` in the composed policy.
  read_only:
    - /
  # The single writable path — Powerpipe's mod cache. `COLLECTOR_SCRATCH_DIR`.
  read_write:
    - /var/tmp/powerpipe

process:
  # `COLLECTOR_RUN_AS_USER`, a numeric non-root uid. This is how
  # `allowRoot: false` is expressed: the prover has no boolean for it, and a
  # boundary naming this uid refuses both `root` and `0` — measured.
  #
  # `run_as_group` is deliberately absent, here and in the candidate. The
  # comparison is decidable only when both sides agree on the field's presence;
  # with a group on one side only, the prover answers `unsupported`. We set no
  # group, so neither side names one.
  run_as_user: '65532'

landlock:
  # Anything weaker is refused: a `best_effort` candidate against this
  # boundary answers `exceeds_boundary` — measured.
  compatibility: hard_requirement

network_policies:
  # The key is NOT load-bearing. The prover compares endpoint SETS and ignores
  # the name, measured by renaming it and getting the same verdict.
  operator-boundary:
    endpoints:
    # ── aws ──
    # EXPLICIT per service (#4569). The wildcard is gone: it was not merely
    # unprovable, it EXCEEDED this boundary — counterexample a.amazonaws.com.
    # Derived, not hand-written: prefixes from aws-sdk-go-v2's own endpoint
    # templates, the regional/global split from botocore's endpoints.json, and
    # the service set from the steampipe plugin's aws/service.go. Region
    # eu-west-1 is the one this boundary permits — see COLLECTOR_AWS_REGION.
    - host: account.amazonaws.com
      port: 443
