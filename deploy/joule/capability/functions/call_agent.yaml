# The A2A invocation, with multi-turn support (#3865).
#
# ── WHY THE MESSAGE ACTION IS WHY J3 EXISTS ────────────────────────────────
#
# The `message` action below renders
# `result.body.status.message.parts[0].text` UNCONDITIONALLY — for every task
# state, not only `completed`. So whatever Inflect puts in that text part is
# what a Joule user reads, and an absent text part shows them nothing.
#
# That is the shape #3863 was built against, and reading it here confirms the
# design from SAP's side rather than from ours: before J3 the response carried a
# state and no words, so a Joule user would have seen an empty message on every
# call. Every state now carries sentences (`a2a-run-answer.ts`).
#
# ── MULTI-TURN ──────────────────────────────────────────────────────────────
#
# First call: both ids are empty, `body` is null, Inflect starts a run and
# returns the run id as `result.body.id`. Follow-up: the ids are passed back and
# the host's `tasks/get` branch answers for that task. `result.body.id` is the
# run id, which is what Inflect uses as the task id.
parameters:
  - name: contextId
    optional: true
  - name: taskId
    optional: true

action_groups:
  - actions:
      - type: status-update
        message: <? "Reviewing against your compliance controls" ?>

      - type: agent-request
        agent_type: remote
        system_alias: InflectComplianceReview
        body: >
          <? (contextId == null || contextId.isEmpty()) && (taskId == null || taskId.isEmpty())
             ? null
             : '{ "contextId": "' + contextId + '", "taskId": "' + taskId + '" }' ?>
        result_variable: result

      - type: set-variables
        variables:
          - name: contextId
            value: <? result.body.contextId ?>
          - name: taskId
            value: <? result.body.id ?>

      - type: message
        message:
          type: text
          content: "<? result.body.status.message.parts[0].text ?>"
          markdown: true

result:
  contextId: "<? contextId ?>"
  taskId: "<? taskId ?>"
