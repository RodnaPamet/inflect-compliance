# Cross-Framework Mapping Set: ISO/IEC 42001:2023 → IMDA Model AI Governance Framework (May 2026)
# Data-driven mapping file for the RequirementMapping ingestion pipeline.
#
# The MGF and ISO 42001 answer the same governance questions in different registers.
# This map is how an AIMS-certified customer inherits MGF coverage, and it is the hop
# that puts the MGF two edges from ISO 27001 through OWASP ASI.
#
# Every entry is [curated] — Inflect's judgement of conceptual alignment, NOT
# part of either publication. Mappings are STRUCTURAL GUIDANCE, never a
# compliance guarantee: the gap-analysis layer treats SUBSET / INTERSECT /
# RELATED as "partially covered" or "review needed" and never as covered.
#
# SYMMETRY: this pair ships in BOTH directions. `imda-mgf-to-iso-42001.yaml` is the exact
# transpose of this file with each strength inverted (SUBSET ⇄ SUPERSET;
# EQUAL / INTERSECT / RELATED are self-inverse). Edit one side and
# tests/unit/agentic-framework-mappings.test.ts fails until the other matches.
#
# Refs are YAML-library ref_ids resolved against Framework.key and
# FrameworkRequirement.code by mapping-set-importer.ts.

urn: urn:inflect:mappingset:iso-42001-to-imda-mgf
name: "ISO/IEC 42001:2023 → IMDA Model AI Governance Framework (May 2026)"
description: >
  Cross-framework traceability between ISO/IEC 42001:2023 and IMDA Model AI Governance Framework (May 2026).
  Curated alignment for gap analysis and inherited coverage — structural
  guidance, not a compliance guarantee.
version: 1
source_framework_ref: ISO42001-2023
target_framework_ref: IMDA-MGF-2026

mapping_entries:
  - source_ref: "6.1"
    target_ref: "MGF-1.1"
    strength: INTERSECT
    rationale: "[curated] Actions to address AI risks and opportunities is the planning clause a risk taxonomy and tolerances would be recorded under."
  - source_ref: "8.2"
    target_ref: "MGF-1.1"
    strength: INTERSECT
    rationale: "[curated] Performing the AI risk assessment produces the harms; the MGF additionally asks for an agreed tolerance per harm."
  - source_ref: "A.5.2"
    target_ref: "MGF-1.1"
    strength: RELATED
    rationale: "[curated] A repeatable impact-assessment process is the machinery a taxonomy feeds."
  - source_ref: "5.3"
    target_ref: "MGF-1.2"
    strength: INTERSECT
    rationale: "[curated] Assigning AI roles, responsibilities and authorities is the same obligation stated as a management-system clause."
  - source_ref: "A.3.2"
    target_ref: "MGF-1.2"
    strength: INTERSECT
    rationale: "[curated] Defining AI roles and accountability structures is the Annex A control behind the MGF's internal governance dimension."
  - source_ref: "5.1"
    target_ref: "MGF-1.2"
    strength: RELATED
    rationale: "[curated] Top-management commitment is what makes a governance structure carry authority."
  - source_ref: "A.9.4"
    target_ref: "MGF-1.3"
    strength: INTERSECT
    rationale: "[curated] Preventing scope creep from the intended purpose is the 42001 statement of an agent's authority limits."
  - source_ref: "A.6.2.2"
    target_ref: "MGF-1.3"
    strength: RELATED
    rationale: "[curated] Functional and non-functional requirements are where declared limits would be written."
  - source_ref: "4.3"
    target_ref: "MGF-1.3"
    strength: RELATED
    rationale: "[curated] Determining the scope of the AIMS bounds the organisation, not the individual agent."
  - source_ref: "8.2"
    target_ref: "MGF-1.4"
    strength: SUBSET
    rationale: "[curated] The AI risk assessment addresses systems one at a time; the May 2026 revision asks for risk at the level of the composed agent system."
  - source_ref: "8.4"
    target_ref: "MGF-1.4"
    strength: SUBSET
    rationale: "[curated] The AI system impact assessment covers a single system's effects, a proper part of multi-agent risk."
  - source_ref: "6.1"
    target_ref: "MGF-1.4"
    strength: RELATED
    rationale: "[curated] Risk planning is the clause emergent multi-agent behaviour would be treated under."
  - source_ref: "A.10.3"
    target_ref: "MGF-1.5"
    strength: INTERSECT
    rationale: "[curated] Assessing and managing supplier expectations is the 42001 control nearest third-party agent due diligence."
  - source_ref: "A.10.2"
    target_ref: "MGF-1.5"
    strength: INTERSECT
    rationale: "[curated] Allocating accountability across the AI supply chain is what adopting a third-party agent redistributes."
  - source_ref: "A.9.2"
    target_ref: "MGF-2.1"
    strength: INTERSECT
    rationale: "[curated] Responsible-use operational processes are where a human-involvement model per decision class would be defined."
  - source_ref: "8.1"
    target_ref: "MGF-2.1"
    strength: RELATED
    rationale: "[curated] Operational planning and control frames how decisions are made, without choosing an oversight model."
  - source_ref: "5.3"
    target_ref: "MGF-2.2"
    strength: INTERSECT
    rationale: "[curated] Assigning roles and authorities is the clause under which a named accountable owner per deployed agent sits."
  - source_ref: "A.3.2"
