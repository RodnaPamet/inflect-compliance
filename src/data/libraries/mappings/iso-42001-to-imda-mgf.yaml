  - source_ref: "7.2"
    target_ref: "MGF-2.4"
    strength: RELATED
    rationale: "[curated] Competence of people affecting AI performance is the lever nearest automation bias; 42001 does not name the bias."
  - source_ref: "7.3"
    target_ref: "MGF-2.4"
    strength: RELATED
    rationale: "[curated] Awareness of the AI policy and roles is where over-reliance on agent output would be addressed."
  - source_ref: "A.5.4"
