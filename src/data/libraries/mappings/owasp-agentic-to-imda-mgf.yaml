# Cross-Framework Mapping Set: OWASP Agentic AI Top 10 → IMDA Model AI Governance Framework (May 2026)
# Data-driven mapping file for the RequirementMapping ingestion pipeline.
#
# The two agentic sources mapped to each other: OWASP states the RISKS, the MGF states
# the GOVERNANCE EXPECTATIONS. A customer assessing against one should not have to
# start the other from zero.
#
# Every entry is [curated] — Inflect's judgement of conceptual alignment, NOT
# part of either publication. Mappings are STRUCTURAL GUIDANCE, never a
# compliance guarantee: the gap-analysis layer treats SUBSET / INTERSECT /
# RELATED as "partially covered" or "review needed" and never as covered.
#
# SYMMETRY: this pair ships in BOTH directions. `imda-mgf-to-owasp-agentic.yaml` is the exact
# transpose of this file with each strength inverted (SUBSET ⇄ SUPERSET;
# EQUAL / INTERSECT / RELATED are self-inverse). Edit one side and
# tests/unit/agentic-framework-mappings.test.ts fails until the other matches.
#
# Refs are YAML-library ref_ids resolved against Framework.key and
# FrameworkRequirement.code by mapping-set-importer.ts.

urn: urn:inflect:mappingset:owasp-agentic-to-imda-mgf
name: "OWASP Agentic AI Top 10 → IMDA Model AI Governance Framework (May 2026)"
description: >
  Cross-framework traceability between OWASP Agentic AI Top 10 and IMDA Model AI Governance Framework (May 2026).
  Curated alignment for gap analysis and inherited coverage — structural
  guidance, not a compliance guarantee.
version: 1
source_framework_ref: OWASP-ASI-TOP10
target_framework_ref: IMDA-MGF-2026

mapping_entries:
  - source_ref: "ASI01"
    target_ref: "MGF-1.3"
    strength: INTERSECT
    rationale: "[curated] Declared and enforced authority limits are what a hijacked objective has to break through."
  - source_ref: "ASI01"
    target_ref: "MGF-3.2"
    strength: INTERSECT
    rationale: "[curated] Red-teaming and ongoing evaluation is where goal-hijack resistance is demonstrated."
  - source_ref: "ASI01"
    target_ref: "MGF-3.1"
    strength: RELATED
    rationale: "[curated] Provenance for inputs and memory governs the channels a hijack instruction arrives on."
  - source_ref: "ASI02"
    target_ref: "MGF-1.3"
    strength: INTERSECT
    rationale: "[curated] Which tools and data an agent may reach is exactly the boundary tool misuse crosses."
  - source_ref: "ASI02"
    target_ref: "MGF-3.4"
    strength: INTERSECT
    rationale: "[curated] Least-privilege identity for agents limits what an exploited tool call achieves."
  - source_ref: "ASI02"
    target_ref: "MGF-3.3"
    strength: INTERSECT
    rationale: "[curated] Traceability of tool calls is how misuse is detected after the fact."
  - source_ref: "ASI03"
    target_ref: "MGF-3.4"
    strength: SUPERSET
    rationale: "[curated] Least-privilege identity and credential handling is a control this risk fully contains, which also covers impersonation and attribution."
  - source_ref: "ASI03"
    target_ref: "MGF-3.3"
    strength: INTERSECT
    rationale: "[curated] Traceability of actions is the attribution half of identity abuse."
  - source_ref: "ASI03"
    target_ref: "MGF-2.2"
    strength: RELATED
    rationale: "[curated] A named accountable owner is the human a delegated agent identity ultimately answers for."
  - source_ref: "ASI04"
    target_ref: "MGF-1.5"
    strength: SUPERSET
    rationale: "[curated] Third-party agent due diligence is one channel of a supply-chain surface that also spans base models, prompt packs, plugin registries and update channels."
  - source_ref: "ASI04"
    target_ref: "MGF-3.1"
    strength: RELATED
    rationale: "[curated] Provenance for inputs covers one component class among many."
  - source_ref: "ASI05"
    target_ref: "MGF-3.2"
    strength: INTERSECT
    rationale: "[curated] Pre-release and ongoing testing is where unsafe execution paths are found."
  - source_ref: "ASI05"
    target_ref: "MGF-1.3"
    strength: RELATED
    rationale: "[curated] Enforced authority limits bound what escaped execution can reach."
  - source_ref: "ASI06"
    target_ref: "MGF-3.1"
    strength: INTERSECT
    rationale: "[curated] Data governance and provenance for inputs AND memory is the MGF requirement written for this risk."
  - source_ref: "ASI06"
    target_ref: "MGF-3.3"
    strength: RELATED
    rationale: "[curated] Traceability lets a poisoned memory write be attributed to the session that made it."
  - source_ref: "ASI07"
    target_ref: "MGF-3.6"
    strength: SUPERSET
    rationale: "[curated] Controls on inter-agent communication and delegation are the control set for this risk; the risk also spans replay and unbounded delegation chains."
  - source_ref: "ASI07"
    target_ref: "MGF-1.4"
    strength: INTERSECT
    rationale: "[curated] Multi-agent system risk assessment is where delegation chains are examined."
  - source_ref: "ASI08"
    target_ref: "MGF-2.3"
    strength: INTERSECT
    rationale: "[curated] Intervention, escalation and stop authority is what a cascade outruns."
  - source_ref: "ASI08"
    target_ref: "MGF-1.4"
    strength: INTERSECT
    rationale: "[curated] Multi-agent risk assessment is where amplification through chained agents is assessed."
  - source_ref: "ASI08"
    target_ref: "MGF-3.5"
    strength: INTERSECT
    rationale: "[curated] Incident detection and response is how an in-progress cascade is halted."
  - source_ref: "ASI09"
    target_ref: "MGF-2.4"
    strength: SUPERSET
    rationale: "[curated] Automation bias in human review is the named mechanism inside a broader trust-exploitation risk that also spans persona and apparent authority."
  - source_ref: "ASI09"
    target_ref: "MGF-4.1"
    strength: INTERSECT
    rationale: "[curated] Disclosure that an AI agent is in use is the first defence against misplaced trust."
  - source_ref: "ASI09"
    target_ref: "MGF-4.2"
    strength: INTERSECT
    rationale: "[curated] Explaining capabilities, limits and failure modes calibrates how much a person should defer."
  - source_ref: "ASI09"
    target_ref: "MGF-4.4"
    strength: INTERSECT
    rationale: "[curated] Guidance against over-reliance is the end-user half of this risk."
  - source_ref: "ASI10"
    target_ref: "MGF-1.2"
