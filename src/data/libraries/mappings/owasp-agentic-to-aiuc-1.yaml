# Cross-Framework Mapping Set: OWASP Agentic AI Top 10 → AIUC-1 (Q4-2026)
# Data-driven mapping file for the RequirementMapping ingestion pipeline.
#
# REVERSE DIRECTION. This file is the machine-checked transpose of
# `aiuc-1-to-owasp-agentic.yaml` — author new entries THERE and let the test tell you
# this half is stale. The rationales are written from that file's
# direction on purpose: each states a claim about the RELATIONSHIP
# between two requirements, which reads the same whichever end you
# start from, and re-wording them here would be a second copy of the
# same judgement that could drift from it silently.
#
# Connects AIUC-1's requirements — which are controls — to the ten agentic
# RISKS OWASP names, so an organisation that holds AIUC-1 controls sees which
# risks they bear on. agent-coverage.ts reads every mapping that targets an
# ASI risk, so these edges also count toward a registered agent's inherited
# risk coverage. No requirement is claimed to retire a risk: every edge is
# INTERSECT or RELATED, because each AIUC-1 requirement mitigates part of a
# risk and none contains another's whole. ASI06 (memory and context
# poisoning) is reached only by RELATED, which is the accurate statement
# that AIUC-1 has no requirement on agent memory.
#
# Every entry is [curated] — Inflect's judgement of conceptual alignment, NOT
# part of either publication, authored from the requirement texts this
# repository carries. AIUC publishes crosswalks of its own; they are AIUC's
# copyright, and none was transcribed or used as a source for this file.
#
# STRENGTHS ARE CHOSEN AGAINST THEIR TRANSPOSE. The reverse of a SUBSET is a
# SUPERSET, which the gap-analysis layer reads as COVERED, so SUBSET and
# SUPERSET are reserved for an edge where meeting the broader requirement as
# written necessarily meets the narrower one. No AIUC-1 edge clears that bar.
# Shared ground is INTERSECT (partially covered); "this is where the control
# would live" is RELATED (review needed, never coverage). No EQUAL anywhere.
#
# SYMMETRY: this pair ships in BOTH directions. `aiuc-1-to-owasp-agentic.yaml` is the exact
# transpose of this file with each strength inverted (SUBSET ⇄ SUPERSET;
# EQUAL / INTERSECT / RELATED are self-inverse). Edit one side and
# tests/unit/agentic-framework-mappings.test.ts fails until the other matches.
#
# Refs are YAML-library ref_ids resolved against Framework.key and
# FrameworkRequirement.code by mapping-set-importer.ts.

urn: urn:inflect:mappingset:owasp-agentic-to-aiuc-1
name: "OWASP Agentic AI Top 10 → AIUC-1 (Q4-2026)"
description: >
  Cross-framework traceability between OWASP Agentic AI Top 10 and AIUC-1 (Q4-2026).
  Curated alignment for gap analysis and inherited coverage — structural
  guidance, not a compliance guarantee.
version: 1
source_framework_ref: OWASP-ASI-TOP10
target_framework_ref: AIUC-1

mapping_entries:
  - source_ref: "ASI01"
    target_ref: "B002"
    strength: INTERSECT
    rationale: "[curated] Detecting prompt injection at run time addresses the commonest route to a hijacked objective; injection that passes undetected through retrieved content or tool output is not closed by it."
  - source_ref: "ASI01"
    target_ref: "B001"
    strength: RELATED
    rationale: "[curated] Quarterly independent testing driven by prompt injection and jailbreaking exercises the hijack routes; AIUC-1 does not require its findings to be fixed."
  - source_ref: "ASI01"
    target_ref: "B005"
    strength: RELATED
    rationale: "[curated] A moderation layer can catch instructions injected into user input, but it judges content, and goal hijack arrives as often through retrieved documents and tool output."
  - source_ref: "ASI01"
    target_ref: "C004"
    strength: RELATED
    rationale: "[curated] Declining subjects outside the deployed purpose limits what a hijacked agent will say, not what it will do."
  - source_ref: "ASI01"
    target_ref: "C006"
    strength: RELATED
    rationale: "[curated] Marking content from untrusted sources is the display-side half of separating data from instruction; ASI01 needs the same separation at the model's input."
  - source_ref: "ASI01"
    target_ref: "B006"
    strength: RELATED
    rationale: "[curated] Holding an agent to its granted privileges limits what a hijacked objective can achieve, without detecting the hijack."
  - source_ref: "ASI02"
    target_ref: "D003"
    strength: INTERSECT
    rationale: "[curated] Allowlisting tools, validating parameters, capping rate and value and holding irreversible operations for approval address most tool misuse; chained calls that are each permitted can still misuse a tool."
  - source_ref: "ASI02"
    target_ref: "B006"
    strength: INTERSECT
    rationale: "[curated] Restricting an agent's reach into backend services to its granted privileges bounds tool misuse at the service side; it does not judge whether a permitted call was the right one."
  - source_ref: "ASI02"
    target_ref: "B001"
    strength: RELATED
    rationale: "[curated] Independent testing for actions the agent was never authorised to make exercises tool exploitation; AIUC-1 does not require its findings to be fixed."
  - source_ref: "ASI02"
    target_ref: "D004"
    strength: INTERSECT
    rationale: "[curated] Quarterly reliability testing of mistaken and unprompted tool calls, with each finding fixed and retested, reduces unintended tool use over successive rounds."
  - source_ref: "ASI02"
    target_ref: "E015"
    strength: RELATED
    rationale: "[curated] Logging each action and attributing it to the agent that ran it makes tool misuse reconstructable after the fact."
  - source_ref: "ASI03"
    target_ref: "A003"
    strength: INTERSECT
    rationale: "[curated] Bounding what an agent reads by task, user and role, with an identity of its own where proportionate, addresses privilege accumulation on the data side."
  - source_ref: "ASI03"
    target_ref: "B006"
    strength: INTERSECT
    rationale: "[curated] Technically enforcing the privileges an agent was granted, and monitoring its security-relevant actions, addresses privilege beyond the task on the action side."
  - source_ref: "ASI03"
    target_ref: "A008"
    strength: INTERSECT
    rationale: "[curated] Holding a credential a user hands the agent in a secret manager, and keeping secrets out of logs and generated code, is part of delegated-credential handling; scoping and rotation are not required."
  - source_ref: "ASI03"
    target_ref: "E015"
    strength: INTERSECT
    rationale: "[curated] Attributing each execution to the agent that ran it is the first link in tracing an action to an accountable principal; the link from agent to person is not required."
  - source_ref: "ASI03"
    target_ref: "B007"
    strength: RELATED
    rationale: "[curated] Role-based access for people to the AI system's configuration and data governs who can reconfigure an agent rather than what the agent itself may do."
  - source_ref: "ASI03"
    target_ref: "B008"
    strength: RELATED
    rationale: "[curated] Authenticating every caller of the agent's interfaces closes impersonation at the boundary; it says nothing about the privileges an authenticated agent holds."
  - source_ref: "ASI04"
    target_ref: "E006"
    strength: INTERSECT
    rationale: "[curated] Assessing model providers before use and on a cycle, and verifying an open-weight model's source and integrity, covers the base-model part of the supply chain; tool registries, skill packs and MCP servers are outside it."
  - source_ref: "ASI04"
    target_ref: "B008"
    strength: INTERSECT
    rationale: "[curated] Verifying model artefacts before they are loaded closes one update channel through which a compromised base model arrives."
  - source_ref: "ASI04"
    target_ref: "C002"
    strength: INTERSECT
    rationale: "[curated] Scanning artefacts and dependencies and regression-testing a changed open-weight model before release intercepts compromise that arrives through an update."
  - source_ref: "ASI04"
    target_ref: "E004"
    strength: RELATED
    rationale: "[curated] Formal approval of AI changes, and signature checks on AI components where proportionate, put an accountable gate on the update channel without inspecting what a third-party component does."
  - source_ref: "ASI04"
    target_ref: "B010"
    strength: RELATED
    rationale: "[curated] Secure defaults for the dependencies generated code pulls in keep the agent from widening its own supply chain."
  - source_ref: "ASI05"
    target_ref: "B006"
    strength: INTERSECT
    rationale: "[curated] Containing an agent's execution in a sandbox is the control ASI05 names, though AIUC-1 requires it only where proportionate."
  - source_ref: "ASI05"
    target_ref: "C006"
    strength: INTERSECT
    rationale: "[curated] Sanitising output a system will run, so it cannot carry script or shell injection, addresses execution at the destination; code the agent is meant to run still needs containment."
  - source_ref: "ASI05"
    target_ref: "B001"
    strength: RELATED
    rationale: "[curated] Quarterly security testing covers actions that install insecure code or execute destructively; AIUC-1 does not require its findings to be fixed."
  - source_ref: "ASI05"
    target_ref: "B010"
    strength: RELATED
    rationale: "[curated] Secure patterns in generated code lower the harm of code that runs, without controlling where it runs."
  - source_ref: "ASI05"
    target_ref: "D003"
    strength: RELATED
    rationale: "[curated] Allowlisting the tools an agent may call, including any that execute code, narrows where execution can happen."
  - source_ref: "ASI06"
    target_ref: "A005"
    strength: RELATED
    rationale: "[curated] Separating customers' data in retrieval and fine-tuning stops a poisoned entry in one customer's store from reaching another customer's sessions."
  - source_ref: "ASI06"
    target_ref: "B002"
    strength: RELATED
    rationale: "[curated] Run-time detection can catch poisoning content as it is written; content stored and replayed in a later session is outside what it sees."
  - source_ref: "ASI06"
    target_ref: "C008"
    strength: RELATED
    rationale: "[curated] Sampling production output against the risk taxonomy can surface the delayed misbehaviour a poisoned memory produces; AIUC-1 has no requirement on agent memory itself."
  - source_ref: "ASI07"
    target_ref: "B008"
    strength: INTERSECT
    rationale: "[curated] Authenticating callers of agent interfaces, encrypting their traffic and, where proportionate, protecting the integrity of agent messages address spoofing and tampering between agents; bounding delegation is outside it."
  - source_ref: "ASI07"
    target_ref: "E015"
    strength: INTERSECT
    rationale: "[curated] Logging agent processes, actions and outputs closes the unlogged failure ASI07 names for exchanges between agents; authenticating and bounding them are outside it."
  - source_ref: "ASI07"
    target_ref: "E009"
    strength: RELATED
    rationale: "[curated] Logging third-party API sessions covers external agents that connect in; traffic between the organisation's own agents is not third-party access."
  - source_ref: "ASI08"
    target_ref: "C009"
    strength: INTERSECT
    rationale: "[curated] Letting users stop, pause or redirect an agent mid-task is the intervention a cascade needs, provided it can be exercised faster than the cascade runs."
  - source_ref: "ASI08"
    target_ref: "D003"
    strength: INTERSECT
    rationale: "[curated] Call-rate limits and caps on value bound how far one faulty action can be amplified by automated repetition."
  - source_ref: "ASI08"
    target_ref: "E002"
    strength: RELATED
    rationale: "[curated] A plan for a harmful output names who contains it once a cascade has done damage: the response, not the prevention."
  - source_ref: "ASI08"
    target_ref: "D004"
    strength: RELATED
    rationale: "[curated] Reliability testing finds the mistaken and incomplete tool calls a cascade starts from."
  - source_ref: "ASI09"
    target_ref: "E016"
    strength: INTERSECT
    rationale: "[curated] Telling people plainly, in every modality, that they are dealing with an AI addresses the persona half of trust exploitation; automation bias in approval workflows is outside it."
  - source_ref: "ASI09"
    target_ref: "E018"
    strength: RELATED
    rationale: "[curated] Quarterly testing that an agent cannot be talked out of disclosing it is an AI checks the disclosure that blunts the persona half of trust exploitation."
  - source_ref: "ASI09"
    target_ref: "D001"
    strength: INTERSECT
    rationale: "[curated] Showing the sources behind an answer and signalling uncertainty counter the false authority of fluent output."
  - source_ref: "ASI09"
    target_ref: "C007"
    strength: RELATED
    rationale: "[curated] Routing risky outputs to a reviewer adds the human step ASI09 warns can be rubber-stamped; AIUC-1 does not design that step against automation bias."
  - source_ref: "ASI09"
    target_ref: "C003"
    strength: RELATED
    rationale: "[curated] Blocking deceptive output removes one means by which an agent manipulates a person."
  - source_ref: "ASI10"
    target_ref: "B006"
    strength: INTERSECT
    rationale: "[curated] Technical limits on an agent's scope and monitoring of its security-relevant actions address the beyond-scope half of ASI10; an unregistered or orphaned agent is outside it."
  - source_ref: "ASI10"
    target_ref: "E004"
    strength: RELATED
    rationale: "[curated] Naming an accountable lead for changes gives each AI system an owner; AIUC-1 requires neither an agent inventory nor reassignment when that owner leaves."
  - source_ref: "ASI10"
    target_ref: "E015"
    strength: RELATED
    rationale: "[curated] Attributing each execution to the agent that ran it is how an unsanctioned agent becomes visible in the logs."
  - source_ref: "ASI10"
    target_ref: "C009"
    strength: RELATED
    rationale: "[curated] A stop control is the means of halting an agent found acting outside its sanctioned scope."
