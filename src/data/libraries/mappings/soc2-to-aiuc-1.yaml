# Cross-Framework Mapping Set: SOC 2 (2017) → AIUC-1 (Q4-2026)
# Data-driven mapping file for the RequirementMapping ingestion pipeline.
#
# Answers how much of AIUC-1 a SOC 2 control set already gives. COMMON
# CRITERIA ONLY: the SOC 2 representation every installed SOC 2 control links
# to (`prisma/fixtures/soc2-control-templates.json`) carries CC1.1–CC9.1 and
# no A1 / C1 / PI1 / P1, so an edge onto one of those would reach no tenant
# that holds SOC 2 controls (invariant 5 of
# tests/unit/agentic-framework-mappings.test.ts refuses exactly that). The
# library also models one node per criteria series — CC6.1 stands for all of
# CC6 — so the edges here are coarse by construction, and AIUC-1's privacy,
# safety and reliability requirements have no SOC 2 route at all.
#
# Every entry is [curated] — Inflect's judgement of conceptual alignment, NOT
# part of either publication, authored from the requirement texts this
# repository carries. AIUC publishes crosswalks of its own; they are AIUC's
# copyright, and none was transcribed or used as a source for this file.
#
# STRENGTHS ARE CHOSEN AGAINST THEIR TRANSPOSE. The reverse of a SUBSET is a
# SUPERSET, which the gap-analysis layer reads as COVERED, so SUBSET and
# SUPERSET appear only where meeting the broader requirement as written
# necessarily meets the narrower one. Shared ground is INTERSECT (partially
# covered); "this is where the control would live" is RELATED (review
# needed, never coverage). No EQUAL anywhere.
#
# SYMMETRY: this pair ships in BOTH directions. `aiuc-1-to-soc2.yaml` is the exact
# transpose of this file with each strength inverted (SUBSET ⇄ SUPERSET;
# EQUAL / INTERSECT / RELATED are self-inverse). Edit one side and
# tests/unit/agentic-framework-mappings.test.ts fails until the other matches.
#
# Refs are YAML-library ref_ids resolved against Framework.key and
# FrameworkRequirement.code by mapping-set-importer.ts.

urn: urn:inflect:mappingset:soc2-to-aiuc-1
name: "SOC 2 (2017) → AIUC-1 (Q4-2026)"
description: >
  Cross-framework traceability between SOC 2 (2017) and AIUC-1 (Q4-2026).
  Curated alignment for gap analysis and inherited coverage — structural
  guidance, not a compliance guarantee.
version: 1
source_framework_ref: SOC2-2017
target_framework_ref: AIUC-1

mapping_entries:
  - source_ref: "CC6.1"
    target_ref: "A003"
    strength: INTERSECT
    rationale: "[curated] Logical access security over protected assets, applied to what an agent may retrieve; scoping by task and session is AIUC-1's addition."
  - source_ref: "CC6.1"
    target_ref: "A005"
    strength: INTERSECT
    rationale: "[curated] Separating one customer's data from another's is logical access security between tenants."
  - source_ref: "CC6.1"
    target_ref: "A008"
    strength: RELATED
    rationale: "[curated] Credential handling is part of logical access security; catching secrets in prompts and generated code is agent-specific."
  - source_ref: "CC6.1"
    target_ref: "B006"
    strength: INTERSECT
    rationale: "[curated] Logical access controls over backend services bound what an agent can act on; monitoring its actions and sandboxing it are AIUC-1's additions."
  - source_ref: "CC6.1"
    target_ref: "B007"
    strength: INTERSECT
    rationale: "[curated] People's access to the AI system's configuration, models and data is logical access security; the quarterly review is AIUC-1's addition."
  - source_ref: "CC6.1"
    target_ref: "B008"
    strength: INTERSECT
    rationale: "[curated] Authenticating callers and encrypting their traffic are part of the access-security architecture around the AI system."
  - source_ref: "CC6.1"
    target_ref: "D003"
    strength: RELATED
    rationale: "[curated] Authorising a tool request is an access decision; allowlists, parameter validation and human approval are AIUC-1's additions."
  - source_ref: "CC6.1"
    target_ref: "E005"
    strength: RELATED
    rationale: "[curated] Encryption and access restrictions on data stores are access security over protected assets; documenting them store by store is AIUC-1's addition."
  - source_ref: "CC7.1"
    target_ref: "B002"
    strength: INTERSECT
    rationale: "[curated] System monitoring and detection, pointed at prompt-injection attempts and handled as incidents."
  - source_ref: "CC7.1"
    target_ref: "B004"
    strength: INTERSECT
    rationale: "[curated] Detecting anomalous use of exposed endpoints and finding their weaknesses is system monitoring; rate limits and quotas are AIUC-1's additions."
  - source_ref: "CC7.1"
    target_ref: "C008"
    strength: RELATED
    rationale: "[curated] System monitoring is the operational layer that sampling production output against the risk taxonomy would feed."
  - source_ref: "CC7.1"
    target_ref: "E001"
    strength: RELATED
    rationale: "[curated] SOC 2's system-operations criteria carry monitoring through to incident response, where a breach plan for the AI system belongs."
  - source_ref: "CC7.1"
    target_ref: "E009"
    strength: INTERSECT
    rationale: "[curated] Monitoring third-party access and alerting on anomalies is system monitoring for one class of user."
  - source_ref: "CC7.1"
    target_ref: "E015"
    strength: INTERSECT
    rationale: "[curated] Activity logging is the mechanism system monitoring rests on; attributing each execution to its agent is AIUC-1's addition."
  - source_ref: "CC8.1"
    target_ref: "C002"
    strength: INTERSECT
    rationale: "[curated] Testing and approving a change before it is implemented overlaps pre-deployment testing across the AI risk taxonomy."
  - source_ref: "CC8.1"
    target_ref: "E004"
    strength: INTERSECT
    rationale: "[curated] Authorising, testing and approving changes overlaps naming which AI changes need formal review and keeping the approval for each."
  - source_ref: "CC9.1"
    target_ref: "E006"
    strength: INTERSECT
    rationale: "[curated] Mitigating risk from vendors overlaps assessing model providers before use and on a cycle; verifying an open-weight model's integrity is AIUC-1's addition."
  - source_ref: "CC9.1"
    target_ref: "E009"
    strength: RELATED
    rationale: "[curated] Vendor risk includes the access a vendor holds to the AI system."
  - source_ref: "CC3.1"
    target_ref: "C001"
    strength: INTERSECT
    rationale: "[curated] Objectives clear enough to identify and assess risk are the precondition for a taxonomy of AI risk graded by severity."
  - source_ref: "CC4.1"
    target_ref: "E008"
    strength: INTERSECT
    rationale: "[curated] Evaluating, on a cycle, whether controls are present and functioning overlaps the quarterly review of key AI processes."
  - source_ref: "CC5.1"
    target_ref: "C005"
    strength: RELATED
    rationale: "[curated] Selecting control activities against identified risks is what mapping each agent-specific high-risk output to detection and a response does."
  - source_ref: "CC2.1"
    target_ref: "E017"
    strength: RELATED
    rationale: "[curated] Generating quality information about the system is the internal-control counterpart of transparency documentation shared outside the organisation."
  - source_ref: "CC1.1"
    target_ref: "E010"
    strength: RELATED
    rationale: "[curated] A commitment to integrity and ethical values is the basis an acceptable use policy extends to the system's users."
