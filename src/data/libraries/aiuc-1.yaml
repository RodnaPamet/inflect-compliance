ref_id: AIUC-1
name: AIUC-1 AI Agent Standard
description: >
  AIUC-1 is a certification standard for AI agents, organised into six domains —
  data and privacy, security, safety, reliability, accountability and society —
  and audited by accredited auditors against what an agent can actually do, how
  it is built and where it runs. It is revised every quarter. Inflect
  carries the requirement identifiers and short titles and describes, in its own
  words, what each requirement asks an organisation to demonstrate.
copyright: >
  AIUC-1 is published by the Artificial Intelligence Underwriting Company (AIUC),
  (c) AIUC, all rights reserved. Source: https://www.aiuc-1.com/. Inflect stores
  the domain names, requirement identifiers and short titles with attribution to
  AIUC; every description is Inflect's own. AIUC's requirement statements,
  control activities, evidence guidance and crosswalks are not reproduced. Not
  legal advice, and not a substitute for an accredited AIUC-1 audit.
