# AIUC-1 — the AI agent standard (Q4-2026 release, 15 October 2026) — Framework Library
#
# WHY THIS FRAMEWORK EXISTS IN INFLECT: AIUC-1 is an auditable certification
# standard written specifically for AI AGENTS — systems that call tools, act on
# a user's behalf and run in production — rather than for AI as a content
# producer. It sits beside the OWASP Agentic AI Top 10 (the threat model) and the
# IMDA MGF (the accountability structure) as the third agent-specific source, and
# it is the one an accredited auditor certifies against.
#
# LICENSING POSITION — READ THIS BEFORE EDITING ANY STRING IN THIS FILE.
#
# AIUC-1 is published by the Artificial Intelligence Underwriting Company (AIUC)
# at https://www.aiuc-1.com/ and is "© AIUC — all rights reserved". Its terms of
# use grant a personal, non-commercial licence to the site and prohibit copying,
# redistributing or creating derivative works from its content. So what is
# reproduced here is the ENUMERATION only:
#
#   * the six domain names (A. Data & Privacy … F. Society), and
#   * each requirement's identifier (A001 … F002) and its short title.
#
# Identifiers and short titles are what lets a tenant cite a requirement to their
# auditor and have it resolve; they are names, not prose. What is NOT reproduced,
# and must never be added here:
#
#   * the requirement statements, keywords and crosswalk tables;
#   * the control activities beneath each requirement (A001.1, A001.2, …) and
#     their evidence guidance — the part an implementer is most tempted to paste.
#
# Every `description` below is written in our own words. Each one says what an
# organisation must be able to DEMONSTRATE for the requirement, which is the job
# a description has to do in this product. A legal review is advisable before
# this ships to customers; see
# docs/implementation-notes/2026-10-24-aiuc-1-framework.md.
#
# WHICH REQUIREMENTS ARE HERE. The 50 requirements in force in the Q4-2026
# release. AIUC-1 retires a requirement rather than renumbering the ones after
# it, so the identifiers have gaps, and those gaps are correct:
#
#   C011, C012  retired Q4-2026 — folded into C010 (third-party safety testing)
#   D002        retired Q4-2026 — folded into D004 (third-party reliability testing)
#   E007        retired in an earlier release
#   E014        retired in an earlier release
#
# A retired requirement places no obligation on anybody, so it is not modelled as
# an assessable row; inventing one so the numbering looks continuous would give a
# tenant something to be "compliant with" that the standard no longer asks for.
#
# THE KEY CARRIES NO EDITION. AIUC-1 is revised every quarter IN PLACE (15
# January, April, July and October), keeping each requirement's identifier. With
# the edition in `ref_id`, every quarterly release would import as a second
# framework and strand every control link, assessment and piece of evidence pinned
# to the first — the same reasoning that keeps `OWASP-ASI-TOP10` unsuffixed. A
# release is a content-hash update on the same rows. `publication_date` names the
# release this file reflects.
#
# APPLICABILITY. AIUC-1 marks eight requirements optional and scopes some to an
# agent capability (code generation, text generation, taking actions, being
# externally facing). Those facts are stated in the description of each affected
# requirement, because the description is what reaches a tenant's database; a
# tenant records the outcome with per-framework applicability.
#
# ONE FRAMEWORK ROW. `prisma/fixtures/aiuc-1-control-templates.json` declares
# this same key, so the library import and the catalogue converge on a single
# `Framework` row (the COSO precedent), rather than the two-row split most older
# frameworks carry. Its requirements are generated from this file.

