# SOC 2 Trust Services Criteria (2017 with 2022 Revision) — Framework Library
# Based on the AICPA Trust Services Criteria framework structure.
# Descriptions paraphrased — NOT verbatim AICPA text.
#
# ═══ SCOPE OF AUTHORED CONTENT — READ BEFORE ASSUMING THIS IS THE WHOLE TSC ═══
#
# The 2017 TSC runs to roughly 33 points of focus across the nine Common
# Criteria series. THIS LIBRARY AUTHORS ONE REPRESENTATIVE CRITERION PER SERIES
# (two for CC1) — EXCEPT CC6, WHICH IS COMPLETE at CC6.1 through CC6.8. That is
# 17 CC leaves, plus one node for each of the four non-security categories:
# A1, C1, PI1, P1. Twenty-one assessable nodes in total.
#
# CC6 WAS COMPLETED BY #3369, AND THAT REVERSED A DECISION RECORDED HERE.
# This header previously declined to author the missing criteria, citing
# docs/control-task-authoring.md — "Say so in the PR rather than synthesising
# from knowledge of the standard" — on the grounds that the AICPA criteria are
# licensed and that paraphrasing criteria nobody has read against the source
# manufactures the appearance of coverage rather than its substance. That
# argument still holds for the ~23 points of focus outside CC6, which remain
# unauthored for exactly that reason.
#
# What made CC6 different, and why the owner chose to complete it:
#
#   * The product's own access-recertification evidence keys on CC6.3
#     ("periodically reviewing" access). With only CC6.1 present, that
#     suggestion resolved to nothing for every tenant — a feature that looked
#     like it worked and fired for nobody. The gap was in the product, not
#     only in the catalogue.
#   * Six of the eight sub-codes ALREADY had a written, grounded control in
#     the delivered catalogue, filed under CC6.1 for want of a code to file it
#     under: provisioning and revocation (CC6.2), periodic access review
#     (CC6.3), physical access and media disposal (CC6.4 / CC6.5), network
#     boundary protection (CC6.6), and encryption in transit (CC6.7). Most of
#     the change was re-attributing those to the sub-code each implements.
#     Only CC6.8 needed a new control (TSC-CC6-7, malicious software), because
#     nothing in the catalogue covered it at all.
#   * No tenant was affected. Measured on production before the change: zero
#     tenants had mapped a single control to any SOC 2 requirement, so the
#     readiness-percentage drop that makes this kind of edit expensive had a
#     blast radius of nobody.
#
# PROVENANCE OF THE CC6 TEXT, STATED PLAINLY: the seven new summaries are
# paraphrases written from the publicly documented TSC structure, marked
# "(Paraphrase)" like every other node in this file, and NOT checked against a
# licensed copy of the AICPA criteria. A reader relying on exact criterion
# wording must go to the AICPA source. The sub-code NUMBERING and the series
# shape are public; the official wording is not reproduced here.
#
# WHAT A READER SHOULD TAKE FROM THAT: a tenant tracking SOC 2 here now tracks
# the whole of CC6, and one criterion per series everywhere else. The series
# are all represented, so nothing is invisible at the series level — but
# "CC7.1 Anomaly Detection" still stands in for several points of focus and a
# SOC 2 auditor will ask about all of them.
#
# ALSO WORTH KNOWING, because the two do not match: the DELIVERED catalogue
# (prisma/fixtures/soc2-control-templates.json) carries the 17 Common Criteria
# ONLY. A1 / C1 / PI1 / P1 exist in this library and are not in the seeded
# fixture, so an installed SOC 2 pack is Security-scoped even though this file
# models all five categories.
#
# The counts are pinned in tests/guardrails/soc2-starter-pack-coverage.test.ts,
# so growing the authored set is a deliberate edit rather than a drift.

urn: urn:inflect:library:soc2-2017
locale: en
ref_id: SOC2-2017
name: SOC 2 Trust Services Criteria
description: >
  The SOC 2 Trust Services Criteria (TSC) framework defines control criteria
  for evaluating and reporting on controls over security, availability,
  processing integrity, confidentiality, and privacy.
copyright: >
  Based on the publicly available AICPA Trust Services Criteria structure.
  Full criteria available from AICPA.
version: 1
publication_date: "2022-01-01"
provider: AICPA
packager: inflect
kind: SOC_CRITERIA

objects:
  framework:
    urn: urn:inflect:framework:soc2-2017
    ref_id: SOC2-2017
    name: SOC 2 Trust Services Criteria
    description: >
      Trust Services Criteria for Security, Availability, Processing Integrity,
      Confidentiality, and Privacy.

    requirement_nodes:
      # ─── CC1 — Control Environment ──────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc1
        ref_id: CC1
        name: Control Environment
        description: >
          The organization demonstrates commitment to integrity and ethical
          values, exercises oversight, and attracts competent individuals.
          (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc1.1
        ref_id: CC1.1
        name: Integrity and Ethical Values
        description: >
          The entity demonstrates a commitment to integrity and ethical values.
          (Paraphrase — COSO Principle 1)
        parent_urn: urn:inflect:req:soc2-2017:cc1
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc1.2
        ref_id: CC1.2
        name: Board Independence
        description: >
          The board of directors demonstrates independence from management
          and exercises oversight of internal control. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc1
        depth: 2
        assessable: true
        category: Security

      # ─── CC2 — Communication & Information ──────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc2
        ref_id: CC2
        name: Communication & Information
        description: >
          The organization generates and uses quality information, communicates
          internally and externally about control functioning. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc2.1
        ref_id: CC2.1
        name: Quality Information
        description: >
          The entity obtains or generates relevant, quality information to
          support the functioning of internal control. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc2
        depth: 2
        assessable: true
        category: Security

      # ─── CC3 — Risk Assessment ──────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc3
        ref_id: CC3
        name: Risk Assessment
        description: >
          The organization identifies and assesses risks to achieving its
          objectives, including fraud risk. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc3.1
        ref_id: CC3.1
        name: Risk Identification
        description: >
          The entity specifies objectives with sufficient clarity to enable
          the identification and assessment of risks. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc3
        depth: 2
        assessable: true
        category: Security

      # ─── CC4 — Monitoring Activities ────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc4
        ref_id: CC4
        name: Monitoring Activities
        description: >
          The organization selects, develops, and performs evaluations to
          determine whether the components of internal control are present
          and functioning, and communicates deficiencies. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc4.1
        ref_id: CC4.1
        name: Control Deficiency Evaluation
        description: >
          The entity selects, develops, and performs ongoing and separate
          evaluations to ascertain whether the components of internal control
          are present and functioning. (Paraphrase — COSO Principle 16)
        parent_urn: urn:inflect:req:soc2-2017:cc4
        depth: 2
        assessable: true
        category: Security

      # ─── CC5 — Control Activities ───────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc5
        ref_id: CC5
        name: Control Activities
        description: >
          The organization selects and develops control activities that
          mitigate risks. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc5.1
        ref_id: CC5.1
        name: Control Selection
        description: >
          The entity selects and develops control activities that contribute
          to the mitigation of risks to the achievement of objectives.
          (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc5
        depth: 2
        assessable: true
        category: Security

      # ─── CC6 — Logical & Physical Access ────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc6
        ref_id: CC6
        name: Logical & Physical Access Controls
        description: >
          The organization restricts logical and physical access to systems
          and data, manages credentials, and protects against unauthorized
          access. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.1
        ref_id: CC6.1
        name: Access Security
        description: >
          The entity implements logical access security software, infrastructure,
          and architectures over protected assets. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.2
        ref_id: CC6.2
        name: User Registration and Credential Removal
        description: >
          Before issuing credentials and granting access, the entity registers and
          authorises new internal and external users whose access it
          administers; when a user no longer requires access, their
          credentials are removed. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.3
        ref_id: CC6.3
        name: Least Privilege and Periodic Access Review
        description: >
          The entity authorises, modifies and removes access to data, software and
          functions on the basis of roles and responsibilities, giving
          consideration to least privilege and segregation of duties, and
          reviews that access periodically. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.4
        ref_id: CC6.4
        name: Physical Access Restriction
        description: >
          The entity restricts physical access to facilities and protected assets —
          data centre space, back-up media storage and other sensitive
          locations — to authorised personnel. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.5
        ref_id: CC6.5
        name: Secure Asset and Media Disposal
        description: >
          The entity withdraws logical and physical protection from a physical
          asset only once the ability to read or recover data and software
          from it has been diminished and is no longer required. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.6
        ref_id: CC6.6
        name: Boundary Protection
        description: >
          The entity implements logical access security measures to protect against
          threats originating outside its system boundaries. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.7
        ref_id: CC6.7
        name: Information Transmission and Movement
        description: >
          The entity restricts the transmission, movement and removal of information
          to authorised users and processes, and protects it while it is in
          transit, being moved or being removed. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc6.8
        ref_id: CC6.8
        name: Unauthorised and Malicious Software
        description: >
          The entity implements controls to prevent, or to detect and act upon, the
          introduction of unauthorised or malicious software. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc6
        depth: 2
        assessable: true
        category: Security

      # ─── CC7 — System Operations ────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc7
        ref_id: CC7
        name: System Operations
        description: >
          The organization detects and monitors for anomalies and events that
          represent potential compromises, and responds to incidents. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc7.1
        ref_id: CC7.1
        name: Anomaly Detection
        description: >
          To meet its objectives, the entity uses detection and monitoring
          procedures to identify changes to configurations that result in
          new vulnerabilities. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc7
        depth: 2
        assessable: true
        category: Security

      # ─── CC8 — Change Management ────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc8
        ref_id: CC8
        name: Change Management
        description: >
          The organization manages authorization, design, development,
          configuration, testing, and approval of changes. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc8.1
        ref_id: CC8.1
        name: Change Authorization
        description: >
          The entity authorizes, designs, develops or acquires, configures,
          documents, tests, approves, and implements changes. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc8
        depth: 2
        assessable: true
        category: Security

      # ─── CC9 — Risk Mitigation ──────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:cc9
        ref_id: CC9
        name: Risk Mitigation
        description: >
          The organization identifies, selects, and develops risk mitigation
          activities for risks from business processes and vendors. (Paraphrase)
        depth: 1
        assessable: false
        category: Security

      - urn: urn:inflect:req:soc2-2017:cc9.1
        ref_id: CC9.1
        name: Vendor Risk
        description: >
          The entity identifies, selects, and develops risk mitigation
          activities for risks arising from the use of vendors. (Paraphrase)
        parent_urn: urn:inflect:req:soc2-2017:cc9
        depth: 2
        assessable: true
        category: Security

      # ─── A1 — Availability ──────────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:a1
        ref_id: A1
        name: Availability
        description: >
          The organization maintains infrastructure, software, and procedures
          to support system availability as committed. (Paraphrase)
        depth: 1
        assessable: true
        category: Availability

      # ─── C1 — Confidentiality ───────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:c1
        ref_id: C1
        name: Confidentiality
        description: >
          The organization identifies and protects confidential information
          during processing, storage, and disposal. (Paraphrase)
        depth: 1
        assessable: true
        category: Confidentiality

      # ─── PI1 — Processing Integrity ─────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:pi1
        ref_id: PI1
        name: Processing Integrity
        description: >
          The organization ensures system processing is complete, valid,
          accurate, timely, and authorized. (Paraphrase)
        depth: 1
        assessable: true
        category: Processing Integrity

      # ─── P1 — Privacy ──────────────────────────────────────────────

      - urn: urn:inflect:req:soc2-2017:p1
        ref_id: P1
        name: Privacy
        description: >
          The organization manages personal information in conformity
          with its privacy commitments and criteria. (Paraphrase)
        depth: 1
        assessable: true
        category: Privacy
