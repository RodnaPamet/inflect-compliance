        description: Produce, store, protect, and analyze logs of activities and security events. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.8
        depth: 2
        assessable: true
        category: Technological

      - urn: urn:inflect:req:iso27001-2022:a.8.16
