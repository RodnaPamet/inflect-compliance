        description: Collect and analyze threat information to produce actionable intelligence. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.9
        ref_id: A.5.9
        name: Inventory of Information Assets
        description: Identify, classify, and maintain an inventory of information assets. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.12
        ref_id: A.5.12
        name: Classification of Information
        description: Classify information according to sensitivity and criticality. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.14
        ref_id: A.5.14
        name: Information Transfer
        description: Protect information during transfer using appropriate security measures. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.15
        ref_id: A.5.15
        name: Access Control
        description: Establish rules to control logical and physical access to information. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.17
        ref_id: A.5.17
        name: Authentication Information
        description: Control the allocation and management of authentication credentials. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.18
        ref_id: A.5.18
        name: Access Rights
        description: Manage the lifecycle of access rights — provisioning, periodic review, change and removal — according to the access-control policy. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.19
        ref_id: A.5.19
        name: Supplier Relationships Security
        description: Define processes to manage security risks from supplier relationships. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.20
        ref_id: A.5.20
        name: Addressing Security in Supplier Agreements
        description: Establish and agree relevant security requirements with each supplier. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.23
        ref_id: A.5.23
        name: Information Security for Use of Cloud Services
        description: Manage information security for cloud service use including acquisition, operation, and exit. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.24
        ref_id: A.5.24
        name: Incident Management Planning
        description: Plan and prepare for managing information security incidents effectively. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.26
        ref_id: A.5.26
        name: Response to Information Security Incidents
        description: Respond to information security incidents according to documented procedures. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.29
        ref_id: A.5.29
        name: Disruption Preparedness
        description: Plan for maintaining information security during disruptions. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.30
        ref_id: A.5.30
        name: ICT Readiness for Business Continuity
        description: Plan, implement, maintain, and test ICT readiness for business continuity. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.31
        ref_id: A.5.31
        name: Legal, Statutory, Regulatory and Contractual Requirements
        description: Maintain an up-to-date register of the laws, regulations and contractual obligations that affect information security, with how each is met. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.32
        ref_id: A.5.32
        name: Intellectual Property Rights
        description: Respect intellectual property rights, the organisation's own and those of others, through procedures covering licensed software and proprietary material. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

      - urn: urn:inflect:req:iso27001-2022:a.5.34
        ref_id: A.5.34
        name: Privacy and PII Protection
        description: Ensure privacy and protection of personally identifiable information. (Paraphrase)
        parent_urn: urn:inflect:req:iso27001-2022:a.5
        depth: 2
        assessable: true
        category: Organizational

