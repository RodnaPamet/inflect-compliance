  # ─── Cross-Framework Mappings ─────────────────────────────────────
  # Guidance mappings from ISO 27001 Annex A controls to SOC 2 Trust Services
  # Categories and NIS2 requirement areas.
  # These are approximate guidance mappings — NOT guarantees of compliance.
  # Each mapping uses URN-based source/target references and a strength indicator.
  #
  # Mapping strength conventions:
  #   RELATED   — Conceptually related but not equivalent (most common for cross-standard)
  #   INTERSECT — Partial overlap in scope
  #   SUBSET    — Source partially covers target
  #   SUPERSET  — Source fully covers target
  #   EQUAL     — Semantically equivalent
  #
  # Only high-confidence, structurally defensible mappings are included.

  mappings:
    # ─── A.5.1 Information Security Policies ─────────────────────────
    - source_urn: urn:inflect:req:iso27001-2022:a.5.1
      target_urn: urn:inflect:req:soc2-2017:cc1.1
      strength: RELATED
      rationale: Information security policies set the standards of conduct the SOC 2 control environment expects (CC1.1). (Guidance)
    - source_urn: urn:inflect:req:iso27001-2022:a.5.1
      target_urn: urn:inflect:req:soc2-2017:cc5.1
      strength: RELATED
      rationale: Information security policies establish the control activities SOC 2 expects to be selected and deployed (CC5.1). (Guidance)
    - source_urn: urn:inflect:req:iso27001-2022:a.5.1
      target_urn: urn:inflect:req:nis2-2022:nis2-gov
      strength: RELATED
      rationale: Security policies address NIS2 governance requirements. (Guidance)

    # ─── A.5.2 Information Security Roles ────────────────────────────
    - source_urn: urn:inflect:req:iso27001-2022:a.5.2
      target_urn: urn:inflect:req:soc2-2017:cc1.2
      strength: RELATED
      rationale: Assigned security roles give the oversight and accountability structure of the SOC 2 control environment (CC1.2; the TSC structure criterion CC1.3 is not in this catalogue). (Guidance)
    - source_urn: urn:inflect:req:iso27001-2022:a.5.2
      target_urn: urn:inflect:req:nis2-2022:nis2-gov
