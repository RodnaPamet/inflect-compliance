      target_urn: urn:inflect:req:soc2-2017:cc5.1
      strength: RELATED
      rationale: Segregation of duties is a control activity SOC 2 expects in control selection (CC5.1). (Guidance)
    - source_urn: urn:inflect:req:iso27001-2022:a.5.3
      target_urn: urn:inflect:req:soc2-2017:cc6.3
      strength: RELATED
      rationale: Segregating conflicting duties is part of least-privilege access in SOC 2 (CC6.3). (Guidance)
