# FINOS AI Governance Framework (AIGF) — Framework Library
#
# WHY THIS FRAMEWORK EXISTS IN INFLECT: the AIGF is the financial-services
# industry's open catalogue of AI risks and the mitigations that address them,
# maintained by FINOS (the Fintech Open Source Foundation) and cited against
# ISO/IEC 42001, the EU AI Act, NIST SP 800-53 and OWASP. It sits beside ISO
# 42001 (the management system) and the EU AI Act (the regulation) as the
# control-level catalogue a regulated firm can implement and evidence.
#
# WHAT IS MODELLED. The 25 MITIGATIONS are the requirements: they are what an
# organisation implements and evidences. The 24 RISKS are not requirements; they
# ship as risk templates (prisma/fixtures/risk-templates-finos-aigf.json), so a
# risk register can start from them. Mitigations are grouped as FINOS types them,
# preventative and detective.
#
# LICENSING: CC-BY-4.0, which permits copying with attribution. The product
# decision (2026-11-07) is nonetheless an INDEX: identifiers and short titles are
# FINOS's, every description is Inflect's own, and the FINOS prose stays at the
# source. That keeps the content stable when FINOS rewrites its text, which it
# does often, and needs no review of how much was copied.
#
# IDENTIFIERS are FINOS's own sequence numbers (`MI-n`), as its repository files
# carry them. FINOS retires a number rather than reusing it. Its public ID scheme
# is still under discussion upstream (finos/ai-governance-framework#398); if it
# changes, the new identifier belongs in each node's annotation, not in `ref_id`,
# which is the key every tenant link resolves against.
#
# THE KEY CARRIES NO EDITION. The AIGF is revised in place on its main branch
# with stable identifiers, so an edition in `ref_id` would make each revision a
# second framework (the OWASP-ASI-TOP10 and AIUC-1 reasoning).
# `publication_date` names the snapshot this file reflects: commit 67b8c3257695.
#
# DRAFTS. FINOS marks MI-24 and MI-25 as draft. They are carried, and their
# descriptions say so, so a tenant can decide whether to adopt them yet.
#
# ONE FRAMEWORK ROW. prisma/fixtures/finos-aigf-control-templates.json declares
# this same key and its requirements are generated from this file, so the
# library import and the catalogue write one Framework row with the same
# requirement rows (the AIUC-1 and COSO precedent).

urn: urn:inflect:library:finos-aigf
locale: en
ref_id: FINOS-AIGF
name: FINOS AI Governance Framework
description: >-
  The FINOS AI Governance Framework (AIGF) is an open catalogue of the risks of
  running AI systems in financial services, and of the mitigations that address
  them, maintained by the Fintech Open Source Foundation. Inflect carries each
  mitigation as one requirement, with FINOS identifiers and short titles and
  Inflect-written descriptions of what the mitigation asks an organisation to
  demonstrate. The risks are in the risk-template library.
copyright: >-
  FINOS AI Governance Framework, (c) FINOS and contributors, licensed under
  CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/). Source:
  https://github.com/finos/ai-governance-framework. Inflect stores the
  mitigation identifiers and short titles with attribution to FINOS; every
  description is Inflect's own, and the FINOS text is not reproduced. Not legal
  advice.
version: 1
text_hash: 5a1aa2f84170cbc35704856991ec0df6a20a2cf5825f083589463085ec5c6706
