# EU Drone Operations — Implementing Regulation (EU) 2019/947 — Framework Library
#
# WHAT THIS IS. The operating rules for unmanned aircraft systems in the EU, as
# consolidated up to Amendment 5 (Regulation (EU) 2024/1110, applicable from
# 1 May 2025), plus the operator obligations of the U-space regulation
# (Regulation (EU) 2021/664). It is the operator's side of EU drone law; the
# product rules of Delegated Regulation (EU) 2019/945 bind manufacturers and are
# referenced only where an operator relies on them (class labels, remote ID).
#
# HOW IT IS CUT. By operating SUBCATEGORY, because that is the axis an
# operator's compliance work follows: section A binds every operation; B is the
# open category's common rules and C-E its subcategories A1, A2 and A3; F is the
# specific category's common rules, G the standard-scenario declaration, H and I
# the scenarios STS-01 and STS-02, J the operational authorisation (SORA or
# PDRA) and K the light UAS operator certificate. The catalogue fixture ships
# one PACK per subcategory and the install wizard makes a tenant choose at least
# one, so a tenant flying only A2 installs only what governs A2.
#
# OUT OF SCOPE. The certified category (certified aircraft and operator,
# licensed pilot) is regulated like manned aviation and is not modelled; Article
# 16 model aircraft clubs are not modelled; Articles addressed only to Member
# States or competent authorities (17, 18, 21-23) are not modelled.
#
# LICENSING. EU legislation may be reused under Commission Decision
# 2011/833/EU with the source acknowledged; only the Official Journal text is
# authentic. The article and point references and their titles are the
# regulation's. Every description is Inflect's own account of what the provision
# asks an operator to demonstrate — paraphrase, not a reproduction. Figures taken
# from EASA's acceptable means of compliance and guidance material are attributed
# to EASA in the control content that uses them.
#
# ONE FRAMEWORK ROW. prisma/fixtures/eu-uas-ops-control-templates.json declares
# this same key and generates its requirements from this file, so the library
# import and the catalogue converge on a single Framework row (the COSO and
# AIUC-1 precedent).
#
# THE KEY CARRIES NO EDITION. The regulation is amended in place under stable
# article and point references; a new amendment is a content update on the same
# rows, recorded by bumping `version` (and `text_hash`).

urn: urn:inflect:library:eu-uas-ops
locale: en
ref_id: EU-UAS-OPS
name: "EU Drone Operations (Regulation (EU) 2019/947)"
description: >
  The operating rules for drones in the EU: Commission Implementing Regulation
  (EU) 2019/947 as amended up to Regulation (EU) 2024/1110, which applies from
  1 May 2025, together with the U-space operator obligations of Regulation
  (EU) 2021/664. It is organised by operating subcategory: the open category's
  A1, A2 and A3, and the specific category's standard scenarios STS-01 and
  STS-02, operational authorisation and the light UAS operator certificate.
  Article and point references and titles are the regulation's; the
  descriptions are Inflect's account of what each asks an operator to
  demonstrate.
copyright: >
  Implementing Regulation (EU) 2019/947 and Regulation (EU) 2021/664, (c)
  European Union, https://eur-lex.europa.eu/. Reuse is authorised under
