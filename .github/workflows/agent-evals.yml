name: Agent evals (Inspect, nightly)

# Task-shaped evaluation of Inflect's OWN agent engines: each of the ten
# governed-run tasks in evals/inspect/task-set.json starts a real run on a seed
# tenant, awaits settlement, and is scored from the ledger the run left
# (WorkflowStep, proposals, the run row) read through the product's own API.
# Roadmap: docs/ai-architecture/inspect.md, Phase 1. Modelled on garak.yml
# (boot app + Postgres + Redis + worker, skip without the CI key, a dated
# deferral a guard parses).
#
#   - NO BYPASS. Runs start through POST /api/t/<slug>/agent-runs with the
#     seed agent's BOUND API key, the way an agent starts one (a reasoning
#     engine refuses a run no ACTIVE registered agent vouches for, and a
#     session binds no agent). Every read, and the kill in task 3, goes through
#     the routes the product's pages call, as the seed tenant's OWNER. The
#     harness never reads the database.
#   - BOTH ENGINES, one after the other, one sample in flight on the whole
#     deployment (`--max-samples 1`): tasks 1 and 10 read tenant-wide counts
#     and task 3's kill would abort a concurrent sample. The record refuses
#     overlapping samples.
#   - BUDGET (D-EV-6, owner, 2026-11-11): USD 10 per night for BOTH engines
#     (evals/inspect/budget.json). The measured spend is read from the decision
#     log before each engine starts; an engine that cannot fit is skipped and
#     says so. The invoice-level stop is the spend limit on the dedicated key's
#     workspace (an owner action).
#   - MODEL: the budget's model (budget.json `model`, claude-haiku-4-5) for both
#     engines, pinned below for EVERY variable an engine reads its model from:
#     Flue's supervisor and worker, and the Tool Runner's two profile tiers,
#     which otherwise default to Sonnet and Opus. The record's model revision
#     is read from the same budget.json. Through the DEDICATED CI key in
#     INSPECT_CI_ANTHROPIC_KEY. With the secret absent the job SKIPS cleanly
#     (first step) and says so.
#   - NON-BLOCKING until the date below, under a dated marker that
#     tests/guardrails/agent-evals-workflow-pinning.test.ts PARSES and compares
#     to today. Phase 2 removes it and blocks on any task regression.
#     AGENT-EVAL-NON-BLOCKING-UNTIL: 2027-02-28
#   - RECORDS are validated by scripts/inspect-record-check.ts (the record
#     module recomputes every verdict; a stated verdict is a refusal) and
#     uploaded; committing one under evals/inspect/records/ is a reviewed pull
#     request a person opens from the artifact, because a committed record is
#     evidence (G11) and evidence is not written by the job that produced it.
#   - Runs no Jest, so it is NOT in the coverage partition.
#   - Unreachable from a pull request by design (schedule + dispatch only);
#     registered in tests/guardrails/ci-checks-unreachable-before-merge.json.
on:
  workflow_dispatch:
  schedule:
    # 02:20 UTC daily: after garak (01:15), clear of the 03:00 identity sync,
    # the 03:30 load test and the 04:00 DAST baseline.
    - cron: '20 2 * * *'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect (flue, tool-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_TEST_MODE: '1'
      SYNTHETIC_TEST_HARNESS: '1'
      RATE_LIMIT_ENABLED: '0'
      AUTH_SECRET: ci-inspect-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3008
      NEXTAUTH_SECRET: ci-inspect-secret-do-not-use-in-prod
      DATA_ENCRYPTION_KEY: ci-inspect-data-encryption-key-32b
      PORT: '3008'
      SKIP_ENV_VALIDATION: '1'
      # Both engines on for the job (the Phase 0 note's deployment).
      AGENT_DRIVER_FLUE: '1'
      AGENT_DRIVER_TOOL_RUNNER: '1'
      AGENT_PROFILES: '1'
      # D-EV-6: the model both engines run on for this job, every variable an
      # engine reads one from. The pinning guard holds each equal to the
      # budget's model, so the spend breaker prices what actually ran.
      AGENT_FLUE_MODEL: claude-haiku-4-5
      AGENT_FLUE_WORKER_MODEL: claude-haiku-4-5
      AGENT_TOOL_RUNNER_MODEL_BALANCED: claude-haiku-4-5
      AGENT_TOOL_RUNNER_MODEL_DEEP: claude-haiku-4-5

    steps:
      - name: Check for the Inspect CI key
        id: key
        env:
          KEY: ${{ secrets.INSPECT_CI_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          ENABLED: ${{ vars.AGENT_EVALS_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          # Owner decision 2026-11-12: the nightly is OFF unless the repo
          # variable AGENT_EVALS_ENABLED is 'true' (GitHub -> Settings -> Variables ->
          # Actions). A manual dispatch always runs, so a person can run it once.
          if [ "$EVENT" = "schedule" ] && [ "$ENABLED" != "true" ]; then
            echo "::notice::The agent-evals nightly is switched off (repository variable AGENT_EVALS_ENABLED is not 'true'); dispatch the workflow to run it once."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEY" ]; then
            echo "::notice::neither INSPECT_CI_ANTHROPIC_KEY nor ANTHROPIC_API_KEY is set; the agent-evals run is skipped (owner action in docs/ai-architecture/inspect.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - name: Setup Node + Prisma client
        if: steps.key.outputs.present == 'true'
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: '24'

      - name: Create PostgreSQL roles for RLS
        if: steps.key.outputs.present == 'true'
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      # The four seed tenants of the Phase 0 note, kept apart from acme-corp:
      # the injection and secret fixtures and the kill switch must not reach
      # any other job. The seed writes a manifest with ids and synthetic
      # markers only (no secrets), and each tenant's agent-bound API key to a
      # SEPARATE file under RUNNER_TEMP, which is never uploaded and is masked
      # before use. It fails closed while the seed is unbuilt.
      - name: Apply migrations + seed the Inspect tenants
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npx prisma migrate deploy
          if [ ! -f scripts/inspect-seed.ts ]; then
            echo "::error::scripts/inspect-seed.ts is not built yet (inspect.md Phase 1 remainder); the four seed tenants cannot be created."
            exit 1
          fi
          mkdir -p inspect-out
          npx tsx scripts/inspect-seed.ts --agent-keys "$RUNNER_TEMP/inspect-agent-keys.json" > inspect-out/seed-manifest.json

      - name: Build app
        if: steps.key.outputs.present == 'true'
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: Start app + worker (background)
        if: steps.key.outputs.present == 'true'
        env:
          NODE_ENV: production
          ANTHROPIC_API_KEY: ${{ secrets.INSPECT_CI_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          npm start > /tmp/app.log 2>&1 &
          npx tsx scripts/worker.ts > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3008/api/health > /dev/null 2>&1; then echo "App is up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "App failed to start within 60s."; tail -n 100 /tmp/app.log || true; exit 1

      - name: Build the Inspect image
        if: steps.key.outputs.present == 'true'
        run: |
          docker build -t inflect-inspect:ci evals/inspect
          docker image inspect inflect-inspect:ci --format '{{.Id}}' > inspect-out/harness-image-id

      # NON-BLOCKING: continue-on-error is allowed here ONLY beside the dated
      # AGENT-EVAL-NON-BLOCKING-UNTIL marker in this file's header, which the
      # pinning guard parses. The step still exits non-zero when an engine's
      # pass failed to run or its record was refused.
      - name: Run the ten tasks, one engine at a time, one budget
        id: evals
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          login() {
            local jar csrf
            jar="$(mktemp)"
            csrf="$(curl -fsS -c "$jar" http://localhost:3008/api/auth/csrf | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d).csrfToken))')"
            curl -fsS -c "$jar" -b "$jar" -X POST http://localhost:3008/api/auth/callback/credentials \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "csrfToken=$csrf" --data-urlencode "email=$1" \
              --data-urlencode "password=password123" --data-urlencode "callbackUrl=http://localhost:3008/" \
              --data-urlencode "json=true" -o /dev/null
            awk '$6=="next-auth.session-token"{print $7}' "$jar"
            rm -f "$jar"
          }
          spent_usd() {
            read -r tin tout < <(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tA -F ' ' \
              -c 'SELECT COALESCE(SUM("tokensIn"),0), COALESCE(SUM("tokensOut"),0) FROM "AiDecisionLog"')
            node -e 'const b=require("./evals/inspect/budget.json");const [i,o]=process.argv.slice(1).map(Number);console.log((i/1e6)*b.usdPerMillionInputTokens+(o/1e6)*b.usdPerMillionOutputTokens)' "$tin" "$tout"
          }
          cookie_env=()
          for slug in inspect-ext-flue inspect-ext-tool-runner inspect-local-flue inspect-local-tool-runner; do
            email="$(node -p "require('./inspect-out/seed-manifest.json')['${slug}'].ownerEmail")"
            session="$(login "$email")"
            if [ -z "$session" ]; then echo "::error::login failed for ${slug}"; exit 1; fi
            echo "::add-mask::$session"
            var="$(echo "$slug" | tr 'a-z-' 'A-Z_')"
            cookie_env+=(-e "INSPECT_SESSION_${var}=next-auth.session-token=${session}")
            agent_key="$(node -e 'const k=require(process.argv[1])[process.argv[2]];process.stdout.write(typeof k==="string"?k:"")' "$RUNNER_TEMP/inspect-agent-keys.json" "$slug")"
            case "$agent_key" in iflk_*) ;; *) echo "::error::no agent-bound API key for ${slug}"; exit 1 ;; esac
            echo "::add-mask::$agent_key"
            cookie_env+=(-e "INSPECT_AGENT_KEY_${var}=${agent_key}")
          done
          for engine in flue tool-runner; do
            spent="$(spent_usd)"
            if ! node -e 'const b=require("./evals/inspect/budget.json");const p=b.plannedEnginePass;const plan=(p.inputTokens/1e6)*b.usdPerMillionInputTokens+(p.outputTokens/1e6)*b.usdPerMillionOutputTokens;process.exit(Number(process.argv[1])+plan<=b.nightlyCapUsd?0:1)' "$spent"; then
              echo "::warning::agent-evals: spent \$${spent} of the night's cap; ${engine} cannot fit and is skipped."
              continue
            fi
            mkdir -p "inspect-out/${engine}"; chmod 777 "inspect-out/${engine}" inspect-out
            if ! timeout 70m docker run --rm --network host \
              -e INSPECT_PRODUCT_URL=http://127.0.0.1:3008 -e INSPECT_SEED_MANIFEST=/out/seed-manifest.json \
              "${cookie_env[@]}" -v "$PWD/inspect-out:/out" inflect-inspect:ci \
              eval inflect_inspect/tasks.py@governed_runs -T "engine=${engine}" \
              --model mockllm/model --max-samples 1 --epochs "$(node -p 'require("./evals/inspect/budget.json").epochs')" \
              --log-format json --log-dir "/out/${engine}"; then
              echo "::error::the Inspect pass for ${engine} did not complete"; status=1; continue
            fi
            log="$(ls -t inspect-out/${engine}/*.json | head -n 1)"
            docker run --rm --network none -v "$PWD/inspect-out:/out" --entrypoint python inflect-inspect:ci \
              -m inflect_inspect.write_record --log "/out/${engine}/$(basename "$log")" --engine "$engine" \
              --model-provider anthropic --model-revision "$(node -p 'require("./evals/inspect/budget.json").model')" \
              --app-image-digest "git:${GITHUB_SHA}" --harness-image-digest "$(cat inspect-out/harness-image-id)" \
              --seed-fixture-hash "$(node -p "require('./inspect-out/seed-manifest.json').seedFixtureHash")" \
              --out "/out/record-${engine}.json" || { status=1; continue; }
            npx tsx scripts/inspect-record-check.ts "inspect-out/record-${engine}.json" --md "inspect-out/summary-${engine}.md" > /dev/null || status=1
            cat "inspect-out/summary-${engine}.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          done
          echo "Measured recorded spend: \$$(spent_usd) against a cap of \$$(node -p 'require("./evals/inspect/budget.json").nightlyCapUsd')" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload records + Inspect logs
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-evals-nightly
          path: |
            inspect-out/record-*.json
            inspect-out/summary-*.md
            inspect-out/*/*.json
          if-no-files-found: warn
          retention-days: 14
