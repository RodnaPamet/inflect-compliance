# ───────────────────────────────────────────────────────────────
#  Bundle Analyze — client/server JS payload report
#
#  Generates @next/bundle-analyzer HTML reports as a build artefact so
#  the JS payload of the heavy client pages (Controls/Evidence/Risks/…)
#  is measurable. Part of the perf measurement foundation — this job
#  does NOT gate on size deltas (that's a later phase); it only produces
#  the report.
#
#  Runs on: push to main, and PRs labelled `perf-watch` (opt-in, so we
#  don't pay a full analyze build on every PR).
# ───────────────────────────────────────────────────────────────
name: Bundle Analyze

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Merge queue — present so this workflow can ANSWER a `merge_group`
  # event if "Analyze client/server bundles" is ever selected as a
  # required status check. A workflow that never triggers reports nothing
  # and the required check hangs forever; a job that skips reports
  # `skipped`, which branch protection counts as a pass. The job below
  # skips in the queue (see its `if:`). Locked by
  # tests/guardrails/merge-queue-trigger-coverage.test.ts.
  merge_group:

permissions:
  contents: read

concurrency:
  group: bundle-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "Analyze client/server bundles"
    # Push to main always; PRs only when labelled perf-watch.
    #
    # Merge-queue lean set: SKIP. `github.event.pull_request` is undefined
    # under `merge_group`, so the label test could never be true anyway —
    # spelling the event out keeps the intent explicit rather than relying
    # on null-propagation. Bundle size is a trend signal measured on the
    # opted-in PR and on every push to `main`; it is not a merge-collision
    # class, and the analyze build is a 30-min 8 GB-heap job.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'perf-watch'))
    # Match the main CI Build job's runner — the analyzer build is heavier than
    # a plain `next build` and OOMs on a small runner's heap.
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma
        uses: ./.github/actions/setup-node-prisma

      - name: Build with bundle analyzer
        env:
          # Analysis build — real env vars are provided at runtime, not
          # needed to measure bundle size.
          SKIP_ENV_VALIDATION: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          # 10240 PER PROCESS. This number is MEASURED, and the two values
          # before it were wrong in OPPOSITE directions.
          #
          # What the compile worker actually did, from its own V8 traces:
          #   ceiling 8192 -> heap 7942 / 8257 MB -> FATAL (run 32697139148)
          #   ceiling 6144 -> heap 5796 / 6236 MB -> FATAL (run 32759606612)
          # It grows to fill whatever ceiling it is given and then dies, so
          # demand genuinely exceeds 8 GB and LOWERING the ceiling only killed
          # it sooner. ci.yml's plain `next build` passes at 6144/process on
          # this same runner, so the delta is the analyzer's retained stats
          # object: the treemap needs the whole module graph live at once.
          # This job therefore CANNOT inherit ci.yml's number — that job is
          # doing strictly less work. (An earlier comment here said exactly
          # that, citing "~6.5 GB it actually needs", and was overwritten on
          # the theory below. It was right.)
          #
          # The reasoning this replaces summed the two ceilings ("8192 x 2 =
          # 16 GB on a 16 GB runner") and concluded the fix was to reduce
          # them. `--max-old-space-size` is a PERMISSION, not a reservation —
          # a process consumes what it needs, not its ceiling — so adding two
          # ceilings and comparing the total to RAM is a category error.
          #
          # The doubling is still real for PEAK usage (ci.yml sampled 15783 MB
          # used / 206 MB available), which is why this is 10240 and not
          # 12288+: the parent's headroom has to survive alongside it.
          #
          # If this dies by SIGKILL / exit 137 rather than a V8 "Ineffective
          # mark-compacts", then the 16 GB runner is the binding constraint
          # rather than the ceiling, and the lever is `vars.LARGE_RUNNER`
          # (already read on line 53) — currently UNSET, repo variables hold
          # only CODE_SCANNING_ENABLED. Provisioning it is a cost decision
          # for the repo owner, not a config tweak.
          NODE_OPTIONS: '--max-old-space-size=10240'
          # `npm run analyze` → `npm run build`, which runs
          # `scripts/validate-env.ts` before `next build`. That script hard-
          # checks `DATABASE_URL` (it predates SKIP_ENV_VALIDATION and does not
          # honour it), so a dummy value is required or the analyze build fails
          # before it starts — mirrors the dummy DSNs the CI test/build jobs use.
          DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
          DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
        run: npm run analyze

      - name: Enforce per-route First Load JS budgets
        # The build above produced .next/app-build-manifest.json, so the
        # budget gate is live here (it skips in the no-build jest job).
        run: npx jest tests/guardrails/bundle-size-budget.test.ts --no-coverage

      # Only needed to inspect what grew when a budget FAILS — the
      # per-route budget gate above already runs inline, so the HTML is
      # never read on a green run. Gate on failure to stop storage creep.
      - name: Upload bundle report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bundle-analysis
          path: .next/analyze/*.html
          if-no-files-found: warn
          retention-days: 7
