# ───────────────────────────────────────────────────────────────
#  Bundle Analyze — client/server JS payload report
#
#  Generates @next/bundle-analyzer HTML reports as a build artefact so
#  the JS payload of the heavy client pages (Controls/Evidence/Risks/…)
#  is measurable. Part of the perf measurement foundation — this job
#  does NOT gate on size deltas (that's a later phase); it only produces
#  the report.
#
#  Runs ON DEMAND ONLY: `workflow_dispatch`, or a PR labelled
#  `perf-watch`. It deliberately does NOT run on push to main.
#
#  WHY IT STOPPED RUNNING ON MAIN (2026-08-27). It had failed EVERY push
#  since 2026-08-24 — eleven consecutive runs — with the analyze build
#  OOMing before the budget gate was reached. Three fixes were tried and
#  measured; all three are wrong:
#
#    • raise `--max-old-space-size` — the ceiling is PER PROCESS and
#      `webpackBuildWorker` splits the compile in two, so 8192 already
#      meant 16 GB nominal on a 16 GB runner;
#    • lower it to 6144 to match ci.yml — measured on a labelled PR, still
#      FATAL, just sooner (`Mark-Compact 5823.9 (6237.0)`). This is the
#      loud single-heap-needs-more form, not ci.yml's over-subscription
#      form, so ci.yml's answer does not transfer;
#    • set `vars.LARGE_RUNNER` — ci.yml already records that it CANNOT be
#      set: larger runners need Team/Enterprise and this org is on Free.
#
#  So the analyze build wants more memory in ONE process than any runner
#  available here can give, and no setting reconciles that.
#
#  Why removing the trigger is the answer rather than a retreat: this job
#  enforces NOTHING unique. The per-route First Load JS budget it runs is
#  ALSO run by ci.yml's `Build` step on every PR, so coverage never
#  depended on it. Its only unique product is the analyzer HTML, uploaded
#  `if: failure()` and — in the words of the step below — "never read on a
#  green run". Eleven red runs bought an artefact nobody wanted, from a job
#  that gates nothing, in the one place nobody looks.
#
#  To get a report: run the workflow manually, or label a PR `perf-watch`.
# ───────────────────────────────────────────────────────────────
name: Bundle Analyze

on:
  # On demand. See the header for why `push: main` was removed rather than
  # the OOM being "fixed" with a number.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Merge queue — present so this workflow can ANSWER a `merge_group`
  # event if "Analyze client/server bundles" is ever selected as a
  # required status check. A workflow that never triggers reports nothing
  # and the required check hangs forever; a job that skips reports
  # `skipped`, which branch protection counts as a pass. The job below
  # skips in the queue (see its `if:`). Locked by
  # tests/guardrails/merge-queue-trigger-coverage.test.ts.
  merge_group:

permissions:
  contents: read

concurrency:
  group: bundle-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "Analyze client/server bundles"
    # Manual dispatch, or a PR labelled perf-watch. No push arm — see header.
    #
    # Merge-queue lean set: SKIP. `github.event.pull_request` is undefined
    # under `merge_group`, so the label test could never be true anyway —
    # spelling the event out keeps the intent explicit rather than relying
    # on null-propagation. Bundle size is a trend signal measured on
    # the opted-in PR; the per-route BUDGET is enforced by ci.yml `Build`
    # on every PR regardless. It is not a merge-collision class, and the
    # analyze build is a 30-min heap-bound job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'perf-watch'))
    # Match the main CI Build job's runner — the analyzer build is heavier than
    # a plain `next build` and OOMs on a small runner's heap.
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma
        uses: ./.github/actions/setup-node-prisma

      - name: Build with bundle analyzer
        env:
          # Analysis build — real env vars are provided at runtime, not
          # needed to measure bundle size.
          SKIP_ENV_VALIDATION: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          # The bundle-analyzer plugin holds the full module graph + stats in
          # memory ON TOP of the Next build, so it needs more heap than the
          # plain Build job (which runs fine at 6144). As the app grew, the
          # analyzer started hitting the V8 heap ceiling at ~6083 MB (exit 134,
          # "Reached heap limit"), so it OOM'd every main run. Raise the ceiling
          # to 8192 (the repo's standard heavy-build bump, matching the
          # heap-bumped tsc) — V8 grows lazily, so this only lets the analyzer
          # climb past the 6144 wall to the ~6.5 GB it actually needs; it fits a
          # 16 GB large runner comfortably and the standard runner's RAM too.
          NODE_OPTIONS: '--max-old-space-size=8192'
          # `npm run analyze` → `npm run build`, which runs
          # `scripts/validate-env.ts` before `next build`. That script hard-
          # checks `DATABASE_URL` (it predates SKIP_ENV_VALIDATION and does not
          # honour it), so a dummy value is required or the analyze build fails
          # before it starts — mirrors the dummy DSNs the CI test/build jobs use.
          DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
          DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
        run: npm run analyze

      - name: Enforce per-route First Load JS budgets
        # The build above produced the client reference manifests the budget
        # gate measures, so it is live here.
        #
        # It was NOT live here before 2026-08-25, despite this job building:
        # the suite read `.next/app-build-manifest.json`, which Next removed
        # in v16, so it silently skipped and reported green on every run.
        #
        # BUNDLE_BUDGET_REQUIRE_MANIFEST is the caller's promise that a
        # production build ran in this job. With it set, an ABSENT manifest
        # fails instead of skipping — otherwise an analyze build that stops
        # emitting one turns this step into a silent no-op that still
        # reports green. Same contract as the ci.yml `Build` step; see the
        # table at the top of the suite.
        #
        # NOTE this is no longer the only place the budget is measured:
        # ci.yml `Build` runs it on every PR. This invocation stays because
        # it is the one paired with the analyzer HTML uploaded below, which
        # is what you read when a budget actually fails.
        env:
          BUNDLE_BUDGET_REQUIRE_MANIFEST: '1'
        run: npx jest tests/guardrails/bundle-size-budget.test.ts --no-coverage

      # Only needed to inspect what grew when a budget FAILS — the
      # per-route budget gate above already runs inline, so the HTML is
      # never read on a green run. Gate on failure to stop storage creep.
      - name: Upload bundle report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bundle-analysis
          path: .next/analyze/*.html
          if-no-files-found: warn
          retention-days: 7
