#
# GHCR publish — build, SCAN, then push for Watchtower auto-deploy.
#
# Runs on every push to `main` (in parallel with CI). Pushes an
# image tagged `:latest` and `:sha-<short>` to GHCR. The VM's
# Watchtower container polls :latest and rolls the running app.
#
# This is the ONLY deploy path. A heavier `deploy.yml` pipeline
# (EKS, staging/production GitHub Environments, helm) was written and
# never worked — it was `workflow_dispatch`-only with its auto-trigger
# commented out pending an EKS environment that was never provisioned,
# and it was removed along with the rest of the unapplied AWS estate.
#
# ── WHY THIS WORKFLOW SCANS, AND WHY THE SCAN COMES FIRST ──
#
# Until 2026-09-13 this file contained no vulnerability scan at all.
# Trivy lived only in `ci.yml`, in a `trivy` job that `needs: [docker]`
# — and the two facts below made that an open window rather than a
# theoretical one:
#
#   1. Production is UNPINNED on `:latest` with Watchtower live, and
#      Watchtower polls every 60 SECONDS. Measured on the VM: the
#      watchtower container logs `Session done` once a minute, and for
#      the 2026-09-12 22:15:45 publish it logged `Found new
#      ghcr.io/rodnapamet/inflect-compliance:latest image` at 22:37:18
#      and `Stopping /inflect-app-1` at 22:37:20. So the exposure
#      window between a vulnerable image landing on `:latest` and
#      production running it is about ONE MINUTE. (The ~21 minutes
#      between the push to `main` and that roll is build time, not a
#      window anyone can act in — an operator who plans around "we have
#      ~20 minutes to catch it" has no time at all.)
#   2. A CI verdict is not guaranteed to arrive at all. On the sha that
#      actually published (75496ea46, CI run 34722259790) the upstream
#      `build` job FAILED at 23:01:48, so `docker` — declared
#      `needs: [build, changes]` — completed `skipped`, and `trivy`
#      skipped behind it at 23:01:49. A skipped dependent is not a
#      failure, so the run never went red on the scan's absence.
#      Watchtower had already rolled production onto that image at
#      22:37, 24 minutes BEFORE CI reached the point of not scanning
#      it. The trigger was NOT specifically a killed Docker Build: ANY
#      failure or skip anywhere upstream of `docker` deletes the
#      verdict, and none of them turn the publish red, because the
#      publish is a different workflow that never consults it.
#
# `ci.yml`'s Docker Build is additionally path-filtered on PULL
# REQUESTS. The `container` filter has THIRTEEN entries — Dockerfile,
# Dockerfile.*, .dockerignore, package.json, package-lock.json,
# next.config.*, deploy/**, prisma/**, prisma.config.ts,
# scripts/entrypoint.sh, patches/**, .trivyignore and
# .github/workflows/ci.yml — and deliberately NOT `src/**`, so PR-time
# scanning does not cover an ordinary source change either. The path
# that publishes `:latest` had to become the path that scans it.
#
# ORDERING CHOSEN: BUILD → SCAN → PUSH, in one job, on one runner.
#
# A scan placed AFTER the push would gate nothing. The image would
# already be on `:latest` and Watchtower could already have pulled it;
# the scan's only remaining power would be to turn a workflow red
# after the vulnerable image was serving traffic. So the build here
# does NOT push. It loads the image into this runner's local daemon,
# Trivy scans that local image, and only a passing scan reaches the
# `docker push` step below. A finding means nothing was published at
# all — the previous `:latest` stays in place, which is the correct
# failure direction for an auto-deploying tag.
#
# The alternative considered was pushing by digest first and tagging
# `:latest` only on a passing scan. Rejected: it still puts unscanned
# bytes in the registry, and it needs a second tagging mechanism
# (`buildx imagetools create`) whose failure mode is a dangling digest
# nobody reads. Loading locally costs one extra image export and keeps
# the invariant absolute — GHCR receives nothing until Trivy passes.
#
# ── WHY `:latest` NOW WAITS FOR A HUMAN, AND `:sha-<short>` DOES NOT ──
#
# A passing scan says "no known CRITICAL/HIGH CVE". It does not say the
# change is one anybody meant to ship. Measured on the VM: Watchtower
# polls `:latest` every 60 SECONDS, so until 2026-09-17 a merge to
# `main` reached production about a minute after the image published,
# with no human anywhere in the path — on a product whose 05:00 leaver
# pass DISABLES REAL ACCOUNTS in customers' Entra/AD directories. The
# blast radius of an unintended merge is other companies' employees
# losing their logins.
#
# So the two tags are now published by two different jobs:
#
#   · `build-push`   — every push to `main`, NO approval. Builds, scans,
#     and publishes the IMMUTABLE `:sha-<short>` tag. Nothing about this
#     changed except that it no longer touches `:latest`. Every commit
#     is therefore still built, still scanned, and still present in GHCR
#     as a rollback target; `main` is never unable to publish.
#   · `promote-latest` — `needs: build-push`, declares
#     `environment: production-rollout`, and moves the ROLLING tag that
#     Watchtower follows. GitHub holds this job until a required
#     reviewer approves it.
#
# WHAT A YAML FILE CANNOT DO, STATED PLAINLY. The `environment:` line
# below is the whole mechanism and on its own it is worthless: GitHub
# CREATES an environment the first time a workflow names one that does
# not exist, with ZERO protection rules, and a job whose environment
# protects nothing does not wait for anybody. The approval lives in a
# REPOSITORY SETTING (Settings → Environments → Required reviewers)
# that no file in this repository can create. `docs/deploy-approval-gate.md`
# writes the setting down, and the FIRST step of `promote-latest` reads
# the environment back through the API and FAILS if the reviewer rule is
# not there — because a change that looks like a gate and silently is
# not one is worse than no change, which is what #2246 is about.
#
# Ordering inside `promote-latest` preserves the property above rather
# than trading it away. The tag is moved with `buildx imagetools create`
# from the IMMUTABLE DIGEST `build-push` published, and a SECOND
# blocking Trivy gate scans that exact digest first. Two consequences,
# both wanted: the bytes `:latest` ends up pointing at are provably the
# bytes that were approved (a digest is content-addressed; a tag is
# not), and an approval that sits for a day is re-scanned against a
# Trivy database that has moved on, so a CVE disclosed during the wait
# blocks the rollout.
#
# Concurrency is deliberate too: the workflow-level group keeps
# `cancel-in-progress: true`, so a newer push to `main` cancels a
# `promote-latest` still waiting for approval. You always approve the
# newest image rather than working through a queue of stale ones. The
# cost is that if merges outrun approvals, `:latest` does not move —
# which is the correct direction, because nobody approved anything.
#
# Three guardrails pin this, and they pin different things.
# `tests/guardrails/security-gate-strictness.test.ts` reads this file
# and ci.yml AS TEXT and pins the severity set and the blocking exit
# code in both. Everything STRUCTURAL about the scan — the
# build-scan-push order, the gate being unconditional, and the gate
# scanning the image about to ship — is pinned by
# `tests/guardrails/publish-scans-before-push.test.ts`, which parses the
# YAML GitHub executes. The APPROVAL property — that `:latest` is
# unreachable from the ungated job, that the job which moves it declares
# an environment, that the preflight runs before the move and fails
# closed, and that the scanned digest is the promoted digest — is pinned
# by `tests/guardrails/latest-tag-requires-approval.test.ts`.
#
name: Publish image to GHCR

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ghcr-publish-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    # The GitHub Environment whose "Required reviewers" rule is the human
    # decision between a merge and production running it. Named for what it
    # gates — the rollout of the rolling tag — not for a deploy pipeline,
    # because nothing here deploys: moving `:latest` is what makes Watchtower
    # deploy, within its 60-second poll.
    #
    # This name is referenced THREE times below (the job's `environment:`, the
    # preflight's API path, and the preflight's message) and they must be the
    # same string: a preflight that reads a DIFFERENT environment than the one
    # gating the job reports a gate that is not in the path. That identity is
    # asserted by tests/guardrails/latest-tag-requires-approval.test.ts.
    APPROVAL_ENVIRONMENT: production-rollout
    # The local, registry-less tag the image is loaded under and Trivy
    # scans. Mirrors ci.yml's `inflect-compliance:ci-<sha>` convention.
    # Deliberately NOT a `ghcr.io/...` name: a registry-shaped ref lets
    # a typo silently scan the PREVIOUSLY PUBLISHED image pulled from
    # GHCR instead of the one just built, which would be a scan that
    # passes while saying nothing about what is about to ship.
    SCAN_REF: inflect-compliance:publish-${{ github.sha }}

jobs:
    build-push:
        # Match the CI "Docker Build" job's robustness — the image build
        # (npm ci + next build + worker bundle + layers) outgrew a plain
        # ubuntu-latest with a 20-minute budget once the app grew.
        runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
        # 40 → 70. This job now does what ci.yml splits across two jobs
        # with budgets of 40 (Docker Build) and 25 (Trivy Image Scan).
        # Leaving it at 40 would recreate the exact 2026-09-12 failure in
        # a new place: the job is cancelled at the ceiling, a cancelled
        # run is not a failed one, and nobody is told. 70 = 40 + 25 + 5
        # for the local image load and the push.
        timeout-minutes: 70

        # Consumed by `promote-latest`. The image NAME comes from here rather
        # than from `ghcr.io/${{ github.repository }}` in the second job
        # because `github.repository` carries the owner's capitalisation
        # (`RodnaPamet/…`) and GHCR requires lowercase — metadata-action
        # already normalised it, so the normalised value is passed on instead
        # of being re-derived by a second, differently-spelled expression.
        #
        # The DIGEST is the load-bearing one. It is read back from the
        # registry after the push, so `promote-latest` scans and promotes a
        # content-addressed reference rather than re-resolving a tag that
        # something else could have moved in between.
        outputs:
            image: ${{ steps.push.outputs.image }}
            digest: ${{ steps.push.outputs.digest }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Reclaim ~25-30 GB of preinstalled toolchains so the container
            # build has disk headroom (mirrors the CI Docker Build job).
            - name: Free runner disk space (issue #1005)
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  sudo docker image prune --all --force 2>/dev/null || true
                  df -h /

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image tags
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # `:sha-<short>` ONLY. The rolling `:latest` tag is NOT
                  # produced here and must not be: this job runs with no human
                  # in the path, and `:latest` is the tag Watchtower polls
                  # every 60 seconds. It is minted in `promote-latest`, after
                  # an approval, from the digest this job publishes.
                  #
                  # Re-adding `type=raw,value=latest` here — or dropping
                  # `latest=false` from `flavor`, which is the other way
                  # metadata-action emits that tag — restores the ungated
                  # auto-deploy in a one-line diff, so both are asserted by
                  # tests/guardrails/latest-tag-requires-approval.test.ts and
                  # the push step below refuses a `:latest` it is handed.
                  tags: |
                      type=sha,prefix=sha-,format=short
                  # Lowercase is required by GHCR — metadata-action handles it
                  # via the default `image` normalisation.
                  flavor: |
                      latest=false

            # The GHA buildx cache backend (type=gha) intermittently 404s on
            # IMPORT — Azure GC's a layer blob the manifest still references,
            # so buildkit aborts with "BlobNotFound" even though the image is
            # fine. Same two-layer hardening as the CI Docker Build job:
            #   - `cache-to: …,ignore-error=true` — a failed EXPORT never fails.
            #   - `continue-on-error` here + the cacheless retry below — if the
            #     cache IMPORT 404s, rebuild without cache-from. A genuine
            #     build error still fails (the retry fails too).
            #
            # `push: false` + `load: true` is the load-bearing half of this
            # workflow's ordering. The image goes into this runner's docker
            # daemon and NOWHERE ELSE; the registry does not see it until the
            # push step at the bottom of this job, which is downstream of the
            # Trivy gate. It carries the final GHCR tags (so the pushed bytes
            # are provably the scanned bytes) plus SCAN_REF.
            - name: Build image (load locally, NO push)
              id: build
              uses: docker/build-push-action@v7
              continue-on-error: true
              with:
                  context: .
                  push: false
                  load: true
                  tags: |
                      ${{ steps.meta.outputs.tags }}
                      ${{ env.SCAN_REF }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
                  platforms: linux/amd64

            # Cacheless retry — only when the cached build above failed (cache
            # 404 or any other error). No cache-from, so a stale cache
            # reference can't abort it; if THIS fails too it's a real build
            # error and the job fails as it should. Still no push.
            - name: Build image (cacheless retry on cache flake, NO push)
              if: steps.build.outcome == 'failure'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: false
                  load: true
                  tags: |
                      ${{ steps.meta.outputs.tags }}
                      ${{ env.SCAN_REF }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-to: type=gha,mode=max,ignore-error=true
                  platforms: linux/amd64

            # Trivy extracts the image's layers to /tmp, and unlike ci.yml's
            # `trivy` job this one does not get a fresh runner — the build
            # above has already spent disk. The local buildkit store is dead
            # weight by now (the GHA cache export happened during the build),
            # and `docker image prune` without `--all` removes only dangling
            # images, so the tagged image Trivy is about to read survives.
            - name: Reclaim disk before the scan
              run: |
                  df -h /
                  docker buildx prune --all --force 2>/dev/null || true
                  docker image prune --force 2>/dev/null || true
                  docker image ls inflect-compliance
                  df -h /

            # ── Trivy scan: BLOCKING on CRITICAL,HIGH ──
            # Same action, same version, same severities, same exemption file
            # as ci.yml's "Gate: Trivy vulnerability scan (critical+high)".
            # The two gates are deliberately identical: a divergence between
            # them would mean the publish path enforced something weaker than
            # the path everyone reads, which is the failure GAP-05 closed.
            # `tests/guardrails/security-gate-strictness.test.ts` reads BOTH
            # files and fails CI if the SEVERITY SET or `exit-code` weakens in
            # either. That is all it can see — it matches text, so an `if:`, a
            # `continue-on-error:` or a re-pointed `image-ref` leave every one
            # of its assertions satisfied while the gate stops gating. (An
            # earlier version of this comment claimed it "fails CI if either
            # weakens", full stop. That was false: all three of those
            # weakenings were applied to this file and measured 20/20 green.)
            # Those three are pinned by
            # `tests/guardrails/publish-scans-before-push.test.ts`, which
            # parses this YAML and requires the gate to be unconditional, to
            # scan `${{ env.SCAN_REF }}`, and to sit at a lower step index
            # than every step that can reach a registry.
            #
            # `.trivyignore` carries narrow per-CVE exemptions with written
            # reasons + upgrade plans, and those exemptions are SHARED with
            # ci.yml by construction — one file, both gates. That is the
            # intent (an exemption reviewed once applies everywhere the image
            # is scanned), but it is also the hazard: an entry added to
            # unblock CI silences this publish gate in the same commit, with
            # no second review. Note the shape of the exemption too — an id
            # on its own line suppresses that CVE at EVERY severity, exactly
            # as an IGNORE row in `.zap/rules.tsv` suppresses every alert its
            # pluginId emits. Add entries per-CVE, with the reachability
            # argument and the retirement trigger written down.
            - name: "Gate: Trivy vulnerability scan (critical+high)"
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.SCAN_REF }}
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  trivyignores: ".trivyignore"
                  # ci.yml's SARIF step hit trivy's own 5m default on
                  # 2026-08-20 and took main red with `context deadline
                  # exceeded` — a timeout on a security gate fails in the
                  # worst direction, because a re-run that passes proves only
                  # that the runner was faster. Raise the patience here too,
                  # never the threshold.
                  timeout: "15m"

            # Reached ONLY when the gate above exited 0. A failing scan fails
            # the job at the previous step and this never runs, so a
            # vulnerable image is never published under any tag — `:latest`
            # keeps pointing at the last image that passed.
            #
            # No SARIF upload here on purpose: this workflow's job is to GATE,
            # and ci.yml already owns the Security-tab reporting for the same
            # sha (its `trivy-container-scan` category). Duplicating it would
            # need `security-events: write` on a workflow that holds a
            # registry-write token, and would re-fetch the vulnerability DB a
            # second time for no new verdict.
            - name: Push scanned image to GHCR under its immutable tag
              id: push
              run: |
                  set -euo pipefail
                  mapfile -t TAGS < <(printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed '/^[[:space:]]*$/d')
                  if [ "${#TAGS[@]}" -eq 0 ]; then
                      echo "::error::metadata-action resolved no tags — refusing to publish"
                      exit 1
                  fi
                  printf 'publishing the scanned image %s as:\n' "${SCAN_REF}"
                  printf '  %s\n' "${TAGS[@]}"
                  # THE ROLLING TAG IS NOT THIS JOB'S TO MOVE. Nothing above
                  # asked for it, so reaching this branch means the tag list
                  # regrew a `:latest` — a `type=raw,value=latest` back in
                  # metadata-action, or `flavor: latest=false` dropped. Failing
                  # is the point: the alternative is silently restoring the
                  # ungated 60-second path to production while every scan
                  # assertion in the repo stays green.
                  for tag in "${TAGS[@]}"; do
                      case "$tag" in
                          *:latest)
                              echo "::error::${tag} — the rolling tag is moved by the promote-latest job, after approval. Refusing to publish it from an unapproved job."
                              exit 1
                              ;;
                      esac
                  done
                  for tag in "${TAGS[@]}"; do
                      docker tag "${SCAN_REF}" "$tag"
                      docker push "$tag"
                  done
                  # Read the manifest digest back FROM THE REGISTRY, with
                  # `imagetools inspect` rather than `docker image inspect
                  # --format '{{ index .RepoDigests 0 }}'`. Both usually agree,
                  # but RepoDigests is local daemon bookkeeping that a push can
                  # leave empty, and the question here is what GHCR STORED —
                  # the promote job scans and moves `:latest` onto this digest,
                  # so it has to be the registry's answer, not the daemon's
                  # recollection of it.
                  DIGEST="$(docker buildx imagetools inspect "${TAGS[0]}" --format '{{ .Manifest.Digest }}')"
                  case "$DIGEST" in
                      sha256:*) ;;
                      *)
                          echo "::error::could not read a manifest digest for ${TAGS[0]} (got '${DIGEST}')"
                          exit 1
                          ;;
                  esac
                  printf 'image=%s\n' "${TAGS[0]%:*}" >> "$GITHUB_OUTPUT"
                  printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
                  printf 'published %s@%s\n' "${TAGS[0]%:*}" "$DIGEST"

    # ── THE HUMAN DECISION ──
    #
    # Everything above runs with nobody in the path, and that is fine: it
    # produces an immutable `:sha-<short>` tag nothing follows. THIS job moves
    # the tag Watchtower polls every 60 seconds, and GitHub holds it until a
    # required reviewer of the `production-rollout` environment approves.
    #
    # The `environment:` value is a LITERAL, not `${{ env.APPROVAL_ENVIRONMENT }}`
    # — the `env` context is not available in `jobs.<id>.environment`. The two
    # spellings are asserted identical by
    # tests/guardrails/latest-tag-requires-approval.test.ts, because a
    # preflight that reads a different environment than the one gating the job
    # would confirm a gate that is not in the path.
    promote-latest:
        needs: [build-push]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production-rollout
        permissions:
            contents: read
            packages: write
            # Read-only, and specifically for the preflight: GITHUB_TOKEN is a
            # GitHub App token, and `GET /repos/{owner}/{repo}/environments/{name}`
            # requires `actions: read` for one. Without it the preflight cannot
            # tell "no reviewer required" from "could not look", and it treats
            # both as a refusal.
            actions: read

        env:
            IMAGE: ${{ needs.build-push.outputs.image }}
            DIGEST: ${{ needs.build-push.outputs.digest }}

        steps:
            # Needed for `.trivyignore` — the re-scan below shares the same
            # exemption file as the two gates in ci.yml and build-push, so an
            # exemption reviewed once applies everywhere the image is scanned.
            - name: Checkout
              uses: actions/checkout@v7

            # FIRST, before anything that could move a tag. If the approval
            # rule this job's `environment:` is supposed to rest on does not
            # exist, this job did not wait for anybody, and the rolling tag
            # must not move. See scripts/assert-approval-gate.mjs for why all
            # three outcomes except "reviewer required" exit 1.
            - name: "Preflight: the approval gate must actually exist"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # The digest is the whole contract with the job above. An
                  # empty one would make every reference below a malformed ref
                  # — which fails, but fails somewhere unhelpful. Say it here.
                  case "${DIGEST}" in
                      sha256:*) ;;
                      *)
                          echo "::error::build-push handed no manifest digest (got '${DIGEST}') — refusing to touch the rolling tag"
                          exit 1
                          ;;
                  esac
                  ENV_JSON="${RUNNER_TEMP}/environment.json"
                  rm -f "$ENV_JSON"
                  if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${APPROVAL_ENVIRONMENT}" > "$ENV_JSON"; then
                      echo "::error::the API call for environment '${APPROVAL_ENVIRONMENT}' failed — see the output above."
                      # A failed call still left a truncated (or empty) file
                      # behind. Delete it so the script reports UNKNOWN rather
                      # than parsing a body nobody wrote.
                      rm -f "$ENV_JSON"
                  fi
                  node scripts/assert-approval-gate.mjs "$ENV_JSON" "${APPROVAL_ENVIRONMENT}"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ── Trivy re-scan: BLOCKING on CRITICAL,HIGH, same severities and
            # same `.trivyignore` as the gate in `build-push` ──
            #
            # Not redundant. Two things can have changed between that scan and
            # this one, and both matter more here than they did there:
            #
            #   1. TIME. An approval may sit for hours or days. Trivy's
            #      vulnerability database moves; a CVE disclosed during the
            #      wait is invisible to the earlier scan and blocks here.
            #   2. THE DIRECTION OF THE FAILURE. This is the last thing that
            #      runs before the tag production follows starts pointing
            #      somewhere new.
            #
            # `image-ref` is a DIGEST, not a tag: `${IMAGE}@${DIGEST}` is
            # content-addressed, so the bytes scanned here are provably the
            # bytes promoted below, and neither a concurrent push nor a
            # re-pointed tag can slip different ones in between. That is the
            # same invariant `SCAN_REF` buys in `build-push` by being
            # registry-less, obtained the other way round.
            - name: "Gate: Trivy re-scan of the digest being promoted (critical+high)"
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}@${{ env.DIGEST }}
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  trivyignores: ".trivyignore"
                  timeout: "15m"

            # Reached ONLY when a reviewer approved AND the re-scan exited 0.
            #
            # `imagetools create` copies the MANIFEST, so `:latest` ends up
            # pointing at the identical digest — no re-upload, no
            # recompression, and no possibility of the rolling tag naming
            # bytes that differ from the approved ones. A pull/tag/push round
            # trip would move the same layers but is not guaranteed to
            # reproduce the same manifest digest, which is exactly the
            # equivalence this job exists to preserve.
            - name: Move the rolling :latest tag onto the approved digest
              run: |
                  set -euo pipefail
                  printf 'promoting %s@%s to :latest\n' "$IMAGE" "$DIGEST"
                  docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
                  # Post-condition, not decoration: read the rolling tag back
                  # and require it to resolve to the digest that was approved.
                  # A silent no-op here would leave production on the previous
                  # image while this job reported success.
                  LANDED="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{ .Manifest.Digest }}')"
                  if [ "$LANDED" != "$DIGEST" ]; then
                      echo "::error::${IMAGE}:latest resolves to ${LANDED}, not the approved ${DIGEST}"
                      exit 1
                  fi
                  printf '%s:latest -> %s\n' "$IMAGE" "$LANDED"
                  printf 'Watchtower polls every 60s; production rolls within about a minute.\n'
