# ── Quarterly secret rotation ──────────────────────────────────────────────
#
# Opens a rotation issue every three months with the runbook inline, so the
# work is a checklist somebody can execute rather than a reminder somebody
# has to interpret.
#
# WHY A WORKFLOW AND NOT A CALENDAR ENTRY. A calendar entry leaves when its
# owner does. This lives in version control, runs whether or not anyone is
# watching, and its history shows whether the last rotation actually happened
# — a closed issue is evidence, a dismissed notification is not.
#
# WHY QUARTERLY. Long enough that the work does not become noise people
# auto-close, short enough that a leaked credential has a bounded life. The
# trigger for writing this was a live Redis password reaching a terminal
# transcript during incident response on 2026-09-24: rotation is the control
# that makes that survivable rather than permanent.
name: Quarterly secret rotation

on:
  schedule:
    # 09:00 UTC on the 1st of Jan / Apr / Jul / Oct.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
    # Manual run for an off-cycle rotation — after an exposure, a departure,
    # or a vendor advisory. The issue body is identical; only the reason
    # differs, and the operator states it in the issue.

permissions:
  issues: write

jobs:
  open-rotation-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open the rotation issue
        uses: actions/github-script@v7
        with:
          script: |
            const quarter = `${new Date().getUTCFullYear()}-Q${Math.floor(new Date().getUTCMonth() / 3) + 1}`;
            const title = `Secret rotation — ${quarter}`;

            // Idempotent: a manual dispatch in the same quarter as the cron
            // must not mint a second issue. Search rather than assume.
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
            });
            if (existing.data.total_count > 0) {
              core.notice(`${title} already exists: #${existing.data.items[0].number}`);
              return;
            }

            const body = [
              '## Rotate these, then close',
              '',
              'Each item is **rotate, deploy, verify** — a rotated credential that was never deployed is worse than one that was not rotated, because the record says it was.',
              '',
              '### Which of these still needs a person',
              '',
              'Most of this is mechanical and should be automated rather than worked through by hand. It is a checklist today because **secrets live inline in `/opt/inflect/docker-compose.prod.yml`** rather than as `${VAR}` references (#2849), and a script that rewrites production compose by regex is how a rotation becomes an outage. Once that is fixed, the data-plane items below reduce to: write one env file, recreate, verify — and this issue becomes the RECORD of an automated run rather than a list of instructions.',
              '',
              'What will still need a person after that:',
              '',
              '- **Vendor credentials.** Entra, Okta, AD, GitHub — rotation happens at the vendor, often behind a consent screen. Nothing here reaches them.',
              '- **The service window.** Recreating Redis and Postgres is a brief outage. That is a business decision, but it is answerable ONCE in advance rather than every quarter.',
              '',
              '### Production data plane',
              '- [ ] `POSTGRES_PASSWORD` / `DB_PASSWORD` — postgres and the pgbouncer pool must move together, or the pool authenticates with the old value and every query fails',
              '- [ ] Redis `--requirepass` — note the healthcheck passes this on the command line, so it appears in `docker inspect`; rotate both',
              '',
              '### Application',
              '- [ ] `DATA_ENCRYPTION_KEY` — **the procedure exists; use it, do not improvise.** Set `DATA_ENCRYPTION_KEY_PREVIOUS` to the outgoing key so both decrypt, then run key rotation per tenant (`POST /admin/key-rotation`, or `/admin/tenant-dek-rotation` for the DEK sweep). The job re-wraps each `Tenant.encryptedDek` under the new KEK and re-encrypts any remaining `v1:` envelopes. Only retire `DATA_ENCRYPTION_KEY_PREVIOUS` once every tenant has been swept — retiring it early is what makes columns unreadable, not the rotation itself.',
              '- [ ] Integration connection secrets (`secretEncrypted` per `IntegrationConnection`) — these are vendor credentials, so rotation happens at the vendor and then in the connection form',
              '',
              '### Infrastructure',
              '- [ ] AD service account (`svc-inflect`) bind password — lab and any production directory',
              '- [ ] GHCR / registry tokens if any are long-lived',
              '',
              '### Verify, every time',
              '- [ ] `/api/readyz` returns 200 after each deploy',
              '- [ ] A scheduled job completes a full cycle (`identity-sync` at 03:00, `identity-leaver` at 05:00)',
              '- [ ] No authentication errors in `docker logs inflect-app-1` or `inflect-worker-1`',
              '- [ ] The old value no longer appears anywhere: `grep` the compose, `.env.prod`, and `docker inspect` output',
              '',
              '### Record',
              '- [ ] Note which items were rotated and which were deliberately skipped, **with the reason** — a skipped item with a stated reason is a decision; a silently skipped one is a gap that looks like a decision',
              '',
              '---',
              '',
              '**Known hazards, learned the hard way:**',
              '',
              '- The live `/opt/inflect/docker-compose.prod.yml` carries secrets **inline**, not as `${VAR}` references (see #2849). Rotating means editing that file, not just `.env.prod`.',
              '- `docker inspect` exposes command-line credentials. After rotating Redis, confirm the old value is not still visible in a stopped container.',
              '- `DATA_ENCRYPTION_KEY` is safe to rotate **through the dual-KEK path** and dangerous outside it. The failure mode is retiring `DATA_ENCRYPTION_KEY_PREVIOUS` before every tenant is swept, not the key change itself. `v2:` ciphertexts are wrapped under the tenant DEK and are untouched by a master rotation.',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'operations'],
            });
            core.notice(`Opened #${issue.data.number}`);
