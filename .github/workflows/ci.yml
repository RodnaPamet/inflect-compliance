# ───────────────────────────────────────────────────────────────
#  CI — Enterprise-grade pipeline
#  Jobs: lint · typecheck · test · coverage · build · e2e
#        load-smoke · security · codeql · docker · trivy
#
#  Job graph:
#    lint ─────────────┐
#    typecheck ────────┤
#    test ─────────────┤
#    coverage ─────────┼──→ (PR merge gate)
#    build ────────────┤
#      ├──→ e2e ───────┤
#      ├──→ load-smoke ┤
#      └──→ docker ────┤
#           └──→ trivy ┤
#    security ─────────┤
#    codeql ───────────┘
#
#  Runs on PRs, pushes to main, and merge-queue groups.
#
#  Merge-queue lean set (see docs/implementation-notes/2026-08-01-merge-queue.md):
#    RUN  in the queue — changes · lint · typecheck · test · test-summary
#                        · build · security   (the semantic-collision gate)
#    SKIP in the queue — e2e · docker · trivy · codeql   (different failure
#                        class; each already runs on the PR AND on push to main)
#    Already push/schedule-only — coverage · load-smoke.
# ───────────────────────────────────────────────────────────────
name: CI

on:
  # Docs-only changes skip CI entirely — nothing under these paths can
  # affect build/test/e2e output, so running the ~2-hour full pipeline
  # (billed per parallel job-minute) on an impl-note or doc-classification
  # edit is pure waste. Keep this list to TRULY inert paths: `messages/**`
  # (i18n catalogs) and `src/**` DO affect the app + e2e and are NOT here.
  # Note: if a required-status-check ruleset is ever enabled, a docs-only
  # PR won't produce the "CI" check — use a skipped→success shim then.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    # NO paths-ignore here, deliberately — see the push trigger above, which
    # keeps one.
    #
    # A required status check that does not RUN never reports, and GitHub treats
    # "never reported" as not-satisfied. So with `paths-ignore` on this trigger,
    # a docs-only PR ran ZERO jobs from this workflow, none of the required
    # contexts ever reported, and the PR was unmergeable with nothing to click.
    # There is no way to clear it from the PR — only an admin editing branch
    # protection.
    #
    # That is not hypothetical for this repo: docs/implementation-notes/ entries
    # are a documented convention and docs/ carries 660+ classified files, so a
    # docs-only PR is routine.
    #
    # The cost is a full CI run on a PR that only edits prose. That is the price
    # of having enforceable required checks at all, and it is the cheaper side of
    # the trade — the alternative is duplicating every required job name into a
    # stub that reports success when the paths filter misses, which is both
    # fragile and easy to get subtly wrong.
    #
    # The `push` trigger keeps its paths-ignore: nothing gates a push to main on
    # these contexts, so skipping CI for a docs-only release commit costs
    # nothing.
  # ── Merge queue ──
  # Two PRs each pass CI against `main` as it was when their run STARTED.
  # Both merge. Nothing ever tests the combination. Git only objects when
  # the collision is textual, so this class merges clean and lands red on
  # `main` — e.g. PR A's tests exercise an exported helper that PR B
  # renamed, or both bump a different structural-ratchet floor so neither
  # count is right afterwards. The cost isn't the redness; it's that every
  # concurrent PR then inherits failures that aren't theirs.
  #
  # GitHub's merge queue builds a temporary `gh-readonly-queue/main/...`
  # ref of main + everything already queued + the new PR, and merges only
  # if the required checks pass against THAT combination.
  #
  # This trigger MUST exist on every workflow that owns a required status
  # check. A job that SKIPS reports `skipped`, which branch protection
  # counts as a pass; a workflow that never TRIGGERS reports nothing at
  # all, and the required check stays pending forever — the queue hangs
  # and every merge in the repo stalls with no error message. Leanness is
  # achieved INSIDE a triggered workflow (see the per-job `merge_group`
  # skips below), never by leaving a workflow untriggered. Locked by
  # tests/guardrails/merge-queue-trigger-coverage.test.ts.
  #
  # Note: `merge_group` supports no `paths` / `paths-ignore` filter, so a
  # docs-only PR that skips CI on the `pull_request` event WILL run the
  # lean gate on its way through the queue. That is deliberate — a queued
  # merge is a merge into main and gets the same gate as any other.
  #
  # ── SELECTING REQUIRED STATUS CHECKS: what must NEVER be required ──
  # The required set is `Lint` · `Typecheck` · `Test` (the summary job,
  # not `Test (shard N/4)`) · `Build` · `Security`. Two exclusions are
  # not merely "buys nothing" — they would HANG every merge in the repo:
  #
  #   • `Analyze (<language>)` — GitHub-MANAGED code scanning, run from
  #     `dynamic/github-code-scanning/codeql`. There is no workflow file
  #     in this repo to add `merge_group:` to, so the trigger invariant
  #     above cannot be enforced for it and whether it answers a
  #     merge_group event can change without a commit here. Never
  #     require it. (Distinct from this file's own `codeql` job, whose
  #     context is `CodeQL SAST (<language>)` and which is a deliberate
  #     queue SKIP — so that one must not be required either.)
  #   • `Branch freshness (behind-base nudge)` — has no `merge_group`
  #     trigger at all, by design; it is contractually non-blocking.
  #
  # The skipped-in-queue jobs (`E2E`, `Docker Build`, `Trivy Image
  # Scan`, `Coverage`, `Load Smoke`) report `skipped` — a pass — so
  # requiring them would not hang, it would just gate on nothing.
  # `Detect changes` runs but is internal plumbing, not a gate.
  # Locked by tests/guardrails/merge-queue-trigger-coverage.test.ts.
  merge_group:
  # Lets an operator run CI — including the push/schedule-only coverage
  # gate — against a branch on demand. Added 2026-08-05 with the coverage
  # sharding: that path is push-only, so before this it could not be
  # exercised until it had already landed on `main`, where a mistake in it
  # takes main red. Verifying a change to the gate now means dispatching
  # it on the branch first.
  workflow_dispatch:
  # Weekly scheduled scan — GitHub's Code Scanning UI expects a
  # periodic refresh of CodeQL + Trivy results on the default branch,
  # independent of PR cadence. Without this the Security tab can
  # complain about stale analyses. Sunday at 06:00 UTC is during
  # off-hours for the team but during weekday-morning for any
  # security-team triage.
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  # PUSH runs get a per-COMMIT group; everything else stays per-ref.
  #
  # `cancel-in-progress: false` stops GitHub cancelling a RUNNING sibling, but
  # a group still holds only ONE PENDING run: a third push evicts the one
  # waiting in the middle. Every main push shared `ci-refs/heads/main`, so
  # whenever two merges landed inside one run's duration (over an hour now
  # that main adds Coverage shards + Docker Build + Load Smoke + Trivy) the
  # commit between them was cancelled before it ever started.
  #
  # That is worse than a wasted run. Coverage (≥60%) and the Trivy image scan
  # execute ONLY on main pushes, so an evicted commit is never
  # coverage-measured and its image never scanned — and nothing surfaces it,
  # because a cancelled run is not a failed one. It reads exactly like a run
  # that passed. Observed twice on 2026-08-15 (c4eb17d5, and 2639c61b when
  # #1925 merged moments after #1923).
  #
  # Keying pushes on the SHA gives every commit its own group, so nothing
  # queues and nothing is evicted. It costs concurrent runners when merges
  # land in a burst; it does NOT weaken any of the guarantees below, all of
  # which are about not cancelling runs that have already started.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  # NEVER cancel in-progress runs — for pushes OR pull_requests.
  #
  # PR runs: a `synchronize` fires whenever the PR's merge-ref is recomputed
  # (e.g. when `main` advances via semantic-release's per-merge release
  # commit) WITHOUT any new PR commit; cancelling mid-flight produced
  # spurious "Build cancelled".
  #
  # PUSH runs (main): this run UPLOADS code-scanning SARIF — CodeQL
  # (`/language:*`) AND Trivy (`trivy-container-scan`) in the SAME run.
  # When a rapid follow-on push to main (again, the semantic-release bump
  # after each merge) cancelled the in-flight run mid-upload, GitHub left
  # BOTH tools showing "reporting errors / check the status page" on the
  # Security tab even though the scans themselves passed. A half-uploaded
  # SARIF is worse than a duplicate run, so we let push runs finish too.
  #
  # MERGE-QUEUE runs: `github.ref` is the per-entry
  # `refs/heads/gh-readonly-queue/main/pr-<n>-<sha>` ref, so each queued
  # entry already lands in its own concurrency group and nothing can
  # cancel a sibling. `cancel-in-progress: false` is load-bearing here for
  # a second reason: GitHub reports a CANCELLED queue run as a FAILURE,
  # which ejects the PR from the queue and forces a re-queue.
  #
  # Cost: an occasional duplicate full run on stacked commits — the same
  # trade already accepted for PRs, now extended to push for upload safety.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # dependency-review comments
  security-events: write # CodeQL SARIF upload
  actions: read          # CodeQL analysis

# ── CI runner sizing ──
# Heavy jobs read `runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}`.
# On Team / Enterprise plans, set the `LARGE_RUNNER` repository
# variable (Settings → Variables → Actions) to a configured
# GitHub-hosted larger-runner label (e.g. `ubuntu-4core`,
# `ubuntu-8core`). Unset → workflow falls back to the free 2-vCPU
# `ubuntu-latest`, so this file works on every plan.

env:
  NODE_VERSION: "24"
  SKIP_ENV_VALIDATION: "1"
  # The Jest test job runs ~1/4 of ~1650 test files per shard with
  # `jest --runInBand`, which holds every file's module graph in ONE
  # process for the whole shard (no worker recycling —
  # `workerIdleMemoryLimit` is inert in-band), and the coverage job runs
  # the full suite in-band. As the suite grew, the heaviest shard
  # partitions began exceeding Node's default old-space ceiling and OOM'd
  # ("Ineffective mark-compacts near heap limit"). Raise the heap to 6 GB
  # (runners have 16 GB) so suite growth has headroom.
  NODE_OPTIONS: "--max-old-space-size=6144"
  # ── Dummy secrets (CI-only — no real credentials) ──
  AUTH_SECRET: ci-auth-secret-that-is-long-enough
  JWT_SECRET: ci-jwt-secret-that-is-long-enough
  NEXTAUTH_SECRET: ci-auth-secret-that-is-long-enough
  NEXTAUTH_URL: http://localhost:3006
  AUTH_URL: http://localhost:3006
  GOOGLE_CLIENT_ID: ci-google-id
  GOOGLE_CLIENT_SECRET: ci-google-secret
  MICROSOFT_CLIENT_ID: ci-ms-id
  MICROSOFT_CLIENT_SECRET: ci-ms-secret
  MICROSOFT_TENANT_ID: ci-ms-tenant
  UPLOAD_DIR: /tmp/ci-uploads
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3006
  FILE_STORAGE_ROOT: /tmp/ci-uploads

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Job 0: Detect changes — gates the heavy container jobs
  #  Cheap (~30s): checkout + path filter. Its `container` output lets
  #  `docker` + `trivy` skip on PRs that don't touch the image, deps,
  #  or deploy config — the container's OS/library CVE surface only
  #  changes when those do, so per-PR image build + scan is otherwise
  #  redundant. On push/schedule the container jobs run unconditionally
  #  (deploy-image validation + code-scanning SARIF refresh), so this
  #  output only affects pull_request runs.
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `|| 'true'` is the merge-queue fallback. A `merge_group` event
      # carries no base/head pair, so `dorny/paths-filter` has nothing to
      # diff and errors out ("This action requires 'base' input to be
      # configured"). The filter step below is therefore skipped in the
      # queue, which leaves `steps.filter.outputs.container` empty — the
      # fallback resolves that to the CONSERVATIVE value, erring toward
      # running more rather than less. (`docker` skips in the queue on its
      # own explicit condition, so today this fallback is belt-and-braces
      # for any FUTURE consumer of this output.)
      container: ${{ steps.filter.outputs.container || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        # See the output fallback above — no base/head to diff in a queue run.
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            container:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'deploy/**'
              - 'prisma/**'
              - '.github/workflows/ci.yml'

  # ═══════════════════════════════════════════════════════════════
  #  Job 1: Lint — ESLint + Next.js lint rules
  #  Fast, no DB needed. Fails immediately on lint errors.
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Budget = observed max + the npm-ci RETRY path. The 2026-08-03
    # sweep (#1782) scored every job by ceiling / observed maximum and
    # rated this one comfortable — but all 17 sampled runs had a clean
    # `npm ci`, so the sample could not contain the tail that actually
    # fails. On 2026-08-04 Typecheck was cancelled at its 8-minute
    # ceiling on #1786 with "npm ci failed (attempt 1/3) — retrying":
    # the shared setup action retries three times with 10s+20s backoff,
    # which is ~5-7 min of install on a cold cache BEFORE the job's own
    # work starts. A job doing 3 min of work inside an 8-minute budget
    # looks like 2.7x headroom and is one registry blip from red.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint
        run: npm run lint

      # License gate — fails the build if a production dependency ever ships
      # a network-copyleft or non-compete license (AGPL / SSPL / BUSL /
      # Commons Clause) that would poison Inflect's own BUSL-1.1 / hosted
      # distribution. See LICENSING.md.
      - name: "Gate: dependency licenses"
        run: npm run license:check

  # ═══════════════════════════════════════════════════════════════
  #  Job 2: Typecheck — TypeScript strict compilation
  #  Fast, no DB needed. Catches type errors early.
  # ═══════════════════════════════════════════════════════════════
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Budget = observed max + the npm-ci RETRY path. The 2026-08-03
    # sweep (#1782) scored every job by ceiling / observed maximum and
    # rated this one comfortable — but all 17 sampled runs had a clean
    # `npm ci`, so the sample could not contain the tail that actually
    # fails. On 2026-08-04 Typecheck was cancelled at its 8-minute
    # ceiling on #1786 with "npm ci failed (attempt 1/3) — retrying":
    # the shared setup action retries three times with 10s+20s backoff,
    # which is ~5-7 min of install on a cold cache BEFORE the job's own
    # work starts. A job doing 3 min of work inside an 8-minute budget
    # looks like 2.7x headroom and is one registry blip from red.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tsc --noEmit
        run: npm run typecheck

  # ═══════════════════════════════════════════════════════════════
  #  Job 3: Test — Jest unit + integration + architectural guards
  #  Needs Postgres for integration tests.
  #
  #  Sharded across N matrix jobs via `jest --shard=K/N`. The default
  #  TOTAL_SHARDS = 4 turns a ~30-min single-process run into ~4×8-min
  #  parallel runs (each shard owns ~1/N of the suite). Each shard
  #  still runs serially inside its own process (`--runInBand`) to
  #  preserve the test-suite's "one DB per worker" invariant.
  #
  #  When `vars.LARGE_RUNNER` is set on Team / Enterprise plans, the
  #  shards land on the larger runner — combined with sharding,
  #  end-to-end Test time drops from ~30 min → ~3-5 min per PR.
  #
  #  Branch protection: the required check is the "Test" SUMMARY
  #  job below (see `test-summary`), not the matrix members. That
  #  way a future shard-count change doesn't require updating the
  #  required-check set.
  # ═══════════════════════════════════════════════════════════════
  test:
    name: "Test (shard ${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # 35-minute budget. Pre-shard, the unit + integration + guards
    # + contracts suite ran ~24-25m and bumped this to 35m for
    # variance headroom. Each shard now does ~1/N of the work, but
    # we keep the 35m cap as a safety net — the cluster of shards
    # finishes well under that.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-03 — deterministic test key so the startup-encryption-check
      # integration test can simulate NODE_ENV=production with a real
      # key, AND so any future test that asserts prod-only encryption
      # paths works without per-test env mutation. The unit suite still
      # uses the dev fallback under NODE_ENV=test (jest.setup.js sets
      # SKIP_ENV_VALIDATION=1).
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Quality gate: migrations must exist ──
      - name: "Gate: Prisma migrations exist"
        run: |
          COUNT=$(find prisma/migrations -name "migration.sql" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Prisma migrations found in prisma/migrations/"
            exit 1
          fi
          echo "✓ Found $COUNT migration(s)"

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      # ── Apply schema to test DB ──
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      # ── Jest: unit + integration tests (sharded) ──
      # Each matrix worker runs Jest's deterministic 1-of-N hash split.
      # `--shard` keeps each test file on exactly one shard, so per-DB-row
      # fixtures never collide across shards.
      #
      # `JEST_SKIP_RATCHETS=1` drops tests/guards + tests/contracts + most
      # of tests/guardrails from this run — 776 of 1946 files. They were
      # never excluded from the shard glob, so the shards ran all of them
      # AND two later steps ran `tests/guards/` and `tests/contracts/`
      # again, as separate Jest boots that each re-shelled
      # `prisma migrate deploy`. The `ratchets` job below runs them once,
      # with no database. (`rls-coverage` is the single ratchet that reads
      # from Postgres and stays here — see jest.config.js.)
      #
      # WORKER COUNT — `--runInBand` is deliberate, and it is NOT a bug
      # that it leaves `tests/setup/globalSetup.ts`'s per-worker database
      # cloning switched off. That machinery gates on `maxWorkers > 1`, and
      # it exists to make PARALLEL execution safe. Serial execution against
      # one database is already safe; there is nothing for it to protect.
      #
      # This was tried the other way on 2026-08-05 and measured, on hosted
      # 2-core `ubuntu-latest` runners with Postgres in a service container
      # (dispatch run 30973579267 vs `main` run 30939670414). Total Jest
      # work across the four shards:
      #
      #   --runInBand           1876s   (and that run also carried the 776
      #                                  ratchet files these shards no
      #                                  longer run)
      #   --maxWorkers=1/2      4311s   2.3x WORSE, on FEWER files
      #
      # Per shard, same ~293 files: 2 workers 810s, 1 worker 1146s, and
      # `--runInBand` on `main` 463-477s while also running the ratchets.
      # Worker mode loses on both counts here — forking buys no parallelism
      # on 2 cores, and 2 workers adds template-clone cost plus contention
      # with the Postgres container on the same box.
      #
      # If a future runner has more cores, re-measure before switching:
      # the conclusion is about this runner shape, not about Jest.
      - name: "Run tests: unit + integration (shard)"
        env:
          JEST_SKIP_RATCHETS: '1'
        run: npx jest --runInBand --no-coverage --shard=${{ matrix.shard }}/${{ matrix.total }}

  # ═══════════════════════════════════════════════════════════════
  #  Job 3a: Ratchets — the source-text guard suite, ONCE, with no DB
  #
  #  776 of the repo's 1946 test files are ratchets: readFileSync +
  #  regex over source text. They were running twice per push — the
  #  sharded Jest run never excluded them, and two further steps ran
  #  `tests/guards/` and `tests/contracts/` again as separate Jest
  #  boots, each re-shelling `prisma migrate deploy` against a database
  #  that exactly one of them reads from.
  #
  #  Splitting them out buys three things: the duplicate execution is
  #  gone, the shards shed ~40% of their files, and this job needs no
  #  Postgres service, no roles, and no migrations — so it starts
  #  immediately and runs in parallel with everything else.
  #
  #  `rls-coverage` is the one ratchet that queries the database. It
  #  stays with the sharded run (see the lookahead in jest.config.js)
  #  rather than being moved, because six suites and CLAUDE.md cite it
  #  by path.
  # ═══════════════════════════════════════════════════════════════
  ratchets:
    name: Ratchets
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # Observed ~35s locally for the full 776 files. 10 minutes is a
    # generous ceiling that still bounds a hang.
    timeout-minutes: 10
    env:
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No database URL, no `prisma migrate deploy`, no Postgres service.
      # If a ratchet is ever added that needs one, it belongs in the
      # sharded run instead — this job is meant to stay DB-free.
      #
      # On legitimate contract changes:
      #   1. `npm run openapi:generate`         (rewrites public/openapi.json)
      #   2. `npx jest tests/contracts/ -u`     (updates per-schema snapshots)
      #   3. Commit both files together, so the reviewer sees the contract
      #      diff and approves it explicitly.
      - name: "Run tests: architectural guards + API contracts"
        run: |
          npx jest tests/guards tests/guardrails tests/contracts \
            --testPathIgnorePatterns '/node_modules/' 'rls-coverage\.test\.ts' \
            --maxWorkers=2 --forceExit --no-coverage --ci

  # ═══════════════════════════════════════════════════════════════
  #  Job 3b: Test (summary) — single required check for the matrix
  #
  #  GitHub branch-protection rules can target a stable check name;
  #  this job aggregates the matrix shards into one. A future
  #  shard-count change here keeps the required check name the same.
  # ═══════════════════════════════════════════════════════════════
  test-summary:
    name: Test
    # Gates on `ratchets` as well as `test`, and that is load-bearing:
    # this job is the REQUIRED check named "Test" in branch protection.
    # The ratchet suites used to run inside the test shards, so they were
    # already covered by it. Pulling them into their own job (to stop
    # running them 8× per push) would have silently dropped them out of
    # the merge gate — a failing ratchet would have gone red on a check
    # that nothing required. Listing it here keeps the same ground under
    # the same check name, with no branch-protection edit.
    needs: [test, ratchets]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    # The sweep's other finding: this was the ONLY job in the workflow
    # with no ceiling at all, which means it inherited GitHub's default
    # of 360 minutes. It reads `needs.test.result` and exits — observed
    # range across 17 runs is 2-5 SECONDS — so a run that somehow hangs
    # here would burn six hours of runner time before anything stopped
    # it, on the job least able to justify it.
    #
    # 5 minutes is ~60x the observed worst case and still bounds the
    # pathological case. Note this job is the rollup that reports the
    # `Test` check context, so it is a plausible required status check —
    # one more reason it should not be able to hang indefinitely.
    timeout-minutes: 5
    steps:
      - name: Verify every shard succeeded
        # `needs.test.result` is the aggregated status across all
        # matrix variants — `success` only when every shard passed.
        run: |
          failed=0
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more Test shards failed (result=${{ needs.test.result }})"
            failed=1
          fi
          if [ "${{ needs.ratchets.result }}" != "success" ]; then
            echo "::error::Architectural ratchets failed (result=${{ needs.ratchets.result }})"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All Test shards and the ratchet suite passed."

  # ═══════════════════════════════════════════════════════════════
  #  Job 4: Coverage — enforce minimum test coverage threshold
  #  Blocking gate: fails if coverage drops below 60%.
  #
  #  RUNS ON MAIN PUSH + WEEKLY SCHEDULE ONLY.
  #
  #  Rationale: the Test matrix above (sharded) is the per-PR pass/
  #  fail gate; Coverage runs the SAME Jest suite a second time with
  #  instrumentation, adding ~30 min of CPU to every PR for what is
  #  effectively a duplicate signal at the PR level (coverage drift
  #  comes from MERGED code). Catching it on main + nightly is
  #  enough — if a PR causes a regression, the FIRST main push will
  #  block.
  # ═══════════════════════════════════════════════════════════════
  coverage:
    name: "Coverage (shard ${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    # Sharded 4 ways as of 2026-08-05. History of the UNSHARDED job, kept
    # because it is the argument for sharding: 25 → 35 (#716) → 50 on
    # 2026-08-03, after it was cancelled at 35m15s on `main` (2604e5e14)
    # and took main red. It had been sitting at 94-97% of budget and
    # passing for three consecutive runs —
    #
    #   7ad55ee70  32m53s  pass
    #   57e5bda43  33m56s  pass
    #   2604e5e14  35m15s  CANCELLED (hit the 35-min ceiling)
    #
    # — so nothing signalled until it tipped over, and the previous
    # comment's own advice was "shard the coverage run the way `test` is
    # sharded rather than raising this number a fourth time". This is
    # that change. 25 minutes per shard is generous against an expected
    # ~9-12, and leaves the growth headroom the raises were buying.
    #
    # ⚠️ Still `push`/`schedule`-only (see the `if:` above): it does NOT
    # run on pull requests, so a change that slows it stays invisible
    # until it lands on `main`. Sharding makes running it per-PR
    # affordable; that is a deliberate follow-up, not part of this
    # change, because it needs a required-check rename in branch
    # protection (one check became five).
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-03 — see comment on the `test` job above. Same deterministic
      # value so the coverage run sees identical encryption setup.
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      # ── Coverage gate: Jest enforces thresholds via --coverageThreshold ──
      # The threshold values live in `jest.thresholds.json` (single source
      # of truth, also referenced by `jest.config.js`). They are passed
      # via the `--coverageThreshold` CLI flag because jest 29.7.0's
      # `coverageThreshold` config (top-level OR per-project) is silently
      # NOT enforced when `projects:` is set — runs exit 0 even on
      # observed coverage of 9% against a 99% floor. The CLI flag IS
      # enforced (exit 1 + "coverage threshold ... not met" message).
      # Empirical evidence + alternative paths considered:
      # docs/implementation-notes/2026-04-27-gap-15-coverage-enforcement.md
      #
      # Current floors (calibrated 2026-04-27, observed − 3% buffer):
      #   global   branches=56 functions=54 lines=70 statements=69
      #   usecases branches=37 functions=30 lines=49 statements=46
      #   lib      branches=48 functions=48 lines=57 statements=54
      # This shard MEASURES; it does not gate. `--coverageThreshold` here
      # would compare a quarter of the data against floors calibrated on
      # all of it — every shard would report most of `src/` uncovered and
      # fail. The floors are checked once, on the merged total, in the
      # `coverage-gate` job below.
      #
      # `--runInBand`, deliberately — see the `test` job for the measurement.
      - name: "Measure coverage (shard ${{ matrix.shard }}/${{ matrix.total }})"
        run: |
          npx jest --coverage --forceExit --runInBand \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --coverageReporters=json

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-final.json
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  #  Job 4b: Coverage gate — merge the shards, then enforce the floors
  # ═══════════════════════════════════════════════════════════════
  coverage-gate:
    name: "Coverage (≥60%)"
    runs-on: ubuntu-latest
    needs: [coverage]
    # `needs` alone would skip this job when any shard fails, and a
    # skipped required check reads as "not failing". Run whenever the
    # shards were not cancelled, so a failed shard still surfaces here
    # as a failed gate.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      # Merges the four `coverage-final.json` files and compares the total
      # against jest.thresholds.json — reproducing what Jest's own
      # `--coverageThreshold` did before the job was sharded, including
      # the rule that a path group's files are REMOVED from `global`.
      # The expected-shard-count argument is load-bearing: a silently
      # missing shard would read as uncovered code and could only ever
      # make the gate stricter-looking while measuring less.
      # Semantics are pinned by tests/unit/scripts/check-merged-coverage.test.ts.
      - name: "Gate: test coverage thresholds"
        run: npx tsx scripts/check-merged-coverage.ts coverage-shards jest.thresholds.json 4

      # Only kept for post-mortem on a RED run.
      - name: Upload merged coverage inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shards-merged
          path: coverage-shards/
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 5: Build — production build verification
  #  No DB needed. Verifies `next build` succeeds cleanly.
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # Normally ~3.5 min; 15 gives cold-runner headroom without masking a
    # genuine hang (the prior spurious cancels were concurrency, not timeout).
    # 15 -> 25 on 2026-08-04, same retry-path reasoning as Lint /
    # Typecheck above. Observed max is 5m05s, so 15 reads as ample —
    # but a tripped `npm ci` retry (~5-7 min) leaves under 4 minutes of
    # slack, and this job also carries the cold-runner `next build`.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Env validation is INTENTIONALLY skipped at build time.
      # `SKIP_ENV_VALIDATION: "1"` (workflow-level `env:` above)
      # makes `src/env.ts` skip its zod check — CI has only dummy
      # secrets, so a real validation would fail. This is deliberate,
      # not an oversight.
      #
      # The REAL env gate is RUNTIME, not build time:
      #   - `src/env.ts` validates on process start (when
      #     SKIP_ENV_VALIDATION is unset — i.e. in prod);
      #   - `src/instrumentation.ts` runs the GAP-03 fail-fast
      #     startup checks (encryption key, Redis auth, …).
      # A green Build job is therefore NOT an env-config pass —
      # runtime is. See docs/ci-cd-pipeline-integrity.md § Build /
      # env-validation discipline. The posture is locked by
      # tests/guards/ci-pipeline-integrity.test.ts.
      # The webpack/SWC incremental cache. `.next/cache` survives across
      # runs; the rest of `.next` must NOT be restored (a stale BUILD_ID
      # would be published as this SHA's artifact). Falls back to the
      # newest cache for the same lockfile when sources moved.
      #
      # `node_modules` is deliberately NOT cached. Measured on this repo:
      # 1.9 GB across 129k files, which restores no faster than the
      # `npm ci` it would replace — `actions/setup-node`'s `cache: npm`
      # already removes the part that is actually slow (the registry
      # fetch). Caching it would trade ~0 seconds for a stale-tree
      # failure mode.
      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-prod-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-next-prod-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-prod-

      - name: Build Next.js (production)
        # --webpack: nonce strict-CSP chunks (see Dockerfile + impl note).
        run: npx next build --webpack
        env:
          # 8192, matching the `e2e-bundle` build step, and for the reason
          # already measured there: 6144 OOMs a production Next build in this
          # repo — "deterministically at Mark-Compact 6133.6 (6148.6) MB".
          #
          # This job inherited the global 6144 (raised for the JEST SHARDS, a
          # different workload) and had been sitting just under that ceiling.
          # The 2026-08-18 production dependency group pushed it over: OOM twice
          # on fresh runners, while the SAME tree builds fine locally at 6144.
          # Not a dependency defect — a build that had no headroom left.
          #
          # The two build steps in this file now agree. If a third appears, it
          # needs this too; the global default is sized for Jest, not Next.
          NODE_OPTIONS: "--max-old-space-size=8192"
          NODE_ENV: production

      # Hand the compiled app to `load-smoke`, which builds the SAME
      # artifact (`NODE_ENV=production`, no other build-time flags) and
      # was recompiling this SHA from scratch to get it.
      #
      # NOT shared with `e2e`: that job builds with `NEXT_TEST_MODE` and
      # `NEXT_PUBLIC_TEST_MODE` set, and `NEXT_PUBLIC_*` is INLINED at
      # build time — so its bundle is genuinely different, and handing it
      # this one would silently re-enable the onboarding tour and the
      # calendar-badge polling that the test build exists to suppress.
      # A shared artifact there would not fail loudly; it would make
      # `networkidle` stop settling and read as flake.
      - name: Upload .next for reuse
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          # `cache/` is the webpack incremental cache — hundreds of MB that
          # `next start` never reads. It is cached separately (above) for
          # the jobs that BUILD; shipping it here would only slow the
          # upload and the download.
          path: |
            .next
            !.next/cache
          retention-days: 1
          include-hidden-files: true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-logs
          path: .next/trace
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 6a: E2E bundle — compile the test-mode bundle OFF the E2E box
  #
  #  This exists for one reason: `next build` and the E2E job's service
  #  containers do not fit on one runner.
  #
  #  Measured on ubuntu-latest (15,989 MB / 4 vCPU), sampling
  #  /proc/meminfo + the build tree every 1s under NEXT_TEST_MODE
  #  (next.config.js carries the full table): the build peaks at
  #  ~8,070 MB RSS even WITH `webpackMemoryOptimizations`. Below 6 GB of
  #  V8 heap it dies with a clean "Reached heap limit" (verified
  #  2026-08-16 at Mark-Compact 6133.6 MB against a 6144 cap), so the
  #  ceiling cannot come down. Above that, the build plus
  #  postgres:16-alpine plus redis:7-alpine plus a seeded database
  #  periodically exceeded the host and the KERNEL took the runner —
  #  no V8 message, just "received a shutdown signal", once a bare
  #  "Killed". Six of those across three branches on 2026-08-16,
  #  interleaved with successes, while the `build` job compiled the same
  #  app on the same commits every time. Its advantage was never the
  #  ceiling; it was having the runner to itself.
  #
  #  So: no `services:` here. This job gets the box the way `build` does.
  #  The bundle rides to `e2e` as an artifact, exactly as `build` already
  #  hands its output to `load-smoke`.
  #
  #  The bundle is NOT interchangeable with the `build` job's. This one
  #  sets NEXT_TEST_MODE (routing output to `.next-test/`, next.config.js)
  #  and NEXT_PUBLIC_TEST_MODE, and NEXT_PUBLIC_* is INLINED at build
  #  time — so the two artifacts differ in the shipped JS, not just in
  #  where they land. Handing `e2e` the production one would silently
  #  re-enable the onboarding tour and the calendar-badge polling that
  #  test mode exists to suppress; it would not fail loudly, it would
  #  stop `networkidle` settling and read as flake.
  # ═══════════════════════════════════════════════════════════════
  e2e-bundle:
    name: E2E bundle
    # Same event gate as `e2e` — no point building a bundle for a job
    # that is skipped in the merge queue.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # `build` is 25 for the same workload plus cold-runner and npm-retry
    # headroom. This one has the same shape, so it gets the same budget.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # Next reads `.env` at build time, so the NEXT_PUBLIC_* inlining and
      # the i18n/config resolution match what `e2e` expects.
      #
      # NOT byte-identical inputs to the old in-job build, and worth being
      # precise about: that step ALSO inherited the `e2e` job-level env —
      # a live DATABASE_URL on 5432, REDIS_URL, DATA_ENCRYPTION_KEY — and
      # process env beats `.env`, so those won. This job has only the
      # workflow-level env plus `.env.e2e.example`, whose DATABASE_URL
      # points at 5434 with nothing listening and which carries no
      # DATA_ENCRYPTION_KEY.
      #
      # The emitted bundle is unchanged regardless: none of those are
      # NEXT_PUBLIC_*, so none are inlined. And `next build` provably needs
      # no database, no Redis and no key — the `build` job has none of
      # them and compiles this same app green every run.
      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Moved here with the build it belongs to. Keyed exactly as it was
      # in `e2e` so entries written by earlier runs still hit.
      - name: Cache Next.js build cache (test mode)
        uses: actions/cache@v5
        with:
          path: .next-test/cache
          key: ${{ runner.os }}-next-test-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-next-test-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-test-

      - name: Build Next.js app
        # --webpack: match the deployed bundler (nonce strict-CSP chunks).
        run: npx next build --webpack
        env:
          # 8192 stays. The lower bound is measured: 6144 OOM'd
          # deterministically at Mark-Compact 6133.6 (6148.6) MB. What
          # changed is that this process now has the runner to itself, so
          # the ceiling no longer competes with two containers for RSS.
          NODE_OPTIONS: "--max-old-space-size=8192"
          NODE_ENV: production
          NEXT_TEST_MODE: "1"
          # NEXT_PUBLIC_* is inlined at BUILD time, so it must be set on
          # this step — which is now in a different JOB from the tests.
          # That is the whole reason this job exists as its own artifact
          # rather than reusing `build`'s. Mirrors scripts/e2e-local.mjs.
          # Suppresses the Driver.js onboarding tour AND the sidebar
          # calendar-badge polling — both produce background network noise
          # that keeps `waitForLoadState('networkidle')` from settling
          # within the 180s test timeout on slow CI runners.
          NEXT_PUBLIC_TEST_MODE: "1"

      - name: Upload the test-mode bundle
        uses: actions/upload-artifact@v7
        with:
          name: next-test-build-${{ github.sha }}
          # `cache/` is the webpack incremental cache — hundreds of MB
          # that `next start` never reads. Cached separately above for
          # the job that BUILDS; shipping it would only slow both ends.
          path: |
            .next-test
            !.next-test/cache
          retention-days: 1
          include-hidden-files: true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bundle-failure-logs
          path: .next-test/trace
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 6: E2E — Playwright browser tests
  #  Needs: build (validates app compiles before expensive E2E)
  #         e2e-bundle (the test-mode bundle these tests run against)
  # ═══════════════════════════════════════════════════════════════
  e2e:
    name: E2E
    needs: [build, e2e-bundle]
    # ── Merge-queue lean set: SKIP ──
    # E2E is ~17-25 min serial and would be the single longest job in the
    # queue, serialising that cost onto EVERY merge. It also catches a
    # different class than the one the queue exists for: a semantic merge
    # collision surfaces as a compile or unit failure (Typecheck / Test),
    # not as a browser-flow failure that typechecks and unit-passes.
    #
    # Coverage is NOT lost — this job has no event gate, so it runs on the
    # PR AND again on the push to `main` after the merge lands. Skipping
    # here declines a THIRD run, it does not remove a run.
    #
    # Residual risk, stated deliberately: a collision that compiles,
    # passes the unit suite, and only breaks end-to-end still reaches
    # `main` and is caught by the post-merge run rather than pre-merge.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # The Playwright suite runs 2 workers, fullyParallel (see
    # playwright.config.ts:23,48 — mutating specs take an isolated
    # tenant per test via the `isolatedTenant` fixture, so they no
    # longer share seeded state). ~17-25 min wall-clock all-green.
    # 40-min budget gives real headroom for the 2-retry budget
    # without masking failures behind a timeout.
    #
    # (This comment previously claimed "workers: 1, fullyParallel:
    # false". That stopped being true when the e2e isolation work
    # landed; it was describing a serial suite that had already
    # been parallel for months.)
    #
    # E2E sharding was attempted in an earlier revision of this PR
    # and reverted: one shard's slice of specs surfaced a real
    # cross-shard state coupling that needs its own investigation
    # before the matrix is safe to enable. Future follow-up — a
    # dedicated PR can pin state-dependent specs to shard 1 or
    # rework the global-setup to be per-shard idempotent.
    timeout-minutes: 40

    env:
      AUTH_TEST_MODE: "1"
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the e2e CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the e2e CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-13: `next start` refuses to boot in prod without REDIS_URL.
      # The previous `RATE_LIMIT_ENABLED=0` escape hatch was removed
      # (Redis underpins login throttle, invite redemption, BullMQ jobs,
      # session coordination — not just rate limits) — see the docblock
      # in src/instrumentation.ts. The redis service below satisfies
      # the boot check; RATE_LIMIT_ENABLED stays "0" so 429s don't
      # interfere with the auth + UI flow under test.
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      # GAP-03 startup sentinel — the encryption-key check refuses to boot
      # in prod mode without a >=32-char DATA_ENCRYPTION_KEY. Same synthetic
      # CI-only value other jobs in this workflow use (lines 128, 209) so
      # ciphertexts written by one job decrypt under another.
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed test database
        run: npx tsx prisma/seed.ts

      - name: Create upload directory
        run: mkdir -p /tmp/ci-uploads

      # The bundle is built in `e2e-bundle`, on a runner with no service
      # containers, and arrives here as an artifact. See the banner on
      # that job for the measurements — building it HERE is what was
      # getting the runner killed.
      #
      # `next start` finds it because playwright.config.ts's webServer
      # command sets NEXT_TEST_MODE=1, and next.config.js routes
      # `distDir` to `.next-test` under that flag. So the download path
      # below is load-bearing, not cosmetic.
      # `continue-on-error` is here for ONE reason: to let the next step
      # own the failure message. `download-artifact` fails the step when the
      # artifact is absent, and a failed step skips every later step that
      # carries no `if:` — so without this, the verify step below would be
      # SKIPPED in exactly the case it exists for, and the operator would
      # get GitHub's generic "Artifact not found for name: …" instead of
      # the retention/re-run guidance.
      - name: Download the test-mode bundle
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: next-test-build-${{ github.sha }}
          path: .next-test

      # `load-smoke`'s download shape MINUS its rebuild fallback, and the
      # omission is deliberate. A fallback here would rebuild inside this
      # job — the exact thing that was killing the runner — reintroduced
      # silently, and only under the conditions (expired artifact, job
      # re-run alone) that are hardest to notice. load-smoke can afford its
      # fallback because it rebuilds the PRODUCTION bundle in a job with no
      # containers; this one cannot.
      - name: Verify the bundle arrived
        run: |
          if [ ! -f .next-test/BUILD_ID ]; then
            echo "::error::No .next-test/BUILD_ID — the e2e-bundle artifact did not arrive."
            echo "Re-run the whole workflow rather than this job alone: the artifact"
            echo "belongs to the run and has a 1-day retention."
            ls -la .next-test 2>/dev/null || echo "(.next-test does not exist)"
            exit 1
          fi
          echo "bundle ok: BUILD_ID=$(cat .next-test/BUILD_ID)"

      # ── Playwright with browser cache ──
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ── GAP-20: accessibility gate ──
      # The a11y spec runs first as a NAMED step so its pass/fail
      # signal is visible at a glance in the CI annotation, separate
      # from the broader functional E2E suite. The spec itself
      # (`tests/e2e/a11y.spec.ts`) hard-fails on `serious` and
      # `critical` axe violations across login, dashboard, the four
      # main list pages, coverage, and the create-control modal.
      # `moderate` and `minor` findings are LOGGED for triage but
      # do not block — the policy is intentional, see the docblock
      # at the top of the spec.
      # ONE invocation, two projects (`a11y` and `e2e` — see
      # playwright.config.ts). This was two separate `playwright test`
      # processes, which booted the `next start` server twice and ran the
      # seeding global-setup twice — three seeds per run counting the
      # workflow's own step above — purely to get a named step per signal.
      # The projects give that separation inside one process, and each
      # reports its own pass/fail.
      - name: "Run E2E tests (+ accessibility gate — GAP-20)"
        run: npx playwright test
        env:
          CI: "true"

      # ── Artifacts (ON FAILURE ONLY) ──
      # Traces/screenshots/videos are ~150 MB/run and are only useful for
      # debugging a RED run. Uploading them on every green run (the old
      # `!cancelled()`) piled up ~90 GB of Actions storage over the 14-day
      # window. Upload only when the E2E step failed, with a shorter window.
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 6.5: Load Smoke — k6 mutation smoke (10 VUs × 30s)
  #
  #  Runs on every PR + push to main. Catches obvious latency / error
  #  regressions in the highest-traffic mutation paths (control create,
  #  evidence upload) before merge. Full-scale baselines stay in the
  #  on-demand load-test.yml workflow (50 / 100 / 200 VU).
  #
  #  Thresholds (from tests/load/mutations.js, must stay in sync):
  #    p95 < 1500ms (create_control), 2000ms (upload_evidence)
  #    p99 < 3000ms / 4000ms
  #    error-rate < 2% per op, check-rate > 98%
  #
  #  Needs: build (no point smoking the app if it doesn't compile).
  # ═══════════════════════════════════════════════════════════════
  load-smoke:
    name: "Load Smoke (k6)"
    needs: [build]
    # Load smoke is a trend/perf signal, not a per-PR correctness gate —
    # run it on push-to-main + the weekly schedule, not on every PR. (Same
    # push/schedule-only pattern as the `coverage` job.)
    # workflow_dispatch included for the same reason as `coverage`: this
    # job now REUSES the `.next` artifact from `build` instead of
    # recompiling, and it falls back to building if the artifact is
    # missing. That fallback means a broken reuse would not go red — it
    # would quietly rebuild and look identical to success. Being able to
    # dispatch this on a branch is how the reuse gets confirmed rather
    # than assumed.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # 12 -> 25 on 2026-08-04, retry path again — and this was the
    # WORST of the four: observed max 6m13s plus a ~6 min npm-ci retry
    # is ~12 min against a 12-minute ceiling, i.e. zero margin. Being
    # push/schedule-only, it would have failed on `main` rather than on
    # a PR, which is the expensive place to discover it.
    timeout-minutes: 25

    env:
      AUTH_TEST_MODE: "1"
      # Exempts this job from the AUTH_TEST_MODE production-boot refusal
      # (src/instrumentation.ts + src/env.ts). This job legitimately boots a
      # PRODUCTION build with AUTH_TEST_MODE=1 — tests/load/mutations.js drives
      # the real credentials login — and `next start` forces
      # NODE_ENV=production, so it presents to that check exactly as a real
      # production process does.
      #
      # NEXT_TEST_MODE is deliberately NOT used: next.config.js reroutes
      # distDir to `.next-test/` when it is set, and this job starts from the
      # `.next/` artifact the build job published (see the Build step below).
      SYNTHETIC_TEST_HARNESS: '1'
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the load-smoke CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the load-smoke CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-13: `next start` refuses to boot in prod mode without
      # REDIS_URL. The previous RATE_LIMIT_ENABLED=0 escape hatch was
      # removed (see src/instrumentation.ts) — Redis underpins more
      # than rate-limiting. The redis service container below
      # satisfies the boot check; RATE_LIMIT_ENABLED stays "0" so
      # 429 backpressure doesn't interfere with mutation-throughput
      # measurements.
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed test database
        run: npx tsx prisma/seed.ts

      - name: Create upload + results directories
        # .env.e2e.example points UPLOAD_DIR / FILE_STORAGE_ROOT at
        # `./tmp/test-uploads` (matching the e2e job's convention).
        # tests/load/results/ is where mutations.js writes its summary
        # JSON in handleSummary(); without it k6 logs a "no such file"
        # error and the artifact upload step has nothing to collect.
        run: |
          mkdir -p tmp/test-uploads
          mkdir -p tests/load/results

      # Pull the artifact the `build` job published for this SHA. The
      # guarded build below keeps the job self-sufficient if the artifact
      # is absent (expired, or this job re-run on its own).
      - name: Download .next from the build job
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: next-build-${{ github.sha }}
          path: .next

      - name: Build Next.js app
        # Do NOT set NEXT_TEST_MODE=1 here. next.config.js routes the
        # build to `.next-test/` when that env is set; this job runs
        # `next start` directly (no Playwright shim), so the build
        # must land in the default `.next/` directory the start
        # command reads from. The e2e job uses NEXT_TEST_MODE because
        # Playwright's runner expects the test-mode artifact path.
        #
        # This job `needs: [build]`, which already compiled this exact SHA
        # with this exact env — so it downloads that artifact instead of
        # recompiling it. If the download is ever missing (artifact expiry,
        # a re-run of only this job), the fallback build keeps the job
        # self-sufficient rather than failing on a missing directory.
        run: |
          if [ -d .next ] && [ -f .next/BUILD_ID ]; then
            echo "Reusing .next from the build job (BUILD_ID: $(cat .next/BUILD_ID))"
          else
            echo "No usable .next artifact — building"
            npx next build --webpack
          fi
        env:
          NODE_ENV: production

      - name: Start app (background)
        run: |
          nohup npx next start -p 3006 > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App failed to start within 60s. Last 100 lines of log:"
          tail -n 100 /tmp/app.log || true
          exit 1

      # ── k6 smoke: 10 VUs × 30s mutation scenario ──
      # The script's own thresholds gate the run (p95/p99 latency,
      # error rate, check rate). A breach exits non-zero → CI fails.
      - name: "Gate: k6 mutation smoke"
        run: |
          k6 run \
            -e VUS=10 \
            -e DURATION=30s \
            -e RAMP_UP=5s \
            -e RAMP_DOWN=5s \
            -e RUN_ID=ci-${{ github.run_id }}-${{ github.run_attempt }} \
            tests/load/mutations.js

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      # Post-mortem only — a passing smoke run's logs are never read.
      - name: Upload k6 + app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: load-smoke-results-${{ github.run_id }}
          path: |
            tests/load/results/*.json
            /tmp/app.log
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 7: Security — supply chain and dependency checks
  #  npm audit is BLOCKING for high+ severity vulnerabilities.
  # ═══════════════════════════════════════════════════════════════
  security:
    name: Security
    runs-on: ubuntu-latest
    # 5 → 12 on 2026-08-03, from the timeout sweep that followed the
    # Coverage (#1780) and Trivy (#1781) cancellations. This job has
    # never timed out, but it has the FATTEST TAIL in the pipeline —
    # 17 observed runs:
    #
    #   0m54s .. 1m56s   (16 runs, tightly clustered)
    #   3m30s            (1 run — 1.8x the next-highest)
    #
    # Median 1m05s against a 5-minute ceiling reads as luxurious; the
    # ratio that matters is ceiling ÷ WORST case, which was 1.43x —
    # joint-tightest in the whole workflow. The work here is `npm
    # audit` plus dependency-review, both of which are network calls to
    # the npm registry and GitHub; a slow-registry day is exactly the
    # kind of event that produced the 3m30s sample, and nothing says
    # the tail stops there.
    #
    # This is the lesson from the two cancellations generalised: a job
    # sitting at 20% of its budget on a median day tells you nothing
    # about its p99, and a timeout is only ever hit on a bad day.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      # ── Dependency review (PR only) ──
      # Needs GitHub Advanced Security (Dependency graph + GHAS), the same
      # feature CodeQL uploads require — so gate it on CODE_SCANNING_ENABLED
      # too. With GHAS off it errors "Dependency review is not supported";
      # unset/false ⇒ skip. The npm-audit gate below is independent and
      # always runs, so dependency enforcement isn't lost.
      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' && vars.CODE_SCANNING_ENABLED == 'true' }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # CI hardening — retry npm ci on transient registry network errors.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          exit 1

      # ── npm audit: BLOCKING on moderate+ severity (production deps) ──
      # `--omit=dev` scans only the runtime dependency tree, so a
      # MODERATE-or-higher finding here implies an exploitable
      # surface in shipped code. The bar was raised from HIGH+ to
      # MODERATE+ deliberately — moderate-severity CVEs in production
      # deps (postcss XSS, hono middleware bypass, otel/protobuf
      # decoding bugs) are the exact failure mode this gate exists
      # to prevent.
      #
      # Lowering this gate (back to `--audit-level=high` or
      # `=critical`) is a regression —
      # `tests/guardrails/security-gate-strictness.test.ts` fails CI
      # if the gate weakens. If a specific advisory genuinely cannot
      # be fixed today, add a tracked exemption with a written
      # rationale + upgrade plan rather than relaxing the global gate.
      # Runs the SAME gate — `npm audit --omit=dev --audit-level=moderate`
      # on the production tree — but subtracts advisories that have no
      # fixed version, each recorded in security/audit-allowlist.json with
      # a reason, a reachability assessment, a reviewBy date and an upgrade
      # plan. The script fails on an unlisted finding, on an expired entry,
      # AND on an entry that no longer matches anything (so an upstream fix
      # forces the exemption out instead of leaving a standing hole).
      #
      # This is the escape hatch the comment above assumes: the alternative
      # under pressure is dropping the global gate to `high`, which loses
      # every moderate finding at once.
      - name: "Gate: npm audit (moderate+ blocks merge)"
        run: node scripts/audit-gate.mjs

      # ── Full audit (informational — dev deps included) ──
      - name: "Info: npm audit (all deps)"
        run: npm audit --audit-level=critical 2>&1 || echo "::warning::npm audit found vulnerabilities in dev dependencies (see above)"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 8: CodeQL — SAST (Static Application Security Testing)
  #  Scans JavaScript/TypeScript for security vulnerabilities.
  #  Runs on every PR and push to main.
  # ═══════════════════════════════════════════════════════════════
  codeql:
    name: "CodeQL SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CodeQL's `analyze` step uploads SARIF to GitHub code scanning,
    # which requires code scanning to be ENABLED for the repository
    # (needs GitHub Advanced Security on a private repo). Gate the whole
    # job on the `CODE_SCANNING_ENABLED` repository variable so it runs
    # only when the upload can succeed:
    #   • public repo, or private repo WITH Advanced Security → set the
    #     variable to 'true' (Settings → Secrets and variables →
    #     Actions → Variables).
    #   • private repo WITHOUT code scanning → leave it unset; the job
    #     SKIPS cleanly instead of failing the run on a 403 SARIF upload.
    # Unset ⇒ `'' == 'true'` ⇒ false ⇒ skip (safe default). This
    # replaces the old `continue-on-error: true` workaround: when the
    # variable says scanning is on, a real upload failure is still a hard
    # failure (loud, not a silent Security-tab warning).
    #
    # ── Merge-queue lean set: SKIP ──
    # SAST finds injection/taint patterns in the code as written; it does
    # not find "PR A's rename broke PR B's caller" — a different class
    # entirely. Worse, `analyze` UPLOADS SARIF, and in a queue run the
    # analysed ref is the throwaway `gh-readonly-queue/main/pr-<n>-<sha>`
    # branch, so every queued merge would file a code-scanning analysis
    # against a ref that ceases to exist seconds later. This repo has
    # already been burnt once by partial SARIF state leaving BOTH CodeQL
    # and Trivy showing "reporting errors" on the Security tab (see the
    # `concurrency` docblock at the top of this file). CodeQL runs on the
    # PR and again on the push to `main`, so nothing is lost.
    if: ${{ github.event_name != 'merge_group' && vars.CODE_SCANNING_ENABLED == 'true' }}

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          # `.github/codeql/codeql-config.yml` pins the language list,
          # paths-ignore, and query suite. Removes the autodetection
          # mismatch that produced the configuration-error banner —
          # autodetection thought the repo needed `actions` +
          # `javascript` + `typescript` scans on top of
          # `javascript-typescript`; the config file makes the
          # workflow's scope explicit and matches what gets uploaded.
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL auto-builds JavaScript/TypeScript — no manual build needed.
      # The autobuild step handles source extraction.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"

  # ═══════════════════════════════════════════════════════════════
  #  Job 9: Docker — verify the deploy image builds + Trivy-scans it.
  #  Needs: build (no point testing Docker if the app doesn't compile).
  #  Gated: always on push/schedule (deploy-image validation + Trivy
  #  SARIF refresh); on PRs only when container/deps/deploy/prisma paths
  #  changed (see the `changes` job) — a pure app-source PR can't move the
  #  image's CVE surface, so the ~40-min build + scan is redundant there.
  #  `trivy` (needs: docker) skips in lockstep; nothing else needs docker.
  #
  #  ── Merge-queue lean set: SKIP ──
  #  A merge collision does not produce a container-scan finding: the
  #  image's OS/library CVE surface is a property of the base image + the
  #  dependency tree, not of how two source branches interleave. Build +
  #  scan is ~40 + ~12 min of budget — the most expensive thing in the
  #  pipeline — and the pair runs UNCONDITIONALLY on every push to `main`
  #  (this `if` only narrows pull_request runs), so post-merge coverage is
  #  intact. `trivy` needs this job, so it skips in lockstep and its SARIF
  #  upload never targets a throwaway queue ref.
  # ═══════════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    needs: [build, changes]
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || needs.changes.outputs.container == 'true') }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # Roadmap-27 CI hardening — bumped 15 → 25, then 25 → 40 (2026-06-18)
    # after a job was observed hitting the 25 min limit exactly and being
    # cancelled. semantic-release bumps the package.json version on every
    # release, which cache-misses the Docker `npm ci` layer; a cold full
    # install + next build + image layers can exceed 25 min. GHA layer
    # caching is on (cache-from/to: gha) — the cold npm-ci layer after a
    # version bump is unavoidable, so give it real headroom.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # Issue #1005 — reclaim runner disk space. ubuntu-latest ships
      # ~14 GB free; the multi-stage image build plus Trivy's
      # uncompressed-image copy to /tmp need more, and 2026-06-11
      # logged seven 'no space left on device' flakes across Docker
      # Build + Trivy on otherwise-green runs. Dropping the unused
      # preinstalled toolchains reclaims ~25-30 GB. Inline rm -rf of
      # documented runner-image paths only — deliberately NOT a
      # third-party action (supply-chain surface).
      - name: Free runner disk space (issue #1005)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The GHA buildx cache backend (type=gha) intermittently 404s on
      # IMPORT — Azure GC's a layer blob the cache manifest still
      # references, so buildkit aborts with "failed to compute cache key:
      # failed to copy: GET .../actions-cache/... BlobNotFound" and the
      # whole build fails even though nothing is wrong with the image.
      # Two-layer hardening:
      #   - `cache-to: …,ignore-error=true` — a failed cache EXPORT never
      #     fails the build (symmetric flake).
      #   - this step is `continue-on-error` + the cacheless retry below —
      #     if the cache IMPORT 404s, we rebuild without cache-from so a
      #     stale cache reference can't abort an otherwise-fine build. A
      #     genuine build error still fails (the cacheless retry fails too).
      - name: Build Docker image (no push)
        id: docker_build
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          push: false
          tags: inflect-compliance:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # Export the built image as a docker-format tarball so the
          # `trivy` job can `docker load` it instead of rebuilding from
          # scratch. `load:` is removed — each job runs on a fresh runner
          # with no shared daemon, so a local load here would die with
          # this job; the artifact below is the handoff.
          #
          # Left UNCOMPRESSED deliberately: `actions/upload-artifact`
          # already zip-compresses the blob for transfer, and an
          # experiment with buildx `compression=zstd` measured no Trivy
          # speed-up (the ~1.1 GB tar barely shrank and the docker-load
          # decompression offset the smaller download) while adding a
          # docker-load zstd-support dependency. Not worth it.
          outputs: type=docker,dest=/tmp/image-${{ github.sha }}.tar

      # Cache-flake fallback — only runs when the cached build above failed
      # (BlobNotFound on import, or any other error). Rebuilds WITHOUT
      # cache-from so a stale GHA-cache reference can't abort it; if THIS
      # fails too, it's a real build error and the job fails as it should.
      - name: Build Docker image (cacheless retry on cache flake)
        if: steps.docker_build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: inflect-compliance:ci-${{ github.sha }}
          cache-to: type=gha,mode=max,ignore-error=true
          outputs: type=docker,dest=/tmp/image-${{ github.sha }}.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/image-${{ github.sha }}.tar
          # Ephemeral — only exists for the trivy handoff in this run.
          retention-days: 1
          # Fail the build LOUDLY if the export produced nothing, rather
          # than letting trivy run against a missing image.
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  #  Job 10: Trivy — container image vulnerability scanning
  #  Scans the built Docker image for OS and library CVEs.
  #  Blocks on CRITICAL and HIGH severity vulnerabilities.
  #  Needs: docker (image must be built first)
  # ═══════════════════════════════════════════════════════════════
  trivy:
    name: "Trivy Image Scan"
    needs: [docker]
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # The image is built ONCE in the `docker` job and handed over as a
    # tarball artifact — this job `docker load`s it instead of doing a
    # second ~7.5-min rebuild (locked by
    # tests/guardrails/trivy-no-rebuild.test.ts).
    #
    # 12 → 25 on 2026-08-03, after the job was cancelled at 12m18s on
    # `main` (35f3d3970) and took main red. The "12 min is ample
    # headroom" claim it replaces was calibrated against a best case,
    # not the spread. Four consecutive runs:
    #
    #   7ad55ee70   7m45s  pass
    #   57e5bda43  10m13s  pass
    #   2604e5e14   7m15s  pass
    #   35f3d3970  12m18s  CANCELLED (hit the 12-min ceiling)
    #
    # That is VARIANCE, not growth — 7-12 min run to run against a
    # 12-min ceiling. The wall-clock is dominated by things that are
    # not the scan itself: pulling the image tarball artifact, and
    # running trivy-action TWICE (the critical+high gate, then the
    # SARIF report), each of which re-fetches the vulnerability DB.
    # A bigger image (the 46-package production bump) lengthens all
    # of it.
    #
    # If this trips again, the fix is structural rather than another
    # ceiling bump: have the gate step emit the SARIF instead of
    # scanning a second time, so the DB is fetched once.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # Issue #1005 — reclaim runner disk space. ubuntu-latest ships
      # ~14 GB free; the multi-stage image build plus Trivy's
      # uncompressed-image copy to /tmp need more, and 2026-06-11
      # logged seven 'no space left on device' flakes across Docker
      # Build + Trivy on otherwise-green runs. Dropping the unused
      # preinstalled toolchains reclaims ~25-30 GB. Inline rm -rf of
      # documented runner-image paths only — deliberately NOT a
      # third-party action (supply-chain surface).
      - name: Free runner disk space (issue #1005)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      # Reuse the image the `docker` job already built — no rebuild.
      # The tarball was exported there as an artifact; download it and
      # load it into this runner's daemon under the SAME tag Trivy
      # scans (`inflect-compliance:ci-<sha>`).
      - name: Download image tarball
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load image into runner daemon
        run: |
          ls -lh /tmp/image-${{ github.sha }}.tar
          docker load --input /tmp/image-${{ github.sha }}.tar
          docker image ls inflect-compliance

      # ── Trivy scan: BLOCKING on CRITICAL,HIGH ──
      # Container-image scan against OS packages + bundled libraries.
      # Dropping HIGH from the severity list (CRITICAL-only) is a
      # regression — `tests/guardrails/security-gate-strictness.test.ts`
      # fails CI if the gate weakens.
      #
      # `.trivyignore` carries narrow per-CVE exemptions with written
      # reasons + upgrade plans. Exemption entries are the structural
      # escape hatch; never weaken the global severity threshold.
      # (Currently: CVE-2026-33671 in the bundled npm CLI's picomatch,
      # not exploitable from app code; tracked for upgrade in the next
      # Node base-image bump.)
      - name: "Gate: Trivy vulnerability scan (critical+high)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "inflect-compliance:ci-${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: ".trivyignore"

      # ── SARIF upload for GitHub Security tab ──
      # SARIF tier mirrors the gating tier (CRITICAL,HIGH) — not
      # CRITICAL,HIGH,MEDIUM. The MEDIUM tier was uploaded historically
      # as a heads-up channel for not-yet-blocking findings; in practice
      # the only MEDIUMs that appeared were transitive deps of the
      # bundled `npm` CLI inside `node:24-alpine` (brace-expansion
      # ReDoS, ip-address XSS) which we cannot patch from this repo's
      # `package.json` — they retire when the Node base image bumps.
      # The heads-up value was low and the Security-tab noise was
      # high, so cleanup-7 (2026-06-14) aligned SARIF with the gate.
      # Re-adding MEDIUM here is fine in a future diff that also
      # wires actionable triage for it.
      # The SARIF report + its upload feed the GitHub Security tab, which
      # needs code scanning enabled — gate both on CODE_SCANNING_ENABLED
      # (unset ⇒ skip) so a private repo without scanning doesn't fail the
      # job on a 403 upload. `always()` is preserved so the SARIF still
      # ships when the BLOCKING gate scan above found CRITICAL/HIGH. The
      # gate scan itself (which fails the job on findings) is NOT gated —
      # container-vuln enforcement keeps working regardless of scanning.
      - name: "Trivy SARIF report (gate severities)"
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "inflect-compliance:ci-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"
        # `continue-on-error: true` removed (same reasoning as the
        # CodeQL job above): the upload now needs to either succeed
        # or fail the job loudly. Silent upload failures were
        # showing up as "Code scanning configuration error" banners
        # on the Security tab without breaking CI.
