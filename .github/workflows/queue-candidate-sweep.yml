# ───────────────────────────────────────────────────────────────
#  Queue Candidate Sweep — cancel CI for candidates that cannot merge
#
#  When a merge-queue entry is ejected, dequeued, or has its PR closed, its
#  `gh-readonly-queue/<branch>/pr-<n>-<sha>` CI run KEEPS EXECUTING. Those jobs
#  can no longer merge anything and they compete for the same Actions
#  concurrency as the rebuilt candidates of every entry behind them.
#
#  MEASURED, 2026-10-08 13:18Z, with the queue holding three live entries:
#
#    run=37770713725  pr-3264  queued since 11:32  (#3264 MERGED at 12:54)   2 jobs
#    run=37783059584  pr-3276  13:16:27, superseded by 13:17:21              4 jobs
#    run=37783057366  pr-3273  13:16:26, superseded by 13:17:20              4 jobs
#    run=37782902746  pr-3273  13:15:16, superseded                          4 jobs
#                                                                   TOTAL   14 jobs
#
#  Fourteen job slots on candidates that could not merge, against an observed
#  concurrency of ~31-49. Earlier the same day a single ejected candidate held 5
#  of ~20 — a quarter of the pool, spent at the moment scarcity had just been
#  proven by the ejection itself.
#
#  WHY NOT `cancel-in-progress`
#  ───────────────────────────
#  It is deliberately `false` and `ci.yml` documents why: a CANCELLED
#  merge-queue run reports FAILURE, which EJECTS the PR. Merge-queue runs are
#  also per-entry concurrency groups, so nothing supersedes them automatically.
#  The predicate here is "the entry is gone", which no concurrency setting can
#  express.
#
#  WHY THIS JOB IS ALLOWED TO BE WRONG IN ONLY ONE DIRECTION
#  ────────────────────────────────────────────────────────
#  Cancelling an OPERATIVE candidate reports FAILURE and ejects a healthy PR —
#  the exact harm this exists to prevent. So the script keeps anything it cannot
#  prove is dead: an unreadable merge queue cancels NOTHING (unknown is not
#  empty), and an unrecognised ref is kept rather than swept. `--self-test` runs
#  first, so a refactor that breaks the predicate cannot reach the cancel call.
# ───────────────────────────────────────────────────────────────
name: Queue Candidate Sweep

on:
  # EVENT-DRIVEN FIRST, because the schedule provably does not fire here.
  #
  #  #3291, round 2. The `*/15` cron never fired, so #3292 moved it to
  #  `7,37 * * * *` on the theory that step syntax and quarter-hour contention
  #  were the cause. That comment registered a falsifiable prediction. It has
  #  now been falsified: EIGHT consecutive eligible slots, 15:37 through 19:07
  #  on 2026-10-08, produced zero runs. `state=active`, and the same file is
  #  correct on `workflow_dispatch`.
  #
  #  The correlation it was reasoning from survives, and it is sharper than the
  #  fixed-minute-vs-step-syntax axis #3292 picked. Every cron on `main`:
  #
  #    DAILY or less   8 crons   8 of 8 have fired
  #    SUB-DAILY       1 cron    0 of 1 has fired     <- this one, both versions
  #
  #  So the discriminator is CADENCE, not minute syntax — and `7,37` was still
  #  hourly, which is why changing it changed nothing. One data point on the
  #  interesting side is thin evidence for a MECHANISM, and inferring one from
  #  exactly this data is the mistake #3292 already made, so no mechanism is
  #  claimed here. What is claimed is narrower and is what the fix rests on:
  #  nothing sub-daily has ever fired in this repo, so nothing sub-daily can be
  #  load-bearing.
  #
  #  `workflow_run` IS PROVEN TO FIRE HERE — 85 runs, from the since-deleted
  #  `deploy.yml`. It is the one event-driven trigger this workflow can take
  #  without tripping the HANG INVARIANT below, because it publishes no PR check
  #  context.
  #
  #  It also repairs this file's own stated weakness. The previous version noted
  #  that of the three ways an orphan arises, "only one has a webhook at all" —
  #  a close/merge fires `pull_request: closed`, while an EJECTION and a
  #  SUPERSESSION "fire nothing". That is true of `pull_request` and false of
  #  `workflow_run`, which observes all three:
  #
  #    EJECTION      the candidate's CI run concludes (failure)   -> fires
  #    SUPERSESSION  the superseding candidate's run concludes    -> fires
  #    CLOSE/MERGE   the next CI run to conclude, minutes away    -> fires
  #
  #  CI concludes many times an hour here, so worst-case latency drops from the
  #  30 minutes the cron intended (and the infinity it delivered) to roughly one
  #  CI completion.
  workflow_run:
    workflows: [CI]
    types: [completed]

  # WHY NOT `pull_request` — THE HANG INVARIANT
  # ------------------------------------------
  # `tests/guardrails/merge-queue-trigger-coverage.test.ts` locks it: a workflow
  # that runs on `pull_request` publishes a check context, the merge queue then
  # waits for that context on the merge_group candidate, and a workflow without
  # `merge_group:` never produces it. The entry hangs until the timeout ejects
  # it. Adding `merge_group:` instead would run this sweep from inside the queue
  # it is sweeping. The guard offers an exemption list and taking it would need
  # TWO entries, the second because a `pull_request` workflow must also key its
  # concurrency group by ref, which is meaningless for a repo-wide sweep.
  #
  # `workflow_run` has neither problem: the guard reads only `pull_request`
  # workflows (it returns early otherwise), and no check context is published.

  schedule:
    # DAILY, demoted from load-bearing to a floor.
    #
    # This is what the #3292 comment said to do if its prediction failed — "a
    # daily cron plus relying on `workflow_dispatch`, because at that point
    # nothing short of daily is trustworthy here". Honouring that, with
    # `workflow_run` carrying the latency the cron no longer can.
    #
    # Daily is the only cadence with evidence behind it (8 of 8). Offset minute,
    # off the hour, consistent with every cron here that works.
    - cron: '17 3 * * *'

  workflow_dispatch:

permissions:
  contents: read
  # The only write this needs, and the narrowest that can cancel a run.
  actions: write

concurrency:
  # One sweep at a time. Two concurrent sweeps would race on the same cancels —
  # harmless (a second cancel is a 409) but the log becomes unreadable.
  group: queue-candidate-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep orphaned candidates
    # BREAK THE SELF-TRIGGER CYCLE. This job cancels runs; a cancelled run
    # concludes; concluding fires `workflow_run` again. Left alone that is
    # bounded (the second sweep finds nothing in-progress and cancels nothing,
    # so it fires nothing) but it doubles the run count for no information.
    #
    # Skipping `cancelled` costs no real trigger: an EJECTION concludes as
    # `failure` and a merge as `success`. Only a cancellation is skipped, and a
    # cancellation is the one conclusion this workflow itself produces.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Positive control BEFORE the destructive step. Six fixtures, including
      # the two that matter: an unreadable queue must cancel nothing, and of two
      # candidates for one queued PR exactly one must survive.
      - name: Self-test the predicate
        run: node scripts/sweep-orphaned-queue-candidates.mjs --self-test

      # No `npm ci` — the script uses only built-in `fetch`. Installing the tree
      # would add minutes and change nothing it reads.
      - name: Sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUEUE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: node scripts/sweep-orphaned-queue-candidates.mjs --apply

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '### Queue candidate sweep'
            echo
            echo '```'
            node scripts/sweep-orphaned-queue-candidates.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
