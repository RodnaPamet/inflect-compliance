# TEMPORARY, scratch branch only — never merged. Fourth pass: a recreate on the
# populated volume reaches no network, at the shipped limit and hardening.
name: zz tei-embed facts (temporary)
on:
  push:
    branches: [claude/retriever-tei-facts-tmp]
permissions:
  contents: read
jobs:
  offline-recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
      ARGS: --model-id intfloat/multilingual-e5-small --revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 --port 8080 --max-client-batch-size 64 --auto-truncate
      HARD: --cpus 1.0 --cpu-shares 512 --memory 2560m --memory-swap 2560m --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
    steps:
      - name: First start fills the volume
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE" >/dev/null
          docker volume create tei-data >/dev/null
          docker run -d --name tei $HARD -v tei-data:/data -p 127.0.0.1:8080:8080 "$IMAGE" $ARGS >/dev/null
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health && echo "first start healthy"
          docker rm -f tei >/dev/null
      - name: Recreate with no network at all
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run -d --name tei --network none $HARD \
            --health-cmd 'curl -fsS -o /dev/null http://127.0.0.1:8080/health' --health-interval 2s --health-retries 5 \
            -v tei-data:/data "$IMAGE" $ARGS >/dev/null
          for i in $(seq 1 60); do
            docker inspect -f '{{.State.Health.Status}}' tei | grep -q '^healthy' && break
            [ "$(docker inspect -f '{{.State.Running}}' tei)" = false ] && break
            sleep 2
          done
          echo "RESULT no-network recreate: $(docker inspect -f 'health={{.State.Health.Status}} running={{.State.Running}} oom={{.State.OOMKilled}}' tei) after $(( $(date +%s) - start )) s"
          docker logs tei 2>&1 | grep -v -i 'Downloading\|downloaded' | tail -6
          docker logs tei 2>&1 | grep -c -i 'Download failed\|error' || true
          docker exec tei curl -fsS -H 'content-type: application/json' -d '{"model":"intfloat/multilingual-e5-small","input":["query: test"]}' http://127.0.0.1:8080/v1/embeddings | head -c 120; echo
