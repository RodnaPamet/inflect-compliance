#
# The Laya System One server image — built by us, pinned, scanned, published.
#
# WORKFLOW_DISPATCH ONLY, and that is the point. The application image
# publishes on every push to `main` because Watchtower polls `:latest` and that
# is the deploy path. This image is the opposite: it is referenced by DIGEST, so
# a new build changes nothing until somebody edits a Compose file to point at
# the new digest. Building it on a schedule or on every push would produce a
# stream of images nobody pinned, which is noise with a storage bill.
#
# BUILD -> SCAN -> PUSH, on one runner, mirroring `ghcr-publish.yml` and for its
# reason: a scan placed after the push gates nothing, because the artefact is
# already in the registry by the time the scan has an opinion. This image would
# serve a model that reads legacy display names for LOCAL_ONLY tenants, so the
# ordering matters at least as much here.
#
# WHAT THIS WORKFLOW DELIBERATELY DOES NOT DO: deploy. It prints the digest it
# published and stops. Pinning a Compose file to that digest, applying it to the
# VM through `deploy/apply.sh`, and measuring latency on the VM's CPU are all
# separate, reviewed acts — see `deploy/laya/README.md`.
#
name: Laya image

on:
    workflow_dispatch:
        inputs:
            model_revision:
                description: 'Hugging Face revision of convaiinnovations/laya-multilingual'
                required: false
                default: '1720e3e3357cfe1e281542e223f8273b0890ca34'
            package_version:
                description: 'laya package version from PyPI'
                required: false
                default: '0.4.2'

concurrency:
    group: laya-image-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: rodnapamet/inflect-laya

jobs:
    build-scan-push:
        runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
        # The checkpoint is ~1 GB and is baked in, so this is slower than a
        # source build and must not inherit a short default.
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Free runner disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
                  df -h /

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tagged by the INPUTS, not by the git sha: what identifies this
            # image is which package version and which checkpoint revision it
            # contains. Two builds of the same pair from different commits of
            # this repo are the same artefact.
            - name: Build image (load locally, NO push)
              uses: docker/build-push-action@v7
              with:
                  context: deploy/laya
                  file: deploy/laya/Dockerfile
                  push: false
                  load: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:local-scan
                  build-args: |
                      LAYA_PACKAGE_VERSION=${{ inputs.package_version }}
                      LAYA_MODEL_REVISION=${{ inputs.model_revision }}
                  platforms: linux/amd64

            # The same gate the application image passes, at the same strictness
            # (`docs/epic-c-security.md`): CRITICAL and HIGH block.
            - name: Trivy scan (blocks on CRITICAL,HIGH)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:local-scan
                  format: table
                  exit-code: '1'
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  vuln-type: os,library
                  trivyignores: .trivyignore
                  # 15m, matching `ghcr-publish.yml`, and for the reason stated
                  # there: trivy's own 5m default took main red once with
                  # `context deadline exceeded`, and a timeout on a security
                  # gate fails in the worst direction — a re-run that passes
                  # proves only that the runner was faster. Raise the patience,
                  # never the threshold. This image carries a ~1 GB model layer,
                  # so it has more to scan than the application's.
                  timeout: 15m

            - name: Push, now that it has been scanned
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: deploy/laya
                  file: deploy/laya/Dockerfile
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:laya-${{ inputs.package_version }}-${{ inputs.model_revision }}
                  build-args: |
                      LAYA_PACKAGE_VERSION=${{ inputs.package_version }}
                      LAYA_MODEL_REVISION=${{ inputs.model_revision }}
                  platforms: linux/amd64

            # THE DIGEST IS THE OUTPUT OF THIS WORKFLOW. A tag is a moving
            # reference and the governance pillar refuses one for a new image,
            # so the only useful thing to hand a reviewer is the digest to pin.
            - name: Report the digest to pin
              run: |
                  {
                    echo '### Laya image published'
                    echo
                    echo '| field | value |'
                    echo '| --- | --- |'
                    echo "| package | laya[serve]==${{ inputs.package_version }} |"
                    echo "| checkpoint | convaiinnovations/laya-multilingual |"
                    echo "| revision | \`${{ inputs.model_revision }}\` |"
                    echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
                    echo
                    echo 'Pin a Compose service to:'
                    echo
                    echo '```yaml'
                    echo "    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
                    echo '```'
                    echo
                    echo 'Nothing is deployed by this workflow. See `deploy/laya/README.md`.'
                  } >> "$GITHUB_STEP_SUMMARY"
