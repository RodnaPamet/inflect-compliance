# ───────────────────────────────────────────────────────────────
#  Docs sites — one GitHub Pages deployment, two sites:
#    https://rodnapamet.github.io/inflect-compliance/             help for users
#    https://rodnapamet.github.io/inflect-compliance/developers/  for developers
#
#  Builds each site from the ALLOWLIST in site/<site>/manifest.json and
#  deploys both together. A doc is published only when it is listed;
#  site/scripts/stage-docs.js refuses the build if a listed doc is one the
#  owner kept off the sites or carries a production coordinate, and keeps
#  docs/user/ on the user site alone. See docs/docs-site.md.
#
#  BUILD runs on every pull request that touches the docs, the site, the
#  English message catalogue, src/ or the reference generator, so a broken
#  page, a refused doc, a label that no longer exists or a guide whose page was
#  removed fails the PR that caused it. It first generates the reference pages
#  (roles, page inventory, page actions, refusal codes) from the code. This is not a required check: a label rename shows red here
#  without blocking the merge. The publication policy — what may be published
#  at all — is also held on EVERY pull request, whatever it touches, by
#  tests/guardrails/docs-site-publication.test.ts in the Ratchets job.
#
#  DEPLOY runs only on main, and only once GitHub Pages is enabled for the
#  repository with "GitHub Actions" as its source (Settings → Pages). Until
#  then it reports skipped and the build leaves a warning saying why. That
#  setting is a repository admin's act; this workflow never enables Pages
#  itself, because GITHUB_TOKEN cannot and a PAT for it would be a standing
#  admin credential in CI.
# ───────────────────────────────────────────────────────────────
name: Docs site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'CONTRIBUTING.md'
      # The build reads these too: `{{ui:…}}` labels come from the message
      # catalogue, a guide's `route:` must match a page under src/app/, and
      # the reference pages are generated from the permission code, the
      # error classes, the sidebar and every page's API calls.
      - 'messages/en.json'
      - 'src/**'
      - 'prisma/schema/enums.prisma'
      - 'scripts/docs-reference/**'
      - '.github/workflows/docs-site.yml'
  # Not a required check, but every pull_request workflow answers the merge
  # queue so that making it required later can never hang the queue
  # (tests/guardrails/merge-queue-trigger-coverage.test.ts).
  merge_group:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'CONTRIBUTING.md'
      # The build reads these too: `{{ui:…}}` labels come from the message
      # catalogue, a guide's `route:` must match a page under src/app/, and
      # the reference pages are generated from the permission code, the
      # error classes, the sidebar and every page's API calls.
      - 'messages/en.json'
      - 'src/**'
      - 'prisma/schema/enums.prisma'
      - 'scripts/docs-reference/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The developer reference is generated from the application's own code —
      # the generator calls getPermissionsForRole and parses src/ with the
      # TypeScript compiler — so it needs the application's dependencies.
      # Install scripts are skipped: nothing it imports needs a generated
      # Prisma client.
      - name: Install application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The site has its own package.json and lockfile, kept apart from the
      # application's dependency tree.
      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      # Generates the developer reference from the code, stages both sites,
      # builds each, and assembles them: the user site at the root of
      # site/dist/, the developer site under site/dist/developers/.
      - name: Generate, stage and build both sites
        working-directory: site
        run: npm run build

      - name: Say why nothing will deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && !github.event.repository.has_pages
        run: echo "::warning title=Docs sites not deployed::GitHub Pages is not enabled for this repository. A repository admin enables it at Settings → Pages with 'GitHub Actions' as the source, then re-runs this workflow."

      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy docs site
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one in flight: a cancelled
    # Pages deployment can leave the previous site half-replaced.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
