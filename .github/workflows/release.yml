# ───────────────────────────────────────────────────────────────
#  Release — semantic versioning + changelog generation
#
#  Trigger: push to main, while the merge queue has nothing else waiting;
#           plus a daily run, and workflow_dispatch, that release regardless
#  Tool: semantic-release (conventional commits → SemVer)
#
#  What it does:
#    1. Analyzes commits since last release tag
#    2. Determines the version bump from commit types (minor/patch; the
#       major is NOT commit-derived — see below)
#    3. Generates CHANGELOG.md entries
#    4. Creates a GitHub Release with release notes
#    5. Tags the commit with the version (e.g. v1.2.3)
#    6. Updates package.json version
#
#  Commit conventions used:
#    feat(scope): → minor bump
#    fix(scope):  → patch bump
#    perf(scope): → patch bump
#    BREAKING CHANGE: → minor bump (or feat!:) — deliberately NOT a major.
#                       The major is an odometer: the minor climbs to 999 and
#                       the next one rolls it (scripts/lib/minor-cap.mjs). The
#                       major has no machine consumer, so spending one on a
#                       breaking change only shortened the runway — it had cost
#                       902 minors and left major 2 alive for eight hours.
#    chore/refactor/test/docs: → no release (unless grouped)
#
#  This workflow is SEPARATE from deploy — a release does not
#  trigger a deployment. Deploy is triggered by CI completion.
# ───────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  # The backstop for the queue gate below. A busy day can keep the merge queue
  # from ever emptying, and this run releases whatever it holds, so a release
  # is never held for more than a day. 02:41 UTC is the quietest hour for
  # merges here (18-25 Oct 2026), and an off-the-hour minute, like every cron
  # in this repository that fires. Sub-daily crons have never fired here (see
  # queue-candidate-sweep.yml), so daily is the cadence to rely on.
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # create tags, releases, push changelog
  issues: write        # comment on released issues
  pull-requests: write # comment on released PRs

jobs:
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only release from main — skip release-bot commits to prevent loops.
    # A scheduled or manual run has no head_commit; contains() on it is false,
    # so those runs pass.
    if: >
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, 'chore(release)')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Full history for commit analysis
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # CI hardening — retry npm ci on transient registry network errors.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          exit 1

      # ── Release identity ──────────────────────────────────────────
      #  @semantic-release/git pushes the `chore(release)` commit
      #  (CHANGELOG.md · package.json · package-lock.json ·
      #  infra/helm/inflect/Chart.yaml) DIRECTLY to `main`.
      #
      #  `secrets.GITHUB_TOKEN` cannot do that once `main` carries a
      #  ruleset with required status checks: the freshly-pushed release
      #  commit has no passing checks yet, so the push is declined —
      #  `GH006: Protected branch update failed`. Releases then freeze
      #  SILENTLY. This repo lost three merges to exactly that on
      #  2026-06-29, and the failure is worse than a stale version
      #  number: once Chart.yaml stops being synced, the structural guard
      #  at tests/guards/helm-chart-foundation.test.ts fails on EVERY
      #  subsequent PR.
      #
      #  GitHub Actions is not an installable app, so it cannot be named
      #  in a ruleset's bypass list (the API rejects it outright). A
      #  dedicated GitHub App can. This step mints a short-lived
      #  installation token for that app; the app is the ONLY bypass
      #  actor on the ruleset, so its release push is allowed while every
      #  human PR still goes through the merge queue.
      #
      #  Required app permissions: contents:write (push + tags),
      #  issues:write + pull-requests:write (@semantic-release/github
      #  comments on released issues/PRs).
      #
      #  Note the side effect of switching identity: pushes made with
      #  GITHUB_TOKEN never trigger workflows, whereas an App token does.
      #  Harmless here only because the release commit message carries
      #  `[skip ci]`, which GitHub honours for push events — so the
      #  release commit still triggers nothing. Do not remove `[skip ci]`
      #  from the message in .releaserc.json without re-reading this.
      - name: Mint release-bot token
        id: release-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Fail LOUDLY rather than silently, if the app is not configured
      # yet. The fallback below keeps this workflow working on a repo or
      # fork without the app, but that state is precisely the one that
      # freezes releases once the ruleset is enabled — so say so in the
      # run's annotations rather than letting it look healthy.
      - name: Warn when falling back to GITHUB_TOKEN
        if: vars.RELEASE_APP_ID == ''
        run: |
          echo "::warning title=Release bot has no dedicated identity::RELEASE_APP_ID is unset, so semantic-release will push as github-actions[bot]. That push is DECLINED (GH006) the moment main has required status checks. See the Release identity docblock in .github/workflows/release.yml."

      # ── Merge-queue gate ──────────────────────────────────────────
      #  The release commit is pushed straight to main, and every merge-queue
      #  candidate in flight was built on main as it was, so the push
      #  invalidates them all and the queue rebuilds them. Over 18-25 Oct 2026
      #  that was 121 of the 171 cancelled queue runs, and a rebuilt PR waited a
      #  median 61 minutes against 16. So a push releases only when no other
      #  entry is waiting; the merge that empties the queue releases everything
      #  since the last version in one go. That holds for a release that would
      #  raise a coverage floor too: the floor guard holds each change to its
      #  base commit, so a floor that trails the live count fails nothing.
      #  Scheduled and manual runs release regardless. The rule and its edge
      #  cases live in scripts/lib/release-queue-gate.js.
      #
      #  Placed immediately before semantic-release, so the gap between reading
      #  an empty queue and pushing is as short as it can be. Only an explicit
      #  `false` holds the release: a gate that failed to answer releases, as
      #  every push did before it existed.
      - name: Wait for the merge queue
        id: queue-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-queue-gate.mjs

      # semantic-release reads .releaserc.json and does everything:
      # analyze commits → determine version → generate notes → publish
      - name: Run semantic-release
        if: steps.queue-gate.outputs.release != 'false'
        env:
          # App token when configured; GITHUB_TOKEN otherwise (an empty
          # output from a skipped step is falsy, so `||` selects the
          # fallback). Keep these two in the same expression — splitting
          # them across steps reintroduces the silent-freeze mode.
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Post release summary
        if: success() && steps.queue-gate.outputs.release != 'false'
        run: |
          echo "### 📦 Release Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "semantic-release analyzed commits and either:" >> $GITHUB_STEP_SUMMARY
          echo "- Created a new release (check [Releases](/${{ github.repository }}/releases))" >> $GITHUB_STEP_SUMMARY
          echo "- Determined no release-worthy changes exist" >> $GITHUB_STEP_SUMMARY
