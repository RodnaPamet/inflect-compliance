# ───────────────────────────────────────────────────────────────
#  Dependabot — automated dependency updates
# ───────────────────────────────────────────────────────────────
version: 2
updates:
  # ── npm (weekly) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - automated
    # Group updates to reduce PR noise.
    #
    # `applies-to` controls scope:
    #   • omitted          → version-updates only (the default)
    #   • security-updates → CVE-triggered security PRs only
    # A group can target ONE of those; we deliberately keep
    # version-update groups and security-update groups SEPARATE
    # so the weekly version cadence and the on-demand security
    # cadence don't interleave into one PR (mixing routine bumps
    # with urgent CVE fixes makes the review window worse for
    # both).
    groups:
      # ── Version updates (weekly cadence) ──
      # Production deps — review carefully
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Dev deps — lower risk
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Major versions — always individual PRs (handled by default)

      # ── Security updates (on-demand, CVE-triggered) ──
      # Without these groups, Dependabot opens one PR per advisory.
      # During a widespread advisory wave (semver, axios, xml2js,
      # etc.) that can mint 15+ PRs in an afternoon. Grouped
      # security updates collapse them into one PR per dependency-
      # type, so reviewers see the whole batch in one diff and CI
      # gates (typecheck + build + jest + Trivy + CodeQL + npm
      # audit) cover the bundle as a unit.
      production-security:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
      dev-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
    # Ignore known-noisy packages
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-patch"]

      # `conventional-changelog-conventionalcommits` is held below 10.4.0
      # because 10.4.0 CANNOT work here, not because the bump is noisy.
      #
      # The preset at 10.4.0 moves onto `@conventional-changelog/template@1.4.0`
      # and imports `createLegacyWriterGuard` from it. That symbol does not
      # exist in template 1.3.0, which `overrides` pins — and the pin is not
      # optional: template 1.4.0's `mainTemplate` is a handlebars segment
      # naming a helper that `conventional-changelog-writer@8` does not have,
      # so writer@8 throws `Missing helper` while writer@9 ignores it.
      #
      # `@semantic-release/release-notes-generator` depends on
      # `conventional-changelog-writer@^8` at EVERY published version through
      # 14.1.1 (its current latest — there is no 15). So there is no
      # combination of released versions in which preset 10.4.0 renders. Both
      # halves of the pin — the exact `10.3.0` in devDependencies and the
      # `@conventional-changelog/template: 1.3.0` override — have to move
      # together, and cannot move at all until release-notes-generator ships
      # writer@9 support.
      #
      # Without this entry Dependabot re-proposes 10.4.0 every cycle. Each
      # attempt is caught by `scripts/check-release-notes-render.mjs` and each
      # costs a red CI run plus a triage — #2120 landed the break, #2198 is
      # the re-proposal. The floor is scoped rather than blanket so a 10.3.x
      # patch still comes through, and so the entry lifts itself the moment
      # upstream moves: delete it when release-notes-generator depends on
      # writer@9, and let the next PR raise both halves of the pin together.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10.4.0"]

      # `@earendil-works/pi-ai` is held below 0.84.0 because the dependency
      # graph FORBIDS moving it, not because the bump is noisy.
      #
      # `@flue/runtime` and `@earendil-works/pi-agent-core` both require
      # `^0.83.0`. For a 0.x version the caret pins the MINOR — `^0.83.0` means
      # `>=0.83.0 <0.84.0` — so 0.84+ cannot satisfy them. npm answers by
      # installing a nested 0.83.0 beside the hoisted new one, and TypeScript
      # then sees two structurally identical but NOMINALLY different types:
      #
      #   Provider<Api> from the hoisted copy is not assignable to Provider<Api>
      #   from @flue/runtime/node_modules/@earendil-works/pi-ai.
      #
      # There is no released combination that works. `@flue/runtime@2.1.0` is its
      # LATEST published version and still requires `^0.83.0`. An `overrides`
      # entry would "fix" the types by running flue against a minor it never
      # declared support for, which for 0.x is exactly where breaking changes
      # live — so the pin is the honest answer, not a workaround.
      #
      # Without this entry Dependabot re-proposes it every cycle and each attempt
      # costs a red Typecheck plus a triage: #2757 proposed 0.85.1, and #2801
      # came back with 0.86.1 the same day #2794 held the line.
      #
      # Scoped rather than blanket so a 0.83.x patch still comes through, and so
      # it lifts itself: delete this entry once `@flue/runtime` publishes a
      # version accepting a newer pi-ai, and let the next PR raise both together.
      - dependency-name: "@earendil-works/pi-ai"
        versions: [">=0.84.0"]

      # `tldraw` is held below 4.0.0 because its LICENCE changes there, not
      # because the bump is noisy and not because anything breaks.
      #
      # The 3.x line permits "use the Software in your commercial or
      # non-commercial projects" provided the Watermark is not removed, and
      # needs no key. From 4.0.0 production use is BANNED without a paid
      # commercial key, and the SDK ships technical measures that detect
      # deployment environments. So a 4.x bump is not a version regression to
      # weigh against a CVE — it ships licensed software we are not licensed to
      # ship. See #2958 for the per-tag comparison that locates the boundary.
      #
      # WITHOUT THIS ENTRY THE PROPOSAL ARRIVES LABELLED AS A SECURITY FIX,
      # which is the reason a blanket `ignore` is not enough of an answer on its
      # own. `@tiptap/core@2.27.3` is transitive under tldraw 3.x, `npm audit`
      # reports it against GHSA-cp6q-959q-f8rh, and the only way to move a
      # transitive dependency is to move its parent. So Dependabot titles the
      # PR after the advisory and changes the direct dependency two majors —
      # #2990 and its re-proposal #2997, both closed. A red security-labelled
      # PR that reappears every cycle is the shape most likely to be waved
      # through by somebody in a hurry.
      #
      # The advisory it cites does not apply: tiptap backported the fix to 2.x
      # in 2.27.3, published nine days AFTER 3.30.4, and the advisory's upper
      # bound was never amended. `tests/guards/tiptap-proto-merge-is-fixed.test.ts`
      # runs the published attack against every resolved copy on every CI run,
      # so the claim is measured rather than argued.
      #
      # TWO GUARDS ALREADY REFUSE A 4.x TREE — `dependency-risk-review`
      # (tldraw's reviewed major is 3, asserted as exact equality) and the
      # tiptap guard above, whose population control fails when tldraw stops
      # resolving a tiptap of its own. This entry does not replace them; it
      # stops the churn that made them fire.
      #
      # The floor is scoped rather than blanket so every 3.x patch and minor
      # still comes through. DELETE THIS ENTRY the day a tldraw commercial
      # licence exists: 4.x/5.x then become permitted AND ship patched tiptap,
      # so the upgrade is strictly good and the audit exemption in
      # security/audit-allowlist.json retires with it.
      - dependency-name: "tldraw"
        versions: [">=4.0.0"]

      # `@tiptap/core` is held below 3.0.0 to close the ROUTE the entry above
      # cannot reach — not because tiptap 3 is unwelcome.
      #
      # The entry above is keyed on `tldraw`, and that is correct for a
      # version-update. It does not fire on the security-update route, because
      # there Dependabot's SUBJECT is `@tiptap/core` and `tldraw` is merely
      # collateral in resolving it: `@tiptap/core` is transitive under
      # `tldraw@3.x`, and the only way to move a transitive dependency is to
      # move its parent. So the PR arrives titled after the advisory and
      # silently carries `tldraw: ^3.15.6 -> ^5.5.0`, two majors into the range
      # the licence forbids.
      #
      # That is #2990, its re-proposal #2997, and #3029 — three PRs, three
      # closures, and a fourth due next cycle. The tldraw entry's own comment
      # predicted the SHAPE of this ("the proposal arrives labelled as a
      # security fix") and not the mechanism, which is why it kept happening.
      #
      # SAFE BECAUSE THE NAME IS NOT ONE THIS REPO DECLARES. The direct tiptap
      # dependencies are `@tiptap/extension-link`, `@tiptap/extension-placeholder`,
      # `@tiptap/pm`, `@tiptap/react` and `@tiptap/starter-kit`, all already at
      # `^3.31.3` and all different names — they keep updating. `@tiptap/core`
      # is transitive under both those and tldraw, so this blocks a proposal
      # nobody can act on rather than an upgrade somebody wants.
      #
      # The advisory driving it does not apply either: tiptap backported the
      # GHSA-cp6q-959q-f8rh fix to 2.27.3, published nine days AFTER 3.30.4,
      # and the advisory's upper bound was never amended.
      # `tests/guards/tiptap-proto-merge-is-fixed.test.ts` runs the published
      # attack against every resolved copy on every CI run, so the tree's
      # safety is measured rather than asserted here.
      #
      # DELETE THIS ENTRY the day a tldraw commercial licence exists — 4.x/5.x
      # then ship a patched tiptap and the advisory route stops mattering. It
      # retires alongside the tldraw floor above and the audit exemption in
      # `security/audit-allowlist.json`.
      - dependency-name: "@tiptap/core"
        versions: [">=3.0.0"]

  # ── GitHub Actions (monthly) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
